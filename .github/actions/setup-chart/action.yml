# A composite action rather than a shared job: jobs run on separate runners
# with no shared filesystem, so a setup job's work would not reach the jobs
# that need it without artifact plumbing.
name: Setup chart
description: Build the NKTP chart dependencies.

inputs:
  update-dependencies:
    description: Regenerate Chart.lock for a deliberate dependency update.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.20.2

    - name: Build chart dependencies
      shell: bash
      env:
        UPDATE_DEPENDENCIES: ${{ inputs.update-dependencies }}
      run: |
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
        if [[ "${UPDATE_DEPENDENCIES}" == 'true' ]]; then
          helm dependency update nktp --skip-refresh
        else
          helm dependency build nktp --skip-refresh
        fi
