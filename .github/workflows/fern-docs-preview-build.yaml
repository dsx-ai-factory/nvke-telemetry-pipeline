# Workflow 1 of 2 for Fern doc previews.
#
# Collects the docs/ sources, frozen version content and PR metadata from the PR
# branch and uploads them as an artifact. No secrets are used here.
#
# Only PRs from branches in this repository are collected; fork PRs are not
# previewed. The companion workflow (fern-docs-preview-comment.yaml) builds the
# preview with FERN_TOKEN, and the Fern CLI reads any local file a page names
# (for example <Code src="../../x" />), so page content must come from authors
# with write access. That same-repo condition is the control; the comment
# workflow also runs tools/check-docs-paths as defense in depth.
#
# The comment workflow still treats the artifact as untrusted data: it builds
# against fern/ from the default branch and copies in only this artifact's
# docs/ and fern/versions/*-content. The rest of the uploaded fern/ is ignored.

name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-preview-build.yaml'
  ## --- OPTION: NVIDIA copy-PR-bot trigger ---
  ## Replace the pull_request block above with:
  # push:
  #   branches:
  #     - "pull-request/[0-9]+"
  #   paths:
  #     - 'docs/**'
  #     - 'fern/**'
  #     - '.github/workflows/fern-docs-preview-build.yaml'
  ## and switch the "Save PR metadata" step to the copy-PR-bot variant below.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ## --- OPTION: copy-PR-bot changed-files gate ---
  ## Uncomment this job and add "needs: changed-files" +
  ## "if: needs.changed-files.outputs.docs == 'true'" to collect when using
  ## push-to-pull-request/* triggers without paths: filters.
  ## A skipped collect leaves the run "success" with no artifact; the comment
  ## workflow's `check` job handles that, so keep it if you copy these workflows.
  #
  # changed-files:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     docs: ${{ steps.changes.outputs.docs }}
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Check for docs changes
  #       id: changes
  #       run: |
  #         if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
  #           echo "docs=true" >> $GITHUB_OUTPUT
  #         elif git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -qE '^(docs/|fern/)'; then
  #           echo "docs=true" >> $GITHUB_OUTPUT
  #         else
  #           echo "docs=false" >> $GITHUB_OUTPUT
  #         fi

  collect:
    # Same-repo PRs only. The comment workflow builds the preview with FERN_TOKEN
    # and Fern reads any local file a page names, so fork PRs are not previewed.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # runs-on: linux-amd64-cpu8  # NVIDIA self-hosted runner
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.md' > preview-metadata/changed_md_files 2>/dev/null || true
      ## --- OPTION: copy-PR-bot metadata extraction ---
      ## Replace the step above with this when using push-to-pull-request/*:
      # - name: Save PR metadata
      #   env:
      #     BRANCH_NAME: ${{ github.ref_name }}
      #   run: |
      #     mkdir -p preview-metadata
      #     echo "${BRANCH_NAME#pull-request/}" > preview-metadata/pr_number
      #     git diff --name-only "origin/main...HEAD" -- '*.md' > preview-metadata/changed_md_files 2>/dev/null || true

      - name: Checkout frozen version content
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            if git show-ref --verify --quiet "refs/tags/${version}"; then
              mkdir -p "fern/versions/${version}-content"
              git archive "refs/tags/${version}" -- docs/ | tar -x --strip-components=1 -C "fern/versions/${version}-content"
              # Escape {, }, < for MDX — but only outside fenced code blocks and inline code spans
              find "fern/versions/${version}-content" -name '*.md' -print0 | while IFS= read -r -d '' f; do
                awk '
                  /^[ \t]*(```|~~~)/ { fence = !fence; print; next }
                  fence { print; next }
                  {
                    n = split($0, p, "`")
                    out = ""
                    for (i = 1; i <= n; i++) {
                      if (i % 2 == 1) {
                        # Keep braces the author already escaped (\{ must not become \\{).
                        gsub(/\\\{/, "\001", p[i])
                        gsub(/\\\}/, "\002", p[i])
                        gsub(/{/, "\\{", p[i])
                        gsub(/}/, "\\}", p[i])
                        gsub(/</, "\\&lt;", p[i])
                        gsub(/\001/, "\\{", p[i])
                        gsub(/\002/, "\\}", p[i])
                      }
                      out = out p[i]
                      if (i < n) out = out "`"
                    }
                    print out
                  }
                ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              done
              echo "Extracted docs from $version"
            else
              echo "::error::Tag $version not found — cannot load frozen docs content"
              exit 1
            fi
          done

      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fern-preview
          path: |
            fern/
            docs/
            preview-metadata/
          retention-days: 1
