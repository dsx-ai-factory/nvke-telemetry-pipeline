# Validates Fern docs configuration on pull requests.
#
# Runs on every pull request (no trigger-level paths filter) so that making
# "Fern Check" a required status check never leaves PRs that do not touch docs
# stuck pending. The "Detect docs changes" step skips the expensive steps and
# the job still passes when no docs-related files changed.

name: Fern Docs CI

on:
  pull_request:
  workflow_dispatch: {}
  ## --- OPTION: NVIDIA copy-PR-bot trigger ---
  ## Replace the pull_request block above with:
  # push:
  #   branches:
  #     - "pull-request/[0-9]+"
  #   paths:
  #     - 'docs/**'
  #     - 'fern/**'
  #     - 'tools/check-docs-mdx'
  #     - 'tools/check-docs-paths'
  #     - '.github/workflows/fern-docs-ci.yaml'
  ## and add the changed-files gating job below (uncomment the full block).

permissions:
  contents: read

jobs:
  ## --- OPTION: copy-PR-bot changed-files gate ---
  ## Uncomment this job and add "needs: changed-files" +
  ## "if: needs.changed-files.outputs.docs == 'true'" to fern-check when
  ## using push-to-pull-request/* triggers without paths: filters.
  #
  # changed-files:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     docs: ${{ steps.changes.outputs.docs }}
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Check for docs changes
  #       id: changes
  #       run: |
  #         if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
  #           echo "docs=true" >> $GITHUB_OUTPUT
  #         elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
  #           echo "docs=true" >> $GITHUB_OUTPUT
  #         elif git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -qE '^(docs/|fern/)'; then
  #           echo "docs=true" >> $GITHUB_OUTPUT
  #         else
  #           echo "docs=false" >> $GITHUB_OUTPUT
  #         fi

  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    # runs-on: linux-amd64-cpu8  # NVIDIA self-hosted runner
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Depth 2 so HEAD^1 (the base side of the PR merge commit) is available.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # --no-renames lists both sides of a rename. Non-PR events always validate.
          if [ "$EVENT_NAME" = "pull_request" ] && \
             ! git diff --name-only --no-renames HEAD^1 HEAD \
               | grep -qE '^(docs/|fern/|tools/check-docs-mdx$|tools/check-docs-paths$|\.github/workflows/fern-docs-ci\.yaml$)'; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs-related changes; skipping Fern validation."
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

      ## --- OPTION: filename convention check (warning) ---
      # - name: Warn on non-lowercase or underscore markdown filenames
      #   run: |
      #     find docs/ -name "*.md" | while read f; do
      #       base=$(basename "$f")
      #       if echo "$base" | grep -qE '[A-Z]|_'; then
      #         suggested=$(echo "$base" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
      #         echo "::warning file=$f::Filename '$base' should be lowercase with hyphens (e.g. '$suggested')"
      #       fi
      #     done

      ## --- OPTION: filename convention check (hard fail) ---
      # - name: Check markdown filename conventions
      #   run: |
      #     BAD=$(find docs/ -name '*.md' | grep -E '[A-Z_]' || true)
      #     if [ -n "$BAD" ]; then
      #       echo "::error::Markdown filenames must be lowercase with hyphens only:"
      #       echo "$BAD"
      #       exit 1
      #     fi

      - name: Setup Node.js
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        if: steps.changes.outputs.docs == 'true'
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Check MDX safety
        if: steps.changes.outputs.docs == 'true'
        # Add --exclude 'docs/design/*' (fnmatch glob, repeatable) for unpublished docs.
        run: python3 tools/check-docs-mdx docs fern

      - name: Check docs paths
        if: steps.changes.outputs.docs == 'true'
        # Fern reads local files named by a page (<Code src>, images, YAML path:).
        # A path that leaves docs/ would read runner files, including the process
        # environment, in jobs that hold FERN_TOKEN. --allow accepts the scaffold's
        # fern/docs.yml entry (exact match). Add --exclude GLOB for pages that show
        # these patterns as examples. The checker fails closed on YAML it cannot
        # read as plain "key: value" lines.
        run: python3 tools/check-docs-paths --exclude '*docs/examples/*' --allow '../docs/index.yml' docs fern

      - name: Fern check
        if: steps.changes.outputs.docs == 'true'
        run: fern check

      - name: Check MDX validity
        if: steps.changes.outputs.docs == 'true'
        run: fern docs md check

      - name: Check broken links
        if: steps.changes.outputs.docs == 'true'
        run: fern docs broken-links
