name: NVCB Chart Publish NVCR

on:
  push:
    branches: [main]
    tags: ["nvcb/v*"]
    paths:
      - "nvcb/chart/**"
      - ".github/workflows/chart-publish-nvcr.yaml"
      - ".github/workflows/nvcb-chart-publish-nvcr.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nvcb-chart-publish-nvcr-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'dsx-ai-factory/nvke-telemetry-pipeline' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/nvcb/v'))
    # The ceiling for the called workflow: only its release job, which runs on
    # release tags, takes more than contents: read.
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/chart-publish-nvcr.yaml
    with:
      chart: nvcb
    secrets: inherit
