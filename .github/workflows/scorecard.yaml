name: Scorecard

# OpenSSF Scorecard grades repository settings and supply-chain practice. It
# reports and never fails a build. Not run on pull requests: it needs
# repository-level metadata a pull request token should not carry.
on:
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      security-events: write
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # publish_results stays off: publishing lists the score on the OpenSSF
      # API, which only accepts public repositories.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Write the JSON result
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: false

      # Read by the NVIDIA OSS scorecard tool when the OpenSSF API has no
      # record of this repository.
      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard
          path: |
            results.sarif
            results.json
          retention-days: 90

      # Code scanning needs GitHub Advanced Security on internal and private
      # repositories.
      - name: Upload the SARIF to code scanning
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
