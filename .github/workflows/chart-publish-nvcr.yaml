name: Publish Helm Chart to NVCR

# Shared by the NKTP and NVCB publishing workflows.
# Registry environment variables are populated from GitHub secrets.
# Calling workflows can pass these secrets with secrets: inherit.
on:
  workflow_call:
    inputs:
      chart:
        description: Chart to publish (nktp or nvcb).
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.chart }}
    if: github.repository == 'dsx-ai-factory/nvke-telemetry-pipeline'
    runs-on: ubuntu-latest
    environment: nvcr
    timeout-minutes: 10
    env:
      CHART: ${{ inputs.chart }}
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.2

      - name: Resolve chart and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          case "${CHART}" in
            nktp) chart_path=nktp ;;
            nvcb) chart_path=nvcb/chart ;;
            *) echo "::error::Unsupported chart"; exit 1 ;;
          esac
          chart_version="$(helm show chart "${chart_path}" | awk '/^version:/ {gsub(/"/, "", $2); print $2}')"
          case "${GITHUB_REF}" in
            "refs/tags/${CHART}/v"*)
              version="${GITHUB_REF#"refs/tags/${CHART}/v"}"
              if [[ "${version}" != "${chart_version}" ]]; then
                echo "::error::Release tag version must match ${chart_path}/Chart.yaml (${chart_version})"
                exit 1
              fi
              ;;
            refs/heads/main)
              # No release tags are needed for the first development build.
              # Strip build metadata and extend any existing prerelease suffix.
              version="${chart_version%%+*}"
              if [[ "${version}" == *-* ]]; then
                version+=.
              else
                version+=-
              fi
              version+="dev.g${GITHUB_SHA:0:8}"
              ;;
            *) echo "::error::Publish only from main or a matching chart release tag"; exit 1 ;;
          esac
          {
            echo "chart_path=${chart_path}"
            echo "version=${version}"
            echo "release=$([[ "${GITHUB_REF}" == refs/tags/* ]] && echo true || echo false)"
            # Fixed here because "Re-run failed jobs" raises run_attempt for
            # the release job only, and it must still find this attempt's upload.
            echo "artifact=chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build NKTP dependencies
        if: inputs.chart == 'nktp'
        uses: ./.github/actions/setup-chart

      - name: Package and validate
        shell: bash
        env:
          CHART_PATH: ${{ steps.meta.outputs.chart_path }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          helm package "${CHART_PATH}" --version "${VERSION}" --destination "${RUNNER_TEMP}/chart-dist"
          package="${RUNNER_TEMP}/chart-dist/${CHART}-${VERSION}.tgz"
          helm lint "${package}" --strict
          # NVCB is a library chart; it cannot be rendered on its own.
          if [[ "${CHART}" == nktp ]]; then
            helm template nktp "${package}" > "${RUNNER_TEMP}/nktp-rendered.yaml"
          fi
          ( cd "${RUNNER_TEMP}/chart-dist" && sha256sum -- "${CHART}-${VERSION}.tgz" > checksums.txt )
          cat "${RUNNER_TEMP}/chart-dist/checksums.txt"

      - name: Install verified NGC CLI
        env:
          NGC_VERSION: 4.34.10
          # Archive SHA-256 verified against the published setup instructions:
          # https://catalog.ngc.nvidia.com/orgs/nvidia/ngc-apps/resources/ngc_cli/-/setup
          NGC_SHA256: 58bc4d7b6901551a095ce5a43a0065b1c22d5eaf1a164d40029ee3fda11ccd47
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ngccli_linux.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            "https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/${NGC_VERSION}/files/ngccli_linux.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${NGC_SHA256}" "${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}/ngc-install"
          chmod u+x "${RUNNER_TEMP}/ngc-install/ngc-cli/ngc"
          "${RUNNER_TEMP}/ngc-install/ngc-cli/ngc" --version
          echo "${RUNNER_TEMP}/ngc-install/ngc-cli" >> "${GITHUB_PATH}"

      - name: Publish native Helm chart
        shell: bash
        env:
          NKTP_NGC_ORG: ${{ secrets.NKTP_NGC_ORG }}
          NGC_CLI_API_KEY: ${{ secrets.NKTP_NGC_REGISTRY_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Accept an org or org/team, without a scheme, host or chart name.
          if [[ ! "${NKTP_NGC_ORG}" =~ ^[a-z0-9_-]+(/[a-z0-9_-]+)?$ ]]; then
            echo "::error::Set NKTP_NGC_ORG to an NGC org or org/team in the nvcr environment"
            exit 1
          fi
          if [[ -z "${NGC_CLI_API_KEY}" ]]; then
            echo "::error::NKTP_NGC_REGISTRY_TOKEN is not set in the nvcr environment"
            exit 1
          fi
          umask 077
          export NGC_CLI_HOME
          NGC_CLI_HOME="$(mktemp -d "${RUNNER_TEMP}/ngc.XXXXXX")"
          trap 'rm -rf -- "${NGC_CLI_HOME}"' EXIT
          export NGC_CLI_ORG="${NKTP_NGC_ORG%%/*}"
          export NGC_CLI_TEAM=no-team
          if [[ "${NKTP_NGC_ORG}" == */* ]]; then
            export NGC_CLI_TEAM="${NKTP_NGC_ORG#*/}"
          fi
          chart_ref="${NKTP_NGC_ORG}/${CHART}"
          lookup_log="${NGC_CLI_HOME}/chart-info.log"
          # Accept missing target or HTTP 404 messages regardless of case or surrounding text.
          if ! ngc registry chart info "${chart_ref}" > "${lookup_log}" 2>&1; then
            if ! grep -Eiq 'target.*not.*found|client error:[[:space:]]*404[[:space:]]+response' "${lookup_log}"; then
              echo "::error::NGC chart lookup failed; check service-key permissions and registry availability"
              exit 1
            fi
            ngc registry chart create "${chart_ref}" --short-desc "${CHART} Helm chart"
          fi
          # NGC locates the exact chart-name/version .tgz in the current directory.
          ( cd "${RUNNER_TEMP}/chart-dist" && ngc registry chart push "${chart_ref}:${VERSION}" )
          {
            echo "Published ${CHART}:${VERSION} to the native NGC Helm registry."
            echo "Source commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the package for the release
        if: steps.meta.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ runner.temp }}/chart-dist
          retention-days: 1

  # A separate job so the job holding the NVCR token never holds contents: write.
  release:
    name: Release ${{ inputs.chart }}
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      CHART: ${{ inputs.chart }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.publish.outputs.artifact }}
          path: dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ inputs.chart }}-${{ needs.publish.outputs.version }}.tgz

      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" "dist/${CHART}-${VERSION}.tgz.sigstore.json"

      # A draft first, so every asset is uploaded before the release is
      # published; an immutable release rejects assets added afterwards.
      - name: Create the GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.chart }} ${{ needs.publish.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.publish.outputs.version, '-') }}
          # Two charts release from this repository, so neither is "latest".
          make_latest: false
          generate_release_notes: true
          body: |
            The ${{ inputs.chart }} Helm chart, version ${{ needs.publish.outputs.version }}, published to the native NGC Helm registry.

            `${{ inputs.chart }}-${{ needs.publish.outputs.version }}.tgz.sigstore.json` is the build-provenance attestation for the chart archive. Verify it with:

            ```
            gh attestation verify ${{ inputs.chart }}-${{ needs.publish.outputs.version }}.tgz --repo ${{ github.repository }}
            ```
          files: |
            dist/${{ inputs.chart }}-${{ needs.publish.outputs.version }}.tgz
            dist/${{ inputs.chart }}-${{ needs.publish.outputs.version }}.tgz.sigstore.json
            dist/checksums.txt
          fail_on_unmatched_files: true

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false, make_latest: 'false',
            });
