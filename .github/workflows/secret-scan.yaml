name: Secret Scan

on:
  pull_request:
    branches:
      - main
      - "release/nktp-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan Commits for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # gitleaks passes on an empty or unresolvable range.
          for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null \
              || { echo "::error::Commit ${sha} is not in the checkout"; exit 1; }
          done
          count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::No commits in ${BASE_SHA}..${HEAD_SHA}; nothing was scanned"
            exit 1
          fi
          echo "Scanning ${count} commit(s) in ${BASE_SHA}..${HEAD_SHA}"

          # Without first-parent, git log shows no diff for merge commits.
          if ! gitleaks git . --no-banner --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA} --diff-merges=first-parent"; then
            echo "::error::gitleaks found a possible secret. If real, rotate it and tell a maintainer; if not, allowlist it in .gitleaks.toml."
            exit 1
          fi
