name: NKTP Chart CI

on:
  pull_request:
    branches:
      - main
      - "release/nktp-*"
      - "release/nvcb-*"
    paths:
      - 'nktp/**'
      - 'nvcb/chart/**'
      - 'blueprints/**'
      - 'tools/**'
      - 'tests/e2e/**'
      - 'tests/integration/**'
      - 'tests/internal/**'
      - 'tests/go.mod'
      - 'tests/go.sum'
      - 'Taskfile.yml'
      - '.github/actions/setup-chart/**'
      - '.github/workflows/nktp-chart-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  helm:
    name: Lint and Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup chart
        uses: ./.github/actions/setup-chart

      - name: Lint chart
        run: helm lint nktp

      - name: Render templates
        run: helm template nktp nktp

  blueprints:
    name: Default Blueprints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Test the blueprint packager
        working-directory: tools
        run: go test ./...

      - name: Check that nktp/values.yaml has the current blueprints
        working-directory: tools
        run: go run ./package-blueprints -check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup chart
        uses: ./.github/actions/setup-chart

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 33c48cac798e465deda9a66c8e6c07c0973cf53d --verify=false # v1.1.2

      - name: Run unit tests
        run: helm unittest nktp

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup chart
        uses: ./.github/actions/setup-chart

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum

      - name: Prepare Collector image
        shell: bash
        run: |
          docker info >/dev/null
          image="$(helm template redaction nktp --show-only templates/watchdog.yaml | yq -er '.spec.image')"
          docker pull "$image"

      - name: Run integration tests
        working-directory: tests
        env:
          NKTP_REQUIRE_COLLECTOR: "true"
        run: go test -tags integration -count=1 -v -timeout 5m ./integration

  e2e:
    name: End-to-End Tests (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    # Long because the job creates a cluster and pulls every image the chart
    # installs, including the full observability stack of the default backend.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest image the kind version below ships, and newest the bundled Operator supports.
          - kubernetes: '1.34'
            node-image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: '1.36'
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum

      - name: Install Kind and Task
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Create the test cluster
        run: task e2e:up NODE_IMAGE=${{ matrix.node-image }}

      - name: Run end-to-end tests that own the release
        run: task e2e:test

      - name: Diagnose a failed run
        if: failure()
        run: task e2e:diagnose

      - name: Delete the test cluster
        if: always()
        run: task e2e:down
