name: Dependency Review

# Reviews the Go modules and actions a pull request adds or changes. Helm chart
# dependencies are not in GitHub's dependency graph; the Third-Party Notices
# check covers those.
on:
  pull_request:
    branches:
      - main
      - "release/nktp-*"
      - "release/nvcb-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    # The dependency review API needs GitHub Advanced Security on internal and
    # private repositories, so the job runs once the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A deny list: an allow list also fails on every dependency whose
          # license the graph cannot detect.
          deny-licenses: >-
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later,
            SSPL-1.0
          comment-summary-in-pr: on-failure
