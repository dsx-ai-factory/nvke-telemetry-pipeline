name: License Checks

# Not filtered on paths: a new file of any covered type needs a header, and a
# skipped required check never reports.
on:
  pull_request:
    branches:
      - main
      - "release/nktp-*"
      - "release/nvcb-*"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  headers:
    name: License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SPDX headers and LICENSE copies
        run: .github/scripts/check-license-headers.sh

  notices:
    name: Third-Party Notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup chart
        uses: ./.github/actions/setup-chart

      - name: Check nktp/THIRD_PARTY_NOTICES.md against the bundled charts
        run: .github/scripts/check-third-party-notices.sh
