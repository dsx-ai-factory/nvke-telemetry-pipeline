version: 2
# Weekly version updates for Go modules, GitHub Actions, and the NKTP chart's
# Helm dependencies and image references. Vulnerability alerts and security
# update pull requests are controlled separately in repository settings.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /tests
      - /nvcb/tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Released in lockstep, so a failed bump should not block the rest.
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      go-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - k8s.io/*
          - sigs.k8s.io/*

  # Helm chart dependencies and image references in the chart's values.yaml.
  # Keep updates separate: bundled chart versions are deliberate pins, and
  # each bump needs its rendered output, snapshots, and documentation reviewed.
  # This does not maintain versions embedded in Taskfiles or Go source.
  - package-ecosystem: helm
    directory: /nktp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Must match the Operator bundled by opentelemetry-kube-stack. Update
      # this image deliberately alongside that chart, rather than independently.
      - dependency-name: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
