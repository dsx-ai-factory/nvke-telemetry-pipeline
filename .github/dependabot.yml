version: 2
# Weekly version updates for Go modules, GitHub Actions, and the NKTP chart's
# Helm dependencies and image references. Vulnerability alerts and security
# update pull requests are controlled separately in repository settings.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /tests
      - /nvcb/tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Released in lockstep, so a failed bump should not block the rest.
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      go-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - k8s.io/*
          - sigs.k8s.io/*

  # Helm v3 dependencies and image references in the chart's values.yaml.
  # Keep updates separate: bundled chart versions are deliberate pins, and
  # each bump needs its rendered output, snapshots, and documentation reviewed.
  # This does not maintain versions embedded in Taskfiles or Go source.
  - package-ecosystem: helm
    directory: /nktp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Pin owners, rationale, and review triggers:
      # docs/components/dependencies.md#dependency-update-restrictions
      # Owner: NKTP's OTel uninstall hook and Kubernetes compatibility matrix.
      # kubectl 1.35 stays within one minor of both CI clusters (1.34 and 1.36).
      # Revisit this range when changing the tested Kubernetes versions.
      - dependency-name: registry.k8s.io/kubectl
        versions: ['<1.35.0', '>=1.36.0']
      # Owner: NKTP's node-exporter integration. Chart 5 changes container
      # security defaults; review custom capabilities, sidecars, and scraping
      # before admitting that major. Continue receiving updates within 4.x.
      - dependency-name: prometheus-node-exporter
        versions: ['<4.0.0', '>=5.0.0']
      # Owner: the Operator bundled by opentelemetry-kube-stack. Ignore all
      # independent image updates; review and align targetallocator_image.tag
      # with the bundled Operator on every kube-stack upgrade.
      - dependency-name: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
