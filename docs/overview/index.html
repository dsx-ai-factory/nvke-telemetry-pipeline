<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NKTP (NVKE Telemetry Pipeline)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--fg:#e8ece9;--mut:#7c8a83;--g:#76b900;--m:#38bdf8;--l:#fbbf24;--t:#c084fc;--r:#f87171;--self:#a3e635}
html,body{margin:0;height:100%;overflow:hidden;color:var(--fg);
  background:radial-gradient(ellipse at 50% 40%,#111a13 0%,#0a0d0b 60%,#070908 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
[data-in],[data-out],[data-dim],[data-fade],[data-halt]{transition:opacity .6s ease}
/* opacity doesn't apply to a word inside a line of text, so a tspan fades with its fill instead */
tspan[data-in],tspan[data-out]{transition:fill-opacity .6s ease}
tspan.hid{fill-opacity:0}
.scene{opacity:0;visibility:hidden;transform-box:view-box;transform-origin:0 0;transition:opacity .6s ease,visibility 0s .6s}
.scene.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.scene.zoom{opacity:1;visibility:visible;transition:none}
.instant,.instant *{transition:none!important}
.dim{opacity:.14}
.fade{opacity:.4}
.hid{opacity:0}
:where(text:not([fill])){fill:var(--fg)}
.h1{font-size:76px;font-weight:700;letter-spacing:-1px}
.sub{font-size:30px;fill:var(--mut)}
.title{font-size:52px;font-weight:700;letter-spacing:-.5px}
.title.xl{font-size:76px}
.lbl{font-size:22px}
.row{font-size:30px}
.mut{fill:var(--mut)}
.term{font-size:26px;font-weight:700;fill:var(--g)}
.big{font-size:64px;font-weight:700}
.cluster{fill:none;stroke:#3b4a40;stroke-width:2;stroke-dasharray:8 8}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 14;animation:flow 1s linear infinite}
.flow.m{stroke:var(--m)} .flow.l{stroke:var(--l)} .flow.t{stroke:var(--t)} .flow.g{stroke:var(--g)} .flow.s{stroke:var(--self)}
.dot{fill:none;stroke-linecap:round}
.d2{stroke-width:7;stroke-dasharray:0 42;animation:d2 1.6s linear infinite}
.dot.m{stroke:var(--m)} .dot.l{stroke:var(--l)} .dot.t{stroke:var(--t)}
@keyframes d2{to{stroke-dashoffset:-42}}
.rv{fill:none;stroke-linecap:round;stroke-dasharray:0 36;animation:rv .8s linear infinite}
.rv.m{stroke:var(--m)} .rv.l{stroke:var(--l)} .rv.t{stroke:var(--t)}
@keyframes rv{to{stroke-dashoffset:-36}}
.pack{transform-box:fill-box;transform-origin:center;animation:pack 2.4s ease-in infinite}
@keyframes pack{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:.95}78%{transform:translate(var(--dx),var(--dy)) scale(.12);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.12);opacity:0}}
.chip rect{fill:#16201a;stroke:var(--g);stroke-width:2}
.chip text{font-size:22px;font-weight:600}
.escape{transform-box:fill-box;transform-origin:50% 100%;animation:escape 1.8s ease-in-out infinite}
.escape-x{transform-box:fill-box;transform-origin:0 50%;animation:escapex 1.6s ease-in-out infinite}
.dense{stroke-dasharray:2 6}
.sparse{stroke-dasharray:2 30;animation:flowl 2s linear infinite}
@keyframes escape{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7px) rotate(-8deg)}40%{transform:translateY(-1px) rotate(4deg)}60%{transform:translateY(-8px) rotate(7deg)}80%{transform:translateY(-2px) rotate(-3deg)}}
@keyframes escapex{0%,100%{transform:translateX(0)}30%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(2px)}80%{transform:translateX(8px) rotate(-4deg)}}
@keyframes flowl{to{stroke-dashoffset:-32}}
@keyframes flow{to{stroke-dashoffset:-16}}
.stress .flow{animation:stutter 2s ease-in-out infinite}
/* a halted line's dots fade out while nothing flows on it */
.halt{opacity:0}
.stress .flow.l{animation-duration:1.7s} .stress .flow.m{animation-duration:2.3s} .stress .flow.t{animation-duration:1.9s}
.mix3 .flow{stroke-dasharray:1 29;animation:flow30 1.875s linear infinite}
/* a node's lines out carry its pods' line onward: each dot leaves where that line (from x 216, 226 and 236) would have taken it */
.onward .flow.l{animation-delay:-1.125s} .onward .flow.t{animation-delay:-1.75s} .onward .flow.m{animation-delay:-.5s}
.stress .mix3 .flow{animation:stutter30 2s ease-in-out infinite}
@keyframes flow30{to{stroke-dashoffset:-30}}
.split .flow{stroke-dasharray:1 19;animation:flow20 1.25s linear infinite}
@keyframes flow20{to{stroke-dashoffset:-20}}
@keyframes stutter30{0%{stroke-dashoffset:0}15%,35%{stroke-dashoffset:-36}50%,58%{stroke-dashoffset:-72}70%,100%{stroke-dashoffset:-90}}
.stress .lb-ok .flow{animation:flow .2s linear infinite}
.stress .mp .flow{animation:meshpause 6s linear infinite}
.stress .mp.mp-m .flow{animation:meshpause8 8s linear infinite;animation-delay:-3.88s}
.stress .lb-ok.lb-m,.stress .lb-break.lb-m{animation-duration:8s}
.stress .fit-flow{animation-name:fitflow2}
.stress .drain-flow{animation-name:drainflow2}
.stress .mem-fit{animation-name:memfit2}
.gq{transform-box:fill-box;transform-origin:50% 100%}
.stress .gq{animation:gq 6s linear infinite}
.stress .gq.gq-m{animation-duration:8s;animation-delay:-3.88s}
.stress .gq.gq-t{animation-delay:-4.25s}
@keyframes gq{0%{transform:scaleY(.714)}25%,58%{transform:scaleY(.25)}75%,90%{transform:scaleY(.9)}100%{transform:scaleY(.714)}}
@keyframes meshpause8{0%{stroke-dashoffset:0}75%,89%{stroke-dashoffset:-474.42}100%{stroke-dashoffset:-544}}
@keyframes fitflow2{0%,8%{opacity:0}11%,55%{opacity:1}58%,100%{opacity:0}}
@keyframes drainflow2{0%,55%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes memfit2{0%,11%{transform:scaleY(0)}55%,58%{transform:scaleY(.7)}90%,100%{transform:scaleY(0)}}
.stress .mp.mp-t .flow{animation-delay:-4.25s}
@keyframes meshpause{0%{stroke-dashoffset:0}75%,89%{stroke-dashoffset:-362.79}100%{stroke-dashoffset:-416}}
/* the nodes' lines carry a dot every 20, so their pauses run whole multiples of 20 */
.stress .split .mp .flow{animation-name:splitpause}
.stress .split .mp.mp-m .flow{animation-name:splitpause8}
@keyframes splitpause{0%{stroke-dashoffset:0}75%,89%{stroke-dashoffset:-366.28}100%{stroke-dashoffset:-420}}
@keyframes splitpause8{0%{stroke-dashoffset:0}75%,89%{stroke-dashoffset:-470.93}100%{stroke-dashoffset:-540}}
.q-red{animation:qred 8s linear infinite}
.q-green{animation:qgreen 8s linear infinite}
.q-fill{transform-box:fill-box;transform-origin:50% 100%;animation:qfill 8s ease-in-out infinite}
@keyframes qred{0%{opacity:0}3%,50%{opacity:1}53%,100%{opacity:0}}
@keyframes qgreen{0%{opacity:1}3%,50%{opacity:0}53%,100%{opacity:1}}
@keyframes qfill{0%,3%{transform:scaleY(.2)}44%,53%{transform:scaleY(.85)}94%,100%{transform:scaleY(.2)}}
/* one gateway per signal: the logs gateway scales out to three replicas and back to one; while there are three its queue drains and its
   egress runs dense, and while there's one it turns amber, its egress thins and its queue fills */
.rep{animation:rep 8s ease-in-out infinite}
.rep-q{transform-box:fill-box;transform-origin:50% 100%;animation:repq 8s ease-in-out infinite}
.rep-out{animation:repout 8s ease-in-out infinite}
.rep-warn{animation:repwarn 8s ease-in-out infinite}
@keyframes rep{0%,8%{translate:var(--back) 0}14%,58%{translate:0 0}64%,100%{translate:var(--back) 0}}
@keyframes repq{0%,14%{transform:scaleY(1)}50%,64%{transform:scaleY(.1875)}100%{transform:scaleY(1)}}
@keyframes repout{0%,8%{opacity:0}14%,58%{opacity:1}64%,100%{opacity:0}}
@keyframes repwarn{0%,8%{opacity:1}14%,58%{opacity:0}64%,100%{opacity:1}}
.oom-flow{animation:oomflow 8s linear infinite}
.oom-reach{stroke-dasharray:100;animation:oomreach 8s linear infinite}
.oom-fill{transform-box:fill-box;transform-origin:50% 100%;animation:oomfill 8s linear infinite,oomcolor 8s linear infinite}
.oom-x{animation:oomx 8s linear infinite}
.mem-tiny,.mem-fit{transform-box:fill-box;transform-origin:50% 100%;animation:memtiny 8s linear infinite}
.mem-fit{animation-name:memfit}
.fit-flow{animation:fitflow 8s linear infinite}
.drain-flow{animation:drainflow 8s linear infinite}
@keyframes oomflow{0%,10%{opacity:0}12%,62%{opacity:1}63.5%,100%{opacity:0}}
@keyframes oomreach{0%,3%{stroke-dashoffset:100;opacity:1}10%,62%{stroke-dashoffset:0;opacity:1}63.5%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes oomfill{0%,12%{transform:scaleY(0)}62%,100%{transform:scaleY(1)}}
@keyframes oomcolor{0%,62%{fill:#38bdf8}63%,100%{fill:#f87171}}
@keyframes memtiny{0%,11%{transform:scaleY(0)}55%,58%{transform:scaleY(.12)}90%,100%{transform:scaleY(0)}}
@keyframes memfit{0%,11%{transform:scaleY(0)}55%,58%{transform:scaleY(.7)}90%,100%{transform:scaleY(0)}}
@keyframes fitflow{0%,8%{opacity:0}11%,55%{opacity:1}58%,100%{opacity:0}}
@keyframes drainflow{0%,55%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes oomx{0%,62%{opacity:0}64%,100%{opacity:1}}
/* while the OOM plays, nothing flows into or out of the bottom node's dead Collector; the delay matches the cycle's data-at, where the slide opens */
.scene:has(.oom-cycle:not(.hid)) .oom-off{animation:oomoff 8s linear -5.5s infinite}
@keyframes oomoff{0%{opacity:0}2%,62%{opacity:1}63.5%,100%{opacity:0}}
.stress .lb-ok{animation:lbok 6s linear infinite}
.stress .lb-break{animation:lbbreak 6s linear infinite}
.gw-warn{opacity:0}
.stress .gw-warn{animation:gwwarn 6s linear infinite}
.stress .gw-warn.lb-m{animation-duration:8s}
.bp-warn{opacity:0}
.stress .bp-warn{animation:bpwarn 6s linear infinite}
.stress .bp-warn.bp-m{animation-duration:8s}
@keyframes bpwarn{0%,73%{opacity:0}76%,89%{opacity:1}92%,100%{opacity:0}}
@keyframes gwwarn{0%,55%{opacity:0}58%{opacity:1}66%{opacity:.5}74%{opacity:1}82%{opacity:.5}90%{opacity:1}95%,100%{opacity:0}}
@keyframes lbok{0%,55%{opacity:1}58%,87%{opacity:0}90%,100%{opacity:1}}
@keyframes lbbreak{0%,55%{opacity:0}58%,87%{opacity:1}90%,100%{opacity:0}}
@keyframes stutter{0%{stroke-dashoffset:0}15%,35%{stroke-dashoffset:-32}50%,58%{stroke-dashoffset:-64}70%,100%{stroke-dashoffset:-80}}
.wing{fill:#e8ece9;opacity:.85;transform-box:fill-box;animation:flapl .18s ease-in-out infinite alternate}
.wing.l{transform-origin:100% 100%}
.wing.r{transform-origin:0% 100%;animation-name:flapr}
@keyframes flapl{from{transform:rotate(-30deg)}to{transform:rotate(15deg)}}
@keyframes flapr{from{transform:rotate(30deg)}to{transform:rotate(-15deg)}}
.shrink{transform-box:fill-box;transform-origin:center;transition:transform .8s ease-in-out,opacity .25s ease}
.shrink.hid{transform:translate(var(--tx),var(--ty)) scale(var(--sx),var(--sy));opacity:0;transition:transform .8s ease-in-out,opacity .15s ease .9s}
.shrink .face{opacity:0;transition:opacity .25s ease}
.shrink.hid .face{opacity:1;transition:opacity .35s ease .3s}
.arrive{transition:opacity .3s ease}
.arrive:not(.hid){transition:opacity .45s ease .55s}
.arrive.card:not(.hid){transition:opacity .1s ease .8s}
/* navigation: the landing's way in, the strip under every slide, home's stops and the problem's fork */
a{cursor:pointer}
a:focus{outline:none}
.pill rect{fill:#121814;stroke:#334036;stroke-width:2;transition:fill .2s,stroke .2s}
.pill text{font-size:15px}
.pill:hover rect,.pill:focus-visible rect{fill:#16201a;stroke:var(--g)}
.pill.go rect{stroke:var(--g)}
.pill.go:hover rect,.pill.go:focus-visible rect{fill:#1d2b17}
/* on a touch screen Home, Back and Next take taps from well around them, so a thumb finds them */
.pill .hit{fill:none;pointer-events:none}
@media (pointer: coarse){.pill .hit{pointer-events:all}}
.cta > rect{fill:#16201a;stroke:var(--g);stroke-width:2.5;transition:fill .2s}
.cta > text{font-size:22px;font-weight:600}
.cta:hover > rect,.cta:focus-visible > rect{fill:#1d2b17}
.cta .key rect{fill:#121814;stroke:#7c8a83;stroke-width:1.5}
.cta .key text{font-size:16px}
.dest > rect,.choice > rect{fill:#121814;stroke:#334036;stroke-width:2;transform-box:fill-box;transform-origin:center;transition:fill .2s,stroke .2s,scale .25s ease-out}
.dest:hover > rect,.dest:focus-visible > rect,.choice:hover > rect,.choice:focus-visible > rect,.dest.lit > rect,.choice.lit > rect{fill:#16201a;stroke:var(--g);scale:1.06}
.dest{transform-box:fill-box;transform-origin:center;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.dest .done{display:none}
.dest.visited .done{display:inline}
.dest .key{display:none}
.dest.up .key{display:inline}
.key{transition:opacity .15s ease-out}
.pressed .key{opacity:0}
/* a touch screen has no arrow keys to hint at */
@media (pointer: coarse){.key,.dest.up .key{display:none}}
.dest-title{font-size:20px;font-weight:700}
.dest-sub{font-size:15px;fill:var(--mut)}
.choice{transform-box:fill-box;transform-origin:center}
.choice-title{font-size:30px;font-weight:700}
.choice-sub{font-size:20px;fill:var(--mut)}
.lead{font-size:24px;fill:var(--mut)}
/* held upright, a phone shows the slides as a strip across its middle; until dismissed, a note under them suggests turning it */
#turn{display:none;position:fixed;left:50%;bottom:24px;translate:-50% 0;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);
  padding:10px 14px 10px 12px;border:1px solid #334036;border-radius:22px;background:#121814;color:var(--fg);font:inherit;font-size:15px;line-height:1.3;text-align:left;cursor:pointer}
@media (orientation: portrait) and (pointer: coarse){#turn:not(.gone){display:flex}}
#turn svg{flex:none;width:20px;height:20px}
#turn .x{flex:none;color:var(--mut);font-size:18px;line-height:1}
</style>
</head>

  <text class="lead" x="80" y="162" data-out="b-otel">Telemetry comes in three signals: logs, metrics and traces.</text>
  <text class="lead" x="80" y="162" data-in="b-otel" data-out="b-otlp">OpenTelemetry unifies all three signals under one open data model.</text>
  <text class="lead" x="80" y="162" data-in="b-otlp">OTLP pushes all three signals to a backend, over gRPC or HTTP.</text>

<!-- ============ ARCHITECTURE ============ -->
<g class="scene" data-steps="a-ds a-bp a-localq a-localq-no a-egress-out a-gw-hot a-gw-load a-large a-large-wrong a-large-pool a-events a-events-loss a-events-pool a-stress a-sidecars" data-module="architecture">
  <text class="title" x="80" y="110">Architecture</text>
  <text class="lead" x="80" y="162" data-out="a-bp">NKTP's DaemonSet runs a Collector on every node to gather that node's telemetry.</text>
  <text class="lead" x="80" y="162" data-in="a-bp" data-out="a-localq">If the connection to the backend is lost, every node's Collector backs up.</text>
  <text class="lead" x="80" y="162" data-in="a-localq" data-out="a-localq-no">Each node can queue telemetry while the connection is down, then catch up once it's restored.</text>
  <text class="lead" x="80" y="162" data-in="a-localq-no" data-out="a-egress-out">But when a node dies, its queue dies with it, and the telemetry it contains may be lost.</text>
  <text class="lead" x="80" y="162" data-in="a-egress-out" data-out="a-gw-hot">NKTP's gateway buffers in a stable location, so a replacement pod can resume the same queue.</text>
  <text class="lead" x="80" y="162" data-in="a-gw-hot" data-out="a-gw-load">A surge in one signal loads the gateway unevenly, so it may be slow to scale.</text>
  <text class="lead" x="80" y="162" data-in="a-gw-load" data-out="a-large">NKTP runs one gateway per signal, so each one scales quickly with the signal it carries.</text>
  <text class="lead" x="80" y="162" data-in="a-large" data-out="a-large-wrong">Scraping a large target can run its node's Collector out of memory.</text>
  <text class="lead" x="80" y="162" data-in="a-large-wrong" data-out="a-large-pool">The DaemonSet can request more resources, but the extra is reserved on every node, needed or not.</text>
  <text class="lead" x="80" y="162" data-in="a-large-pool" data-out="a-events">NKTP deploys a dedicated pool of Collectors to scrape large targets instead.</text>
  <text class="lead" x="80" y="162" data-in="a-events" data-out="a-events-loss">Cluster events should be read once, so one DaemonSet pod can be elected to read them.</text>
  <text class="lead" x="80" y="162" data-in="a-events-loss" data-out="a-events-pool">But when the leader is lost, failover to a new leader may result in duplicated or skipped events.</text>
  <text class="lead" x="80" y="162" data-in="a-events-pool" data-out="a-stress">NKTP's dedicated pool keeps the reader's state in a stable place, so a new leader resumes where the old one stopped.</text>
  <text class="lead" x="80" y="162" data-in="a-stress" data-out="a-sidecars">NKTP can send its own health reports through itself, but they get stuck along with everything else when it's degraded.</text>
  <text class="lead" x="80" y="162" data-in="a-sidecars">Instead, a watchdog reports NKTP's own health on a priority lane, so you can see when it struggles.</text>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const scenes = [...document.querySelectorAll('.scene')];
  const steps = [];
  for (const s of scenes) {
    s._a = steps.length;
    steps.push(...s.dataset.steps.trim().split(/\s+/));
    s._b = steps.length - 1;
  }
  const at = Object.fromEntries(steps.map((n, i) => [n, i]));
  // a module is every scene with the same data-module, in document order; the title is the landing, the closing scene is home
  const modules = {};
  for (const s of scenes) if (s.dataset.module) (modules[s.dataset.module] ||= []).push(...s.dataset.steps.trim().split(/\s+/));
  const names = { problem: 'The Problem', otel: 'OTel 101', architecture: 'Architecture', dependencies: 'Dependencies', owners: 'Service Owners', not: 'What NKTP Is Not' };
  // home's Next walks these in order; OTel 101 is reached only from the problem's fork, where it is the way on by default,
  // and hands back to the deeper problem
  const tour = ['problem', 'architecture', 'dependencies', 'owners', 'not'];
  const fork = `#problem/${modules.problem.indexOf('p-otel') + 1}`, deeper = `#problem/${modules.problem.indexOf('pa') + 1}`;
  // whether the reader came to the step after the fork through OTel 101, so that Back from there retraces it
  let toured = false;
  // the section the reader was last in, so that Back from home reopens it at its last step
  let recent = null;
  const keys = ['in', 'out', 'dim', 'undim', 'fade', 'unfade', 'stress', 'unstress', 'halt', 'unhalt'];
  const els = [...document.querySelectorAll('[data-in],[data-out],[data-dim],[data-fade],[data-stress],[data-halt]')];
  for (const e of els) {
    for (const k of keys) {
      const n = e.dataset[k];
      if (n && !(n in at)) console.warn('Unknown step name:', n, e);
    }
  }
  const range = (d, on, off) => !!d[on] && cur >= at[d[on]] && (!d[off] || cur < at[d[off]]);
  let cur = 0, shown = -1, back = null, next = '#home', was = null, settle = null, lastStop = null;
  const visited = new Set();
  const replaySteps = new Set([...document.querySelectorAll('[data-replay]')].map(e => e.dataset.replay));
  const restarts = [...document.querySelectorAll('[data-restart]')];
  // entering a replay step rewinds the SMIL clock, so its animations play from their begin times again;
  // entering a restart step puts that group's CSS animations (not its fade-in) at the given second of their cycle
  function replay() {
    if (steps[shown] !== steps[cur]) {
      if (replaySteps.has(steps[cur])) stage.setCurrentTime(0);
      for (const e of restarts) {
        if (e.dataset.restart !== steps[cur]) continue;
        for (const a of e.getAnimations({ subtree: true })) if (a.animationName) a.currentTime = e.dataset.at * 1000;
      }
    }
    shown = cur;
  }
  function show(i) {
    cur = i;
    // a scene coming on takes its step's look at once, so nothing left from a visit to another step fades out inside it
    const entering = scenes.filter(s => !s.classList.contains('on') && cur >= s._a && cur <= s._b);
    for (const s of entering) s.classList.add('instant');
    for (const s of entering) for (const e of s.querySelectorAll('.pressed')) e.classList.remove('pressed');

  // the landing page opens into home: its words fade, all but NKTP, which glides up into home's corner, and then home's stops

  function unfold(landing, home, inward) {

    const stops = [...home.querySelectorAll('.dest')], label = home.querySelector('.lbl');
    const a = big.getBBox(), b = home.querySelector('.h1').getBBox(), dx = b.x - a.x, dy = b.y - a.y;
    const W = 250, M0 = 150, M1 = 850, G = 80, D = 300, T = M1 + (stops.length - 1) * G + D;

    if (a.screen === 'home' && b.screen === 'landing') return unfold(sb, sa, false);
    if (a.screen === 'home' && b.m) return zoom(card(b.m), sb, true);
    if (a.m && b.screen === 'home') return zoom(card(a.m), sa, false);

  }
  function route() {

    if (settle) settle();

    if (from) travel(from, r);
  }
  function render(r) {

      show(at.title);
      vis(false, 'nav');
      return;
    }

      const up = tour.find(m => !visited.has(m)) || tour[(tour.indexOf(lastStop) + 1) % tour.length];

      vis(false, 'nav');

    backend: [...new Set(river().map(g => g.parentNode))].flatMap(g => [...g.querySelectorAll(':scope > use[href="#backend"], :scope > .lbl')]),
    cta: document.querySelector('.scene[data-steps="title"] .cta'),
  });
  // stops the fill under way, wherever it has got to; harmless once it is over

  // the landing page opens on an empty river that fills from the left at the river's own pace: each stream is uncovered just ahead of
  // its leading dot, so no dot appears or vanishes on the way in, until every stream reaches its end. The backend waits out of sight and
  // comes alive as the first dots reach it. Both rivers share all of it, so the landing page and home still trade places unseen

    const at = (s, x) => { let lo = 0, hi = s.getTotalLength(); for (let n = 0; n < 40; n++) { const m = (lo + hi) / 2; s.getPointAtLength(m).x < x ? lo = m : hi = m; } return lo; };

  // the slowest is four steps down, so stepping back up returns to the river's own pace
