# Replace the endpoint and Secret name for your backend. The Secret must
# contain ca.crt, tls.crt, and tls.key.
# Helm replaces volume and mount lists. Preserve the internal server credentials
# for gateway ingress, client credentials for sidecar-to-watchdog export, and the queue mount.
gateway_logs:
  kubernetes:
    podSecurityContext:
      fsGroup: 10001
    volumes:
      - name: internal-tls-server
        secret:
          secretName: nktp-gateway-logs-server-tls
          items:
            - { key: tls.crt, path: tls.crt }
            - { key: tls.key, path: tls.key }
            - { key: ca.crt, path: ca.crt }
      - name: internal-tls-client
        secret:
          secretName: nktp-gateway-logs-client-tls
          items:
            - { key: tls.crt, path: tls.crt }
            - { key: tls.key, path: tls.key }
            - { key: ca.crt, path: ca.crt }
      - name: backend-tls
        projected:
          defaultMode: 0440
          sources:
            - secret:
                name: backend-tls
                items:
                  - { key: ca.crt, path: ca.crt }
                  - { key: tls.crt, path: tls.crt }
                  - { key: tls.key, path: tls.key }
    volumeMounts:
      - name: internal-tls-server
        mountPath: /etc/nktp/internal-tls/server
        readOnly: true
      - name: queue
        mountPath: /var/lib/otelcol/queue
      - name: backend-tls
        mountPath: /etc/nktp/backend-tls
        readOnly: true
  otelcol:
    config:
      exporters:
        otlp_grpc:
          endpoint: telemetry.example.com:4317
          tls:
            insecure: false
            ca_file: /etc/nktp/backend-tls/ca.crt
            cert_file: /etc/nktp/backend-tls/tls.crt
            key_file: /etc/nktp/backend-tls/tls.key
            reload_interval: 1m

