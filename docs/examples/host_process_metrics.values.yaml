# Enables per-process host metrics on the node Collector with every privilege
# and mount the process scraper can use. Read
# ../guides/enable_host_process_metrics.md first: this widens the Collector's
# privileges and produces high-cardinality metrics. Each privilege is optional;
# the guide lists the data it provides and the mute option to set when it is
# left out.
daemonset:
  kubernetes:
    securityContext:
      capabilities:
        add:
          - SYS_CHROOT # Retained for the journald receiver. Helm replaces lists.
          - SYS_PTRACE # Executable paths and disk I/O of other processes.
          - DAC_READ_SEARCH # Disk I/O of processes that do not run as root.
      appArmorProfile:
        type: Unconfined # The runtime default profile can deny reads of host processes.
    # Helm replaces lists, so the chart's default volumes and mounts are restated
    # with host-passwd added.
    volumes:
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      - name: journalctl
        hostPath:
          path: /usr/bin/journalctl
          type: File
      - name: host-lib
        hostPath:
          path: /lib
          type: Directory
      - name: host-lib64
        hostPath:
          path: /lib64
          type: DirectoryOrCreate
      - name: host-usr-lib
        hostPath:
          path: /usr/lib
          type: Directory
      - name: host-machine-id
        hostPath:
          path: /etc/machine-id
          type: File
      - name: host-logs
        hostPath:
          path: /var/log
          type: Directory
      - name: host-passwd # Resolves process.owner for users defined on the node.
        hostPath:
          path: /etc/passwd
          type: File
      - name: internal-tls-client
        secret:
          secretName: nktp-daemonset-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
      - name: log-checkpoints
        hostPath: {path: /var/lib/nktp/log-checkpoints, type: DirectoryOrCreate}
    volumeMounts:
      - name: pod-logs
        mountPath: /var/log/pods
        readOnly: true
      - name: host-proc
        mountPath: /hostfs/proc
        readOnly: true
      - name: journalctl
        mountPath: /hostfs/usr/bin/journalctl
        readOnly: true
      - name: host-lib
        mountPath: /hostfs/lib
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/lib64
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/usr/lib64
        readOnly: true
      - name: host-usr-lib
        mountPath: /hostfs/usr/lib
        readOnly: true
      - name: host-machine-id
        mountPath: /hostfs/etc/machine-id
        readOnly: true
      - name: host-logs
        mountPath: /hostfs/var/log
        readOnly: true
      - name: host-passwd
        mountPath: /etc/passwd # The scraper reads the container's /etc/passwd, not root_path.
        readOnly: true
      - {name: internal-tls-client, mountPath: /etc/nktp/internal-tls/client, readOnly: true}
      - {name: log-checkpoints, mountPath: /var/lib/otelcol/log-checkpoints}
  otelcol:
    config:
      receivers:
        host_metrics:
          root_path: /hostfs
          collection_interval: 1m
          scrapers:
            process:
              mute_process_exe_error: true # Kernel threads have no executable.
              mute_process_user_error: true # Container user IDs are not in the node's /etc/passwd.
              resource_attributes:
                process.command_line:
                  enabled: false # Do not export process arguments.
      service:
        pipelines:
          metrics/process:
            receivers: [host_metrics]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp_grpc/metrics]
