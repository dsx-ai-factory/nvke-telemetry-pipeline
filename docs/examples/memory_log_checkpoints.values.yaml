# Keep node log read positions in memory. Restarts use each receiver's start_at.
# Helm replaces lists; preserve custom host and TLS mounts when combining values.
# See ../guides/configure_daemonset_log_checkpoints.md.
daemonset:
  kubernetes:
    # Helm replaces lists; retain host-log and TLS mounts when customizing.
    volumes:
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      - name: journalctl
        hostPath:
          path: /usr/bin/journalctl
          type: File
      - name: host-lib
        hostPath:
          path: /lib
          type: Directory
      - name: host-lib64
        hostPath:
          path: /lib64
          type: DirectoryOrCreate
      - name: host-usr-lib
        hostPath:
          path: /usr/lib
          type: Directory
      - name: host-machine-id
        hostPath:
          path: /etc/machine-id
          type: File
      - name: host-logs
        hostPath:
          path: /var/log
          type: Directory
      - name: internal-tls-client
        secret:
          secretName: nktp-daemonset-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
    volumeMounts:
      - name: pod-logs
        mountPath: /var/log/pods
        readOnly: true
      - name: host-proc
        mountPath: /hostfs/proc
        readOnly: true
      - name: journalctl
        mountPath: /hostfs/usr/bin/journalctl
        readOnly: true
      - name: host-lib
        mountPath: /hostfs/lib
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/lib64
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/usr/lib64
        readOnly: true
      - name: host-usr-lib
        mountPath: /hostfs/usr/lib
        readOnly: true
      - name: host-machine-id
        mountPath: /hostfs/etc/machine-id
        readOnly: true
      - name: host-logs
        mountPath: /hostfs/var/log
        readOnly: true
      - name: internal-tls-client
        mountPath: /etc/nktp/internal-tls/client
        readOnly: true
  otelcol:
    config:
      extensions:
        file_storage/log-checkpoints: null
      receivers:
        file_log:
          storage: null
        file_log/host-auth:
          storage: null
        file_log/host-audit:
          storage: null
        file_log/kube-api-audit:
          storage: null
        file_log/targetallocator:
          storage: null
        file_log/operator:
          storage: null
        journald:
          storage: null
      service:
        extensions: [health_check]
