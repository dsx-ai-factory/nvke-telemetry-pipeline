# xlarge sizing for gateways, watchdog, node and large-target collectors,
# cluster events, their Target Allocators and KSM.
# Apply before deployment overrides. Use with the matching chart release.
# Helm replaces env lists, so required variables are included.
watchdog:
  kubernetes:
    replicas: 2
    autoscaler:
      minReplicas: 2
      maxReplicas: 16
      targetCPUUtilization: 75
      targetMemoryUtilization: 75
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
          - type: Percent
            value: 200
            periodSeconds: 15
          - type: Pods
            value: 8
            periodSeconds: 15
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '4'
        memory: 1Gi
    targetAllocator:
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: '1'
          memory: 2Gi
      replicas: 1
    env:
    - name: GOMEMLIMIT
      value: 192MiB
    - name: GOGC
      value: '50'
  otelcol:
    config:
      exporters:
        otlp_grpc:
          sending_queue:
            queue_size: 85899346
