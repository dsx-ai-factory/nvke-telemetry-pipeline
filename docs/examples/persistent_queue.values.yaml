# Select an SSD-backed StorageClass for the default persistent exporter queues.
# Replace your-ssd-class below with a StorageClass in your cluster.
# See "Size the volumes" in docs/guides/configure_exporter_queue_storage.md.

watchdog:
  kubernetes:
    volumeClaimTemplates: # Helm replaces lists; include the complete claim template.
      - metadata:
          name: queue
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: your-ssd-class
          resources:
            requests:
              storage: 1Gi

