version: "3"

vars:
  # Each suite brings up its own cluster, so this is here to keep the one thing
  # that must not differ between them in one place: the Kubernetes version they
  # all run. Without it each caller inherits whatever the installed kind binary
  # defaults to, and two clusters in the same repository drift apart silently.
  # Oldest Kubernetes tested in CI. Override with NODE_IMAGE=<image>.
  NODE_IMAGE: '{{.NODE_IMAGE | default "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"}}'
  CERT_MANAGER_VERSION: v1.21.2

tasks:
  install:
    desc: Install or update NKTP from the local chart with explicit cluster inputs
    vars:
      # Callers set HELM_VALUES_DIR to their own directory. Direct invocations
      # resolve relative paths from the repository root.
      RESOLVED_HELM_VALUES_FILE: "{{if .HELM_VALUES_FILE}}{{if isAbs .HELM_VALUES_FILE}}{{.HELM_VALUES_FILE}}{{else}}{{.HELM_VALUES_DIR | default .ROOT_DIR}}/{{.HELM_VALUES_FILE}}{{end}}{{end}}"
    preconditions:
      - sh: "test -r {{.KUBECONFIG_FILE | shellQuote}}"
        msg: "NKTP kubeconfig is not readable: {{.KUBECONFIG_FILE}}"
      - sh: "{{if .BASE_HELM_VALUES_FILE}}test -f {{.BASE_HELM_VALUES_FILE | shellQuote}}{{else}}true{{end}}"
        msg: "Base Helm values file not found: {{.BASE_HELM_VALUES_FILE}}"
      - sh: "{{if .RESOLVED_HELM_VALUES_FILE}}test -f {{.RESOLVED_HELM_VALUES_FILE | shellQuote}}{{else}}true{{end}}"
        msg: "Helm values file not found: {{.RESOLVED_HELM_VALUES_FILE}}"
    cmds:
      - >-
        helm upgrade --install {{.RELEASE | default "nktp" | shellQuote}}
        {{.CHART_PATH | default (printf "%s/nktp" .ROOT_DIR) | shellQuote}}
        --reset-values
        --namespace {{.NAMESPACE | default "nktp" | shellQuote}} --create-namespace
        --kubeconfig {{.KUBECONFIG_FILE | shellQuote}}
        {{if .KUBE_CONTEXT}}--kube-context {{.KUBE_CONTEXT | shellQuote}}{{end}}
        --wait --timeout {{.HELM_TIMEOUT | default "5m" | shellQuote}}
        {{if .BASE_HELM_VALUES_FILE}}--values {{.BASE_HELM_VALUES_FILE | shellQuote}}{{end}}
        {{if .RESOLVED_HELM_VALUES_FILE}}--values {{.RESOLVED_HELM_VALUES_FILE | shellQuote}}{{end}}

  cert-manager:install:
    internal: true
    desc: Install cert-manager and its CRDs on an explicitly selected cluster
    preconditions:
      - sh: "test -r {{.KUBECONFIG_FILE | shellQuote}}"
        msg: "cert-manager kubeconfig is not readable: {{.KUBECONFIG_FILE}}"
    cmds:
      - "{{.TOOLS_PATH}} helm repo add jetstack https://charts.jetstack.io --force-update"
      - >-
        {{.TOOLS_PATH}} helm upgrade --install cert-manager jetstack/cert-manager
        --kubeconfig {{.KUBECONFIG_FILE | shellQuote}}
        {{if .KUBE_CONTEXT}}--kube-context {{.KUBE_CONTEXT | shellQuote}}{{end}}
        --namespace cert-manager --create-namespace
        --version {{.CERT_MANAGER_VERSION | shellQuote}}
        --set crds.enabled=true
        --wait --timeout 5m

  tests:lint:
    desc: "Lint all Go test suites (pass flags: task tests:lint -- --fix)"
    dir: tests
    deps: [tests:lint:build]
    cmds:
      - ./custom-gcl config verify
      - ./custom-gcl run {{.CLI_ARGS}} ./...

  tests:lint:build:
    internal: true
    dir: tests
    method: timestamp
    sources:
      - .custom-gcl.yml
      - go.mod
      - ../Taskfile.yml
    generates:
      - custom-gcl
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 custom -v

  tests:scale:
    aliases: [test:scale]
    desc: Alias for scale:test
    cmds:
      - task: scale:test
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          CLI_ARGS: "{{.CLI_ARGS}}"

  test:
    desc: "Run the NKTP chart unit tests (pass flags: task test -- -u)"
    cmds:
      - task: chart:deps
      - helm unittest {{.CLI_ARGS}} nktp
      # CLI_ARGS go to the main run only, so a -o report is not overwritten by this run.
      - helm unittest --skip-schema-validation -f 'tests/skip-schema-validation/*_test.yaml' nktp

  license:check:
    desc: Run the SPDX header and third-party notices checks that CI runs on every pull request
    cmds:
      - .github/scripts/check-license-headers.sh
      - task: chart:deps
      - .github/scripts/check-third-party-notices.sh

  chart:deps:
    internal: true
    cmds:
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update
      - helm dependency build nktp --skip-refresh

includes:
  e2e:
    taskfile: ./tests/e2e/Taskfile.yml
    dir: ./tests/e2e
  scale:
    taskfile: ./tests/scale/Taskfile.yml
    dir: ./tests/scale
  dev:
    taskfile: ./dev/Taskfile.yml
    dir: ./dev
  nvcb:
    taskfile: ./nvcb/Taskfile.yml
    dir: ./nvcb
