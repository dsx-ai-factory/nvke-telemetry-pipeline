# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration. Auto-review is disabled by default on
# GitHub, so without this file reviews only happen when someone comments
# `@coderabbitai review` on a pull request.

reviews:
  profile: chill

  auto_review:
    enabled: true
    # Review draft pull requests too, so feedback arrives while the change
    # is still being shaped.
    drafts: true
    base_branches:
      - "^main$"
    ignore_usernames:
      - "release-please[bot]"
      - "dependabot[bot]"

  # Keep the walkthrough; drop the status chatter around it.
  high_level_summary: false
  poem: false
  sequence_diagrams: false
  collapse_walkthrough: true
  request_changes_workflow: false

  # Suppresses "review skipped" notices, such as the one for a base branch that
  # is not listed under `auto_review.base_branches`. That advice is aimed at
  # maintainers, not the contributor who opened the pull request, and there is
  # no way to keep the notice while dropping the advice: this flag is
  # all-or-nothing. Draft pull requests are reviewed, so they get no skip notice.
  review_status: false

  path_filters:
    # Generated by `task test -- -u`. Excluded from review, but still listed
    # under "Files ignored due to path filters", which is enough to tell
    # whether a template change regenerated its snapshot.
    - "!**/*.snap"
    # Exported from Grafana, not hand-edited.
    - "!nktp/dashboards/**/*.json"
    # Regenerated by `helm dependency build`.
    - "!nktp/Chart.lock"
    - "!nktp/charts/**"
    - "!**/go.sum"

  path_instructions:
    - path: "nktp/templates/**/*.yaml"
      instructions: |
        Helm templates rendering `OpenTelemetryCollector` custom resources,
        their RBAC, and the bundled LGTM workloads. The Operator turns those
        resources into running collectors; Collector pipeline configuration
        itself lives in `nktp/values.yaml`. `helm lint` and `helm template`
        already run in CI; do not comment on YAML formatting or indentation
        style.

        Focus on:
        - Guard optional blocks with `if`/`with` so a missing value renders
          valid YAML rather than a null field.
        - RBAC: verbs and resources must be the minimum the component needs.
          Flag any widening to `*`, cluster-wide scope, or `secrets` access
          that the pull request does not justify.
        - Flag credentials, registry tokens, exporter auth headers, or
          kubeconfig contents rendered as literals. These belong in a Secret
          referenced by name and key.
        - A template change that alters the default render requires a
          regenerated `nktp/tests/__snapshot__/` in the SAME pull request.
          The snapshot itself is filtered from review, but it still appears
          in the changed-file list; if it is absent entirely, flag it as HIGH.

    - path: "nktp/values.yaml"
      instructions: |
        The chart's public interface. Flag renamed or removed keys as
        potentially breaking for existing installs, and ask whether the
        affected component's page under `docs/components/`, or
        `nktp/README.md`, needs updating in the same pull request, which
        CONTRIBUTING.md requires when chart defaults, bundled dependencies, or
        user-visible configuration change.

        Check that image tags and chart dependency versions are pinned, never
        `latest` or a floating range.

        `denyFSAccessThroughSMs: false` is intentional for both the node and
        large-target Target Allocators, preserving compatibility with monitors
        that reference mounted bearer-token or TLS files. Do not flag this
        default as an oversight or recommend enabling it without migrating the
        selected monitors first. See `docs/designs/monitor_file_access.md` for
        the security rationale and compatibility examples.

    - path: "nktp/tests/**/*_test.yaml"
      instructions: |
        helm-unittest suites. Focus on:
        - New templates need a corresponding suite; new values need a case
          covering a reasonable set of possible settings. e.g. For booleans, ensure both true and false are tested.
        - Assertions should check rendered values, not merely that rendering
          succeeded.
        - Flag deleted, skipped, or loosened assertions. A test may be weakened only when there is a clear justification based on an intentional corresponding functionality change.

        See `nktp/tests/README.md` for when a snapshot is appropriate versus
        targeted assertions.

    - path: "nvcb/chart/templates/_transpile.tpl"
      instructions: |
        The NVCB transpiler: turns `blueprint/<type>[/<name>]` declarations
        into native OpenTelemetry Collector configuration. This is shared
        library-chart code, so treat changes as affecting every consumer.

        Focus on:
        - Blueprint inputs that produce silently wrong Collector config rather
          than a template error. Prefer `fail` with an actionable message over
          emitting an invalid pipeline.
        - Changes to how native receiver/exporter config merges with generated
          config. Flag anything that could drop a user-supplied key.
        - A behavior change needs an `nvcb/tests/pass/<scenario>/` case in the
          same pull request. If `output.yaml` changed without a matching
          `values.yaml` or transpiler change, ask why.

    - path: "nvcb/tests/pass/**/output.yaml"
      instructions: |
        Golden files regenerated by `go test ./... -update`. Do not review
        formatting. Only verify the diff follows from the transpiler or values
        change in the same pull request.

        Every test case input MUST be a structurally valid example configuration, though fake component types may be used.

    - path: "tests/**/*.go"
      instructions: |
        Go integration, e2e, scale, and perf suites. These are build-tagged
        and not all wired into CI yet.

        Focus on:
        - Build tags present and matching the directory's intent, otherwise
          the suite silently never runs.
        - Cluster state cleaned up even on failure (`t.Cleanup`), and no
          use of arbitrary kubeconfigs or contexts. Dev tooling uses only
          `dev/.kubeconfig`; e2e and scale use their suite-local kubeconfigs
          or an explicitly supplied kubeconfig. Cluster operations must use
          the selected file explicitly and leave unrelated contexts untouched.
        - Real timeouts and polling with context cancellation instead of bare
          `time.Sleep`.
        - Assertions should use `testify`: `require` where the test cannot
          meaningfully continue, `assert` where it can. Flag hand-rolled `if`
          checks calling `t.Fatal` or `t.Error`.

    - path: ".github/workflows/**"
      instructions: |
        Check for:
        - Actions pinned to a commit SHA, not a mutable tag.
        - `permissions:` set to the minimum, at job level where possible.
        - No `pull_request_target` combined with checking out pull request head
          code.
        - Secrets not exposed to fork-triggered runs, and never echoed.
        - Referenced composite actions (`./.github/actions/...`) exist, and
          pinned tool versions (Helm 4.3.2, helm-unittest 1.1.2) stay
          consistent across workflows.

    - path: "nktp/README.md"
      instructions: |
        Packaged into the chart and read through `helm show readme` and the
        chart registry, where links to other files do not resolve. Flag any
        link to other documentation, whether a relative path or a URL. The only
        allowed link is the closing one to `docs/` on `main`; anchors within
        the README are fine. Material that needs a link belongs under `docs/`.

    - path: "**/*.md"
      instructions: |
        Check accuracy against the code in the same pull request: commands
        must be runnable as written, and any `task` target referenced must
        exist in the relevant Taskfile. Do not comment on prose style.

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    golangci-lint:
      enabled: true
    markdownlint:
      enabled: true
    # Chart templates are Go-templated YAML; yamllint cannot parse `{{ }}`
    # and reports the whole tree as broken.
    yamllint:
      enabled: false

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "RELEASING.md"
      - "docs/designs/**"
