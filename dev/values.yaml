      limits: { cpu: 500m, memory: 512Mi }
    env:
      - { name: GOMEMLIMIT, value: 384MiB }
      - { name: GOGC, value: "50" }
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace

# Kind stores its journal in /run. Helm replaces volume and environment lists in full.
daemonset:
  kubernetes:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
    env:
      - { name: GOMEMLIMIT, value: 768MiB }
      - { name: GOGC, value: "50" }
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    targetAllocator:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 250m, memory: 256Mi }
    volumes:
      - name: pod-logs
        hostPath: { path: /var/log/pods, type: Directory }
      - name: host-proc
        hostPath: { path: /proc, type: Directory }
      - name: journalctl
        hostPath: { path: /usr/bin/journalctl, type: File }
      - name: host-lib
        hostPath: { path: /lib, type: Directory }
      - name: host-lib64
        hostPath: { path: /lib64, type: DirectoryOrCreate }
      - name: host-usr-lib
        hostPath: { path: /usr/lib, type: Directory }
      - name: host-machine-id
        hostPath: { path: /etc/machine-id, type: File }
      - name: journal-persistent
        hostPath: { path: /run/log/journal, type: Directory }
      - name: host-logs
        hostPath: { path: /var/log, type: Directory }
      - name: internal-tls-client
        secret:
          secretName: nktp-daemonset-client-tls
          items:
            - { key: tls.crt, path: tls.crt }
            - { key: tls.key, path: tls.key }
            - { key: ca.crt, path: ca.crt }
      - name: log-checkpoints
        hostPath: { path: /var/lib/nktp/log-checkpoints, type: DirectoryOrCreate }
    volumeMounts:
      - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
      - { name: host-proc, mountPath: /hostfs/proc, readOnly: true }
      - {
          name: journalctl,
          mountPath: /hostfs/usr/bin/journalctl,
          readOnly: true,
        }
      - { name: host-lib, mountPath: /hostfs/lib, readOnly: true }
      - { name: host-lib64, mountPath: /hostfs/lib64, readOnly: true }
      - { name: host-lib64, mountPath: /hostfs/usr/lib64, readOnly: true }
      - { name: host-usr-lib, mountPath: /hostfs/usr/lib, readOnly: true }
      - {
          name: host-machine-id,
          mountPath: /hostfs/etc/machine-id,
          readOnly: true,
        }
      - {
          name: journal-persistent,
          mountPath: /hostfs/run/log/journal,
          readOnly: true,
        }
      - { name: host-logs, mountPath: /hostfs/var/log, readOnly: true }
      - {
          name: internal-tls-client,
          mountPath: /etc/nktp/internal-tls/client,
          readOnly: true,
        }
      - { name: log-checkpoints, mountPath: /var/lib/otelcol/log-checkpoints }
  otelcol:
    config:
      receivers:
        journald:
          directory: /run/log/journal
