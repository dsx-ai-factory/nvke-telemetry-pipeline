# Kind stores its journal in /run. Helm replaces volume lists in full.
watchdog:
  kubernetes:
    replicas: 1
    autoscaler: { minReplicas: 1, maxReplicas: 1 }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    env:
      - { name: GOMEMLIMIT, value: 384MiB }
      - { name: GOGC, value: "50" }
    targetAllocator:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 250m, memory: 256Mi }

