suite: default audit log collection and classification
release:
  namespace: nktp
templates:
  - templates/daemonset.yaml
  - templates/gateway-logs.yaml
tests:
  - it: collects both Linux authentication file paths with a source class
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.config.receivers["file_log/host-auth"]
          value:
            include: [/hostfs/var/log/auth.log, /hostfs/var/log/secure]
            start_at: end
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            resource:
              nvidia.telemetry.class: system.auth
              service.name: auth

  - it: collects host audit files with their source classification and service name
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.config.receivers["file_log/host-audit"]
          value:
            include: [/hostfs/var/log/audit/audit.log]
            start_at: end
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            resource:
              nvidia.telemetry.class: system.audit
              service.name: auditd
      - notExists:
          path: spec.config.receivers["journald/host-auth"]

  - it: collects API audit files without parsing or relabeling their body
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.config.receivers["file_log/kube-api-audit"]
          value:
            include: [/hostfs/var/log/kubernetes/audit/audit.log]
            start_at: end
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            resource:
              nvidia.telemetry.class: k8s.api.audit
              service.name: kube-apiserver
      - contains:
          path: spec.volumes
          content:
            name: host-logs
            hostPath: {path: /var/log, type: Directory}
      - contains:
          path: spec.volumeMounts
          content: {name: host-logs, mountPath: /hostfs/var/log, readOnly: true}

  - it: accepts site audit paths while retaining each source class
    template: templates/daemonset.yaml
    set:
      daemonset.otelcol.config.receivers.file_log/host-audit.include: [/hostfs/var/log/site-audit/audit.log]
      daemonset.otelcol.config.receivers.file_log/kube-api-audit.include: [/hostfs/var/log/site-kube-api-audit/audit.log]
    asserts:
      - equal:
          path: spec.config.receivers["file_log/host-audit"].include
          value: [/hostfs/var/log/site-audit/audit.log]
      - equal:
          path: spec.config.receivers["file_log/host-audit"].resource
          value: {nvidia.telemetry.class: system.audit, service.name: auditd}
      - equal:
          path: spec.config.receivers["file_log/kube-api-audit"].include
          value: [/hostfs/var/log/site-kube-api-audit/audit.log]
      - equal:
          path: spec.config.receivers["file_log/kube-api-audit"].resource
          value: {nvidia.telemetry.class: k8s.api.audit, service.name: kube-apiserver}

  - it: forwards classified sources through redaction and the existing logs gateway
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.config.service.pipelines.logs
          value:
            receivers: [file_log, journald, otlp, file_log/host-auth, file_log/host-audit, file_log/kube-api-audit]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp_grpc/logs]
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317
      - equal:
          path: spec.config.service.pipelines.logs
          value:
            receivers: [otlp]
            processors: [memory_limiter, redaction/basic_v1, transform/cluster]
            exporters: [otlp_grpc]
        template: templates/gateway-logs.yaml
      - equal:
          path: spec.config.processors.memory_limiter
          value:
            check_interval: 500ms
            limit_percentage: 80
            spike_limit_percentage: 25
        template: templates/gateway-logs.yaml
      - exists:
          path: spec.config.processors["redaction/basic_v1"]
        template: templates/gateway-logs.yaml
