suite: opentelemetry-operator
release:
  name: test
templates:
  - charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/deployment*.yaml
  - charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/certmanager*.yaml
  - charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/admission-webhooks/*.yaml
  - charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/servicemonitor.yaml
  - charts/opentelemetry-kube-stack/templates/collector.yaml
  - charts/opentelemetry-kube-stack/templates/hooks.yaml
tests:
  - it: runs the pinned operator by default
    template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/deployment.yaml
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: nktp-operator
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:0.161.0

  - it: passes through operator image overrides
    set:
      opentelemetry-kube-stack.opentelemetry-operator.manager.image:
        repository: example.com/opentelemetry-operator
        tag: custom
    template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/opentelemetry-operator:custom

  - it: omits the operator when disabled
    set:
      opentelemetry-kube-stack.opentelemetry-operator.enabled: false
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: nktp-operator
        not: true

  - it: uses cert-manager for webhook certificates by default
    asserts:
      - containsDocument:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          name: nktp-operator-serving-cert
          any: true
        template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/certmanager.yaml
      - containsDocument:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          name: nktp-operator-selfsigned-issuer
          any: true
        template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/certmanager.yaml
      - containsDocument:
          apiVersion: v1
          kind: Secret
        not: true

  - it: reuses an existing webhook certificate on upgrade
    set:
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.certManager.enabled: false
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.autoGenerateCert.enabled: true
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.autoGenerateCert.recreate: false
    release:
      namespace: nktp
      upgrade: true
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nktp-operator-controller-manager-service-cert
            namespace: nktp
          data:
            tls.crt: dGVzdC1jZXJ0
            tls.key: dGVzdC1rZXk=
            ca.crt: dGVzdC1jYQ==
    template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/admission-webhooks/operator-webhook.yaml
    asserts:
      - equal:
          path: data
          value:
            tls.crt: dGVzdC1jZXJ0
            tls.key: dGVzdC1rZXk=
            ca.crt: dGVzdC1jYQ==
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: dGVzdC1jYQ==
        documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: dGVzdC1jYQ==
        documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration

  - it: supports a Helm-generated self-signed webhook certificate
    set:
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.certManager.enabled: false
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.autoGenerateCert.enabled: true
      opentelemetry-kube-stack.opentelemetry-operator.admissionWebhooks.autoGenerateCert.recreate: false
    asserts:
      - isNotEmpty:
          path: data["tls.crt"]
        documentSelector:
          path: kind
          value: Secret
        template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/admission-webhooks/operator-webhook.yaml
      - isNotEmpty:
          path: data["tls.key"]
        documentSelector:
          path: kind
          value: Secret
        template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/admission-webhooks/operator-webhook.yaml
      - containsDocument:
          apiVersion: cert-manager.io/v1
          kind: Certificate
        not: true

  - it: allows admission while the operator starts
    template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/admission-webhooks/operator-webhook-with-cert-manager.yaml
    asserts:
      - equal:
          path: webhooks[*].failurePolicy
          value: Ignore
        documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
      - equal:
          path: webhooks[*].failurePolicy
          value: Ignore
        documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration

  - it: leaves CRD installation to the native dependencies
    asserts:
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
        not: true
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: nktp-operator
        template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/deployment.yaml

  - it: does not create kube-stack Collector workloads by default
    template: charts/opentelemetry-kube-stack/templates/collector.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not advertise operator metrics through a ServiceMonitor
    template: charts/opentelemetry-kube-stack/charts/opentelemetry-operator/templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the upstream cleanup job before uninstall
    template: charts/opentelemetry-kube-stack/templates/hooks.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - contains:
          path: spec.template.spec.containers[0].args
          content: helm.sh/chart=opentelemetry-kube-stack-0.25.1
      - equal:
          path: spec.template.spec.containers[0].image
          value: rancher/kubectl:v1.35.6

  - it: omits the upstream cleanup job and its access resources when disabled
    set:
      opentelemetry-kube-stack.cleanupJob.enabled: false
    template: charts/opentelemetry-kube-stack/templates/hooks.yaml
    asserts:
      - hasDocuments:
          count: 0
