suite: blueprints
release:
  namespace: nktp
templates:
  - templates/watchdog.yaml
  - templates/gateway-logs.yaml
  - templates/gateway-metrics.yaml
  - templates/gateway-traces.yaml
  - templates/daemonset.yaml
  - templates/large-target-metrics.yaml
  - templates/nodeless-metrics.yaml
  - templates/cluster-events.yaml
tests:
  - it: strips blueprint definitions and expands only declared blueprints in default configurations
    asserts:
      - notExists:
          path: spec.config.blueprints
      - notExists:
          path: spec.config.connectors["forward/exp/otlp_backend"]
      - notMatchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"blueprints"|forward/exp/otlp_backend'
      # The watchdog's sidecar declares no blueprints.
      - notMatchRegex:
          path: spec.initContainers[0].args[0]
          pattern: forward/exp/
        template: templates/watchdog.yaml

  - it: expands otlp_backend into the same exporter as the logs gateway's default
    template: templates/gateway-logs.yaml
    set:
      gateway_logs.otelcol.config.exporters.blueprint/otlp_backend:
        signal: logs
        endpoint: lgtm:4317
        tls: &tls
          insecure: true
        retry_on_failure: &retry
          max_elapsed_time: 30m
        sending_queue: &queue
          storage: file_storage/queue
          block_on_overflow: true
          sizer: bytes
          queue_size: 515396076
          num_consumers: 32
          batch:
            sizer: bytes
            min_size: 1048576
            max_size: 2097152
            flush_timeout: 1s
      gateway_logs.otelcol.config.service.pipelines.logs.exporters: [blueprint/otlp_backend]
    asserts:
      # The literal matches the default exporter, so this fails if the default changes.
      - equal:
          path: spec.config.exporters.otlp_grpc
          value: &exporter
            endpoint: lgtm:4317
            tls: *tls
            retry_on_failure: *retry
            sending_queue: *queue
      - equal:
          path: spec.config.exporters["otlp_grpc/(exp/otlp_backend)"]
          value: *exporter
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [forward/exp/otlp_backend]
      - equal:
          path: spec.config.service.pipelines["logs/(exp/otlp_backend)"]
          value:
            receivers: [forward/exp/otlp_backend]
            exporters: [otlp_grpc/(exp/otlp_backend)]

  - it: expands a blueprint from the blueprints value in a sidecar
    template: templates/gateway-logs.yaml
    set:
      gateway_logs.sidecar.otelcol.config.exporters.blueprint/otlp_backend:
        endpoint: sidecar.example.com:4317
        signal: traces
      gateway_logs.sidecar.otelcol.config.service.pipelines.traces.exporters: [blueprint/otlp_backend]
    asserts:
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"otlp_grpc/\(exp/otlp_backend\)":\{"endpoint":"sidecar.example.com:4317"'
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"traces":\{"exporters":\["forward/exp/otlp_backend"\]'

  # The literals are complete exporters, so these fail if the blueprint or a
  # default declaration of it changes.
  - it: expands otlp_watchdog into the gateway sidecars' exporter to watchdog
    templates:
      - templates/gateway-logs.yaml
      - templates/gateway-metrics.yaml
      - templates/gateway-traces.yaml
    asserts:
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"exporters":\{"otlp_grpc/\(exp/otlp_watchdog\)":\{"endpoint":"nktp-watchdog-collector:4317","retry_on_failure":\{"max_elapsed_time":"30m"\},"sending_queue":\{"batch":\{"flush_timeout":"1s","max_size":262144,"min_size":65536,"sizer":"bytes"\},"block_on_overflow":false,"num_consumers":2,"queue_size":16777216,"sizer":"bytes"\},"tls":\{"ca_file":"/etc/nktp/internal-tls/client/ca\.crt","cert_file":"/etc/nktp/internal-tls/client/tls\.crt","key_file":"/etc/nktp/internal-tls/client/tls\.key","reload_interval":"1h"\}\}\}'

  - it: expands otlp_watchdog into the node, metrics pool, and cluster events sidecars' exporter to watchdog
    templates:
      - templates/daemonset.yaml
      - templates/large-target-metrics.yaml
      - templates/nodeless-metrics.yaml
      - templates/cluster-events.yaml
    asserts:
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"exporters":\{"otlp_grpc/\(exp/otlp_watchdog\)":\{"endpoint":"nktp-watchdog-collector:4317","retry_on_failure":\{"max_elapsed_time":"30m"\},"sending_queue":\{"batch":\{"flush_timeout":"1s","max_size":262144,"min_size":65536,"sizer":"bytes"\},"block_on_overflow":false,"num_consumers":2,"queue_size":4194304,"sizer":"bytes"\},"tls":\{"ca_file":"/etc/nktp/internal-tls/client/ca\.crt","cert_file":"/etc/nktp/internal-tls/client/tls\.crt","key_file":"/etc/nktp/internal-tls/client/tls\.key","reload_interval":"1h"\}\}\}'

  - it: expands otlp_watchdog into the node Collector's blocking, logs-only exporter to watchdog
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.config.exporters["otlp_grpc/(exp/otlp_watchdog)"]
          value:
            endpoint: nktp-watchdog-collector:4317
            tls:
              ca_file: /etc/nktp/internal-tls/client/ca.crt
              cert_file: /etc/nktp/internal-tls/client/tls.crt
              key_file: /etc/nktp/internal-tls/client/tls.key
              reload_interval: 1h
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              block_on_overflow: true
              sizer: bytes
              queue_size: 1048576
              num_consumers: 2
              batch:
                sizer: bytes
                min_size: 65536
                max_size: 262144
                flush_timeout: 1s
      - equal:
          path: spec.config.connectors
          value:
            forward/exp/otlp_watchdog: {}
      - equal:
          path: spec.config.service.pipelines["logs/(exp/otlp_watchdog)"]
          value:
            receivers: [forward/exp/otlp_watchdog]
            exporters: [otlp_grpc/(exp/otlp_watchdog)]
      - notExists:
          path: spec.config.service.pipelines["metrics/(exp/otlp_watchdog)"]
      - notExists:
          path: spec.config.service.pipelines["traces/(exp/otlp_watchdog)"]

  - it: replaces otlp_watchdog's default mTLS settings with its tls parameter
    template: templates/gateway-logs.yaml
    set:
      gateway_logs.sidecar.otelcol.config.exporters.blueprint/otlp_watchdog.tls:
        insecure: true
    asserts:
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"otlp_grpc/\(exp/otlp_watchdog\)":\{[^\n]*"tls":\{"insecure":true\}\}'
      - notMatchRegex:
          path: spec.initContainers[0].args[0]
          pattern: /etc/nktp/internal-tls/

  - it: requires otlp_watchdog's queue_size
    template: templates/gateway-logs.yaml
    set:
      gateway_logs.sidecar.otelcol.config.exporters.blueprint/otlp_watchdog.queue_size: null
    asserts:
      - failedTemplate:
          errorPattern: 'otlp_watchdog: queue_size is required'

  - it: uses a configuration's own definition over the blueprints value
    template: templates/gateway-logs.yaml
    set:
      blueprints.exporters.shared.template: |
        exporters:
          debug:
            verbosity: basic
        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]
      gateway_logs.otelcol.config.blueprints.exporters.shared.template: |
        exporters:
          debug:
            verbosity: detailed
        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]
      gateway_logs.otelcol.config.exporters.blueprint/shared: {}
      gateway_logs.otelcol.config.service.pipelines.logs.exporters: [otlp_grpc, blueprint/shared]
    asserts:
      - equal:
          path: spec.config.exporters["debug/(exp/shared)"].verbosity
          value: detailed

  - it: passes a blueprints value that is not a map to NVCB, which rejects it
    template: templates/watchdog.yaml
    set:
      blueprints: not-a-map
    asserts:
      - failedTemplate:
          errorPattern: 'nvcb: blueprints must be a map'
