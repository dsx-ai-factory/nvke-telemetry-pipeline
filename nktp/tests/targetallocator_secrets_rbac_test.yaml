suite: opt-in cluster Secret access
release:
  namespace: telemetry
templates:
  - templates/targetallocator-secrets-rbac.yaml
tests:
  - it: creates no Secret grants by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no Secret grants when explicitly disabled
    set:
      grantClusterSecretAccess: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants read-only Secret and CA ConfigMap access across the cluster
    set:
      grantClusterSecretAccess: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: kind
          value: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: nktp-targetallocator-secrets-telemetry
        documentIndex: 0
      - notExists:
          path: metadata.namespace
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get]
        documentIndex: 0
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: nktp-targetallocator-secrets-telemetry
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: nktp-daemonset-targetallocator
              namespace: telemetry
            - kind: ServiceAccount
              name: nktp-large-target-metrics-targetallocator
              namespace: telemetry
            - kind: ServiceAccount
              name: nktp-nodeless-metrics-targetallocator
              namespace: telemetry
        documentIndex: 1

  - it: honors externally provided allocator service accounts
    set:
      grantClusterSecretAccess: true
      daemonset.kubernetes.targetAllocator.serviceAccount: node-reader
      large_target_metrics.kubernetes.targetAllocator.serviceAccount: large-reader
      nodeless_metrics.kubernetes.targetAllocator.serviceAccount: nodeless-reader
    asserts:
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: node-reader, namespace: telemetry}
            - {kind: ServiceAccount, name: large-reader, namespace: telemetry}
            - {kind: ServiceAccount, name: nodeless-reader, namespace: telemetry}
        documentIndex: 1

  - it: deduplicates a service account shared by multiple allocators
    set:
      grantClusterSecretAccess: true
      daemonset.kubernetes.targetAllocator.serviceAccount: shared-reader
      large_target_metrics.kubernetes.targetAllocator.serviceAccount: shared-reader
      nodeless_metrics.kubernetes.targetAllocator.serviceAccount: shared-reader
    asserts:
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: shared-reader, namespace: telemetry}
        documentIndex: 1

  - it: excludes the node allocator when its monitor discovery is disabled
    set:
      grantClusterSecretAccess: true
      daemonset.kubernetes.targetAllocator.prometheusCR.enabled: false
    asserts:
      - lengthEqual:
          path: subjects
          count: 2
        documentIndex: 1
      - notContains:
          path: subjects
          content: {kind: ServiceAccount, name: nktp-daemonset-targetallocator, namespace: telemetry}
        documentIndex: 1

  - it: excludes the large-target allocator when its monitor discovery is disabled
    set:
      grantClusterSecretAccess: true
      large_target_metrics.kubernetes.targetAllocator.prometheusCR.enabled: false
    asserts:
      - lengthEqual:
          path: subjects
          count: 2
        documentIndex: 1
      - notContains:
          path: subjects
          content: {kind: ServiceAccount, name: nktp-large-target-metrics-targetallocator, namespace: telemetry}
        documentIndex: 1

  - it: excludes the nodeless allocator when its monitor discovery is disabled
    set:
      grantClusterSecretAccess: true
      nodeless_metrics.kubernetes.targetAllocator.prometheusCR.enabled: false
    asserts:
      - lengthEqual:
          path: subjects
          count: 2
        documentIndex: 1
      - notContains:
          path: subjects
          content: {kind: ServiceAccount, name: nktp-nodeless-metrics-targetallocator, namespace: telemetry}
        documentIndex: 1

  - it: creates no cluster grants when no allocator discovers monitors
    set:
      grantClusterSecretAccess: true
      daemonset.kubernetes.targetAllocator.prometheusCR.enabled: false
      large_target_metrics.kubernetes.targetAllocator.prometheusCR.enabled: false
      nodeless_metrics.kubernetes.targetAllocator.prometheusCR.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a string instead of a boolean
    set:
      grantClusterSecretAccess: "false"
    asserts:
      - failedTemplate:
          errorPattern: grantClusterSecretAccess
