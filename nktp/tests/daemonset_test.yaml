suite: node collector
release:
  namespace: nktp
templates:
  - templates/daemonset.yaml
tests:
  - it: rejects disabled target allocation
    set:
      daemonset.kubernetes.targetAllocator.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: daemonset.kubernetes.targetAllocator.enabled must be true to assign scrape targets to Collectors on the same node

  - it: rejects removed target allocation
    set:
      daemonset.kubernetes.targetAllocator: null
    asserts:
      - failedTemplate:
          errorMessage: daemonset.kubernetes.targetAllocator.enabled must be true to assign scrape targets to Collectors on the same node

  - it: forwards secretNamespaces without adding chart RBAC options to the CR
    set:
      daemonset.kubernetes.targetAllocator.prometheusCR.secretNamespaces: [metrics-monitors]
    asserts:
      - equal:
          path: spec.targetAllocator.prometheusCR.secretNamespaces
          value: [metrics-monitors]
      - equal:
          path: spec.targetAllocator.prometheusCR.denyFSAccessThroughSMs
          value: false
      - notExists:
          path: spec.rbac

  - it: routes local pod logs and assigned metrics to their gateways
    asserts:
      - equal:
          path: spec.config.service.telemetry.traces.level
          value: basic
      - equal:
          path: metadata.name
          value: nktp-daemonset
      - equal:
          path: spec.mode
          value: daemonset
      - equal:
          path: spec.tolerations
          value:
            - operator: Exists
      - notExists:
          path: spec.replicas
      - notExists:
          path: spec.autoscaler
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/metrics"].endpoint
          value: nktp-gateway-metrics-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].tls
          value: &clientTLS
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
      - equal:
          path: spec.config.exporters["otlp_grpc/metrics"].tls
          value: *clientTLS
      - equal:
          path: spec.config.exporters["otlp_grpc/traces"].tls
          value: *clientTLS
      - equal:
          path: spec.config.exporters["otlp_grpc/watchdog"].tls
          value: *clientTLS
      - equal:
          path: spec.config.receivers.prometheus.config
          value: {scrape_configs: []}
      - notExists:
          path: spec.config.processors.batch

  - it: scrapes local kubelet and filtered cAdvisor metrics directly by default
    asserts:
      - equal:
          path: spec.config.receivers["prometheus/kubelet"].config.scrape_configs
          value:
            - job_name: kubelet
              scrape_interval: 30s
              scrape_timeout: 10s
              scheme: https
              metrics_path: /metrics
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              static_configs:
                - targets: ["127.0.0.1:10250"]
                  labels:
                    __tmp_kubelet_host: ${env:OTEL_K8S_NODE_IP}
              relabel_configs:
                - source_labels: [__tmp_kubelet_host]
                  regex: (.+:.*)
                  target_label: __address__
                  replacement: "[$$1]:10250"
                - source_labels: [__tmp_kubelet_host]
                  regex: ([^:]+)
                  target_label: __address__
                  replacement: "$$1:10250"
                - target_label: node
                  replacement: ${env:NODE_NAME}
                - target_label: endpoint
                  replacement: https-metrics
                - target_label: metrics_path
                  replacement: /metrics
            - job_name: kubelet-cadvisor
              scrape_interval: 30s
              scrape_timeout: 10s
              scheme: https
              metrics_path: /metrics/cadvisor
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              static_configs:
                - targets: ["127.0.0.1:10250"]
                  labels:
                    __tmp_kubelet_host: ${env:OTEL_K8S_NODE_IP}
              relabel_configs:
                - source_labels: [__tmp_kubelet_host]
                  regex: (.+:.*)
                  target_label: __address__
                  replacement: "[$$1]:10250"
                - source_labels: [__tmp_kubelet_host]
                  regex: ([^:]+)
                  target_label: __address__
                  replacement: "$$1:10250"
                - target_label: node
                  replacement: ${env:NODE_NAME}
                - target_label: endpoint
                  replacement: https-metrics
                - target_label: metrics_path
                  replacement: /metrics/cadvisor
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: drop
                  regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
                - source_labels: [__name__]
                  action: drop
                  regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                - source_labels: [__name__]
                  action: drop
                  regex: container_memory_(mapped_file|swap)
                - source_labels: [__name__]
                  action: drop
                  regex: container_(file_descriptors|tasks_state|threads_max)
                - source_labels: [__name__, scope]
                  action: drop
                  regex: container_memory_failures_total;hierarchy
                - source_labels: [__name__, interface]
                  action: drop
                  regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
                - source_labels: [__name__]
                  action: drop
                  regex: container_spec.*
                - source_labels: [id, pod]
                  action: drop
                  regex: .+;
      - notExists:
          path: spec.config.receivers["prometheus/kubelet"].target_allocator

  - it: parses container records from a read-only host mount and excludes NKTP Collector logs
    asserts:
      - equal:
          path: spec.config.receivers.file_log
          value:
            include: [/var/log/pods/*/*/*.log]
            exclude:
              - "/var/log/pods/${env:POD_NAMESPACE}_nktp-*-collector-*_*/*/*.log"
              - "/var/log/pods/${env:POD_NAMESPACE}_nktp-*-targetallocator-*_*/ta-container/*.log"
              - "/var/log/pods/${env:POD_NAMESPACE}_nktp-operator-*_*/manager/*.log"
            start_at: end
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            operators:
              - type: container
              - id: classify-control-plane
                type: add
                if: >-
                  resource["k8s.namespace.name"] == "kube-system" &&
                  ((resource["k8s.container.name"] == "kube-apiserver" && resource["k8s.pod.name"] matches "^kube-apiserver-") ||
                  (resource["k8s.container.name"] == "kube-controller-manager" && resource["k8s.pod.name"] matches "^kube-controller-manager-") ||
                  (resource["k8s.container.name"] == "kube-scheduler" && resource["k8s.pod.name"] matches "^kube-scheduler-") ||
                  (resource["k8s.container.name"] == "etcd" && resource["k8s.pod.name"] matches "^etcd-"))
                field: resource["nvidia.telemetry.class"]
                value: k8s.control_plane
      - equal:
          path: spec.volumes
          value:
            - name: pod-logs
              hostPath: {path: /var/log/pods, type: Directory}
            - name: host-proc
              hostPath: {path: /proc, type: Directory}
            - name: journalctl
              hostPath: {path: /usr/bin/journalctl, type: File}
            - name: host-lib
              hostPath: {path: /lib, type: Directory}
            - name: host-lib64
              hostPath: {path: /lib64, type: DirectoryOrCreate}
            - name: host-usr-lib
              hostPath: {path: /usr/lib, type: Directory}
            - name: host-machine-id
              hostPath: {path: /etc/machine-id, type: File}
            - name: host-logs
              hostPath: {path: /var/log, type: Directory}
            - name: internal-tls-client
              secret:
                secretName: nktp-daemonset-client-tls
                items:
                  - {key: tls.crt, path: tls.crt}
                  - {key: tls.key, path: tls.key}
                  - {key: ca.crt, path: ca.crt}
      - equal:
          path: spec.volumeMounts
          value:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: host-proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: journalctl
              mountPath: /hostfs/usr/bin/journalctl
              readOnly: true
            - name: host-lib
              mountPath: /hostfs/lib
              readOnly: true
            - name: host-lib64
              mountPath: /hostfs/lib64
              readOnly: true
            - name: host-lib64
              mountPath: /hostfs/usr/lib64
              readOnly: true
            - name: host-usr-lib
              mountPath: /hostfs/usr/lib
              readOnly: true
            - name: host-machine-id
              mountPath: /hostfs/etc/machine-id
              readOnly: true
            - name: host-logs
              mountPath: /hostfs/var/log
              readOnly: true
            - name: internal-tls-client
              mountPath: /etc/nktp/internal-tls/client
              readOnly: true
      - equal:
          path: spec.securityContext
          value:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SYS_CHROOT]}

  - it: sends allocator container logs to watchdog independently of application logs
    set:
      otel-lgtm.enabled: false
      daemonset.otelcol.config.exporters.otlp_grpc/logs.endpoint: application-logs:4317
    asserts:
      - equal:
          path: spec.config.receivers["file_log/targetallocator"]
          value:
            include: ["/var/log/pods/${env:POD_NAMESPACE}_nktp-*-targetallocator-*_*/ta-container/*.log"]
            start_at: beginning
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            operators: [{type: container}]
      - contains:
          path: spec.config.receivers.file_log.exclude
          content: "/var/log/pods/${env:POD_NAMESPACE}_nktp-*-targetallocator-*_*/ta-container/*.log"
      - equal:
          path: spec.config.service.pipelines["logs/targetallocator"]
          value:
            receivers: [file_log/targetallocator]
            processors: [memory_limiter, resource/node, transform/targetallocator, redaction/basic_v1]
            exporters: [otlp_grpc/watchdog]
      - equal:
          path: spec.config.exporters["otlp_grpc/watchdog"].endpoint
          value: nktp-watchdog-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/watchdog"].tls
          value: *clientTLS
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: application-logs:4317
      - equal:
          path: spec.config.service.pipelines.logs
          value: {receivers: [file_log, journald, otlp, file_log/host-auth, file_log/host-audit, file_log/kube-api-audit], processors: [memory_limiter, resource/node, redaction/basic_v1], exporters: [otlp_grpc/logs]}

  - it: sends operator manager logs to watchdog independently of application logs
    release:
      namespace: telemetry
    set:
      otel-lgtm.enabled: false
      daemonset.otelcol.config.exporters.otlp_grpc/logs.endpoint: application-logs:4317
    asserts:
      - equal:
          path: metadata.namespace
          value: telemetry
      - equal:
          path: spec.config.receivers["file_log/operator"]
          value:
            include: ["/var/log/pods/${env:POD_NAMESPACE}_nktp-operator-*_*/manager/*.log"]
            start_at: beginning
            include_file_path: true
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            operators: [{type: container}]
      - contains:
          path: spec.config.receivers.file_log.exclude
          content: "/var/log/pods/${env:POD_NAMESPACE}_nktp-operator-*_*/manager/*.log"
      - equal:
          path: spec.config.processors["transform/operator"].log_statements
          value:
            - context: resource
              statements:
                - set(attributes["service.name"], "nktp-operator")
                - set(attributes["service.instance.id"], attributes["k8s.pod.name"])
      - equal:
          path: spec.config.service.pipelines["logs/operator"]
          value:
            receivers: [file_log/operator]
            processors: [memory_limiter, resource/node, transform/operator, redaction/basic_v1]
            exporters: [otlp_grpc/watchdog]
      - equal:
          path: spec.config.exporters["otlp_grpc/watchdog"].endpoint
          value: nktp-watchdog-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: application-logs:4317

  - it: carries node identity through native environment references
    asserts:
      - contains:
          path: spec.env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef: {fieldPath: spec.nodeName}
      - contains:
          path: spec.env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef: {fieldPath: metadata.namespace}
      - contains:
          path: spec.env
          content:
            name: OTEL_K8S_NODE_IP
            valueFrom:
              fieldRef: {fieldPath: status.hostIP}
      - equal:
          path: spec.config.processors["resource/node"].attributes
          value:
            - key: k8s.node.name
              value: ${env:NODE_NAME}
              action: upsert
      - equal:
          path: spec.config.service.telemetry.resource
          value:
            service.name: nktp-daemonset
            service.instance.id: ${env:POD_NAME}
            k8s.node.name: ${env:NODE_NAME}

  - it: allocates per node and excludes large-target and kubelet ServiceMonitors
    asserts:
      - equal:
          path: spec.targetAllocator
          value:
            enabled: true
            image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.161.0
            mtls:
              enabled: true
              useCertManager: true
            replicas: 1
            podSecurityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            allocationStrategy: per-node
            resources:
              requests: {cpu: 250m, memory: 2Gi}
              limits: {cpu: "2", memory: 4Gi}
            env:
              - name: OTEL_SERVICE_NAME
                value: nktp-targetallocator
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: OTEL_RESOURCE_ATTRIBUTES
                value: service.instance.id=$(POD_NAME)
            telemetry:
              metrics:
                readers:
                  - periodic:
                      interval: 30s
                      exporter:
                        otlpGrpc:
                          endpoint: nktp-watchdog-collector:4320
                          tls:
                            insecure: true
                          temporalityPreference: cumulative
            observability:
              metrics:
                enableMetrics: false
            prometheusCR:
              enabled: true
              denyFSAccessThroughSMs: false
              serviceMonitorSelector:
                matchExpressions:
                  - {key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}
                  - {key: app, operator: NotIn, values: [kube-prometheus-stack-kubelet, prometheus-operator-kubelet]}
              podMonitorSelector:
                matchExpressions: [{key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}]
              probeSelector:
                matchExpressions: [{key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}]
              scrapeConfigSelector:
                matchExpressions: [{key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}]

  - it: uses the global image and release namespace with an existing Operator
    release:
      namespace: telemetry
    set:
      otelcol_image: {registry: example.com, repository: collector, tag: global}
      opentelemetry-kube-stack.opentelemetry-operator.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: telemetry
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: opentelemetry-kube-stack-0.25.1
      - equal:
          path: spec.image
          value: example.com/collector:global

  - it: mirrors the Collector image through global.imageRegistry
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.image
          value: mirror.example.com/otel/opentelemetry-collector-k8s:0.164.0
      - equal:
          path: spec.targetAllocator.image
          value: mirror.example.com/open-telemetry/opentelemetry-operator/target-allocator:0.161.0

  - it: passes workload overrides through while resolving Collector configuration separately
    set:
      daemonset.otelcol.image: {registry: example.com, repository: collector, tag: node}
      daemonset.kubernetes:
        image: example.com/collector:ignored
        config: {ignored: true}
        nodeSelector: {workload: telemetry}
        tolerations: [{key: dedicated, operator: Exists}]
        env:
          - name: NODE_NAME
            value: custom-node
          - name: POD_NAMESPACE
            value: telemetry
        resources:
          requests: {cpu: 200m}
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:node
      - equal:
          path: spec.nodeSelector
          value: {workload: telemetry}
      - equal:
          path: spec.tolerations
          value: [{key: dedicated, operator: Exists}]
      - equal:
          path: spec.env
          value:
            - name: NODE_NAME
              value: custom-node
            - name: POD_NAMESPACE
              value: telemetry
            - name: OTEL_K8S_NODE_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
      - notExists:
          path: spec.config.ignored

  - it: extends file parsing and changes one destination without altering metrics or own telemetry
    set:
      daemonset.otelcol.config.receivers.file_log.include: [/custom/pods/*/*/*.log]
      daemonset.otelcol.config.receivers.file_log.operators:
        - type: container
        - type: json_parser
      daemonset.otelcol.config.exporters.otlp_grpc/logs.endpoint: ${env:LOGS_DESTINATION}
      daemonset.otelcol.config.exporters.otlp_grpc/logs.headers:
        x-literal: "{{ preserved }} $$TOKEN"
    asserts:
      - equal:
          path: spec.config.receivers.file_log.include
          value: [/custom/pods/*/*/*.log]
      - equal:
          path: spec.config.receivers.file_log.operators
          value: [{type: container}, {type: json_parser}]
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: ${env:LOGS_DESTINATION}
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].headers
          value: {x-literal: "{{ preserved }} $$TOKEN"}
      - equal:
          path: spec.config.exporters["otlp_grpc/metrics"].endpoint
          value: nktp-gateway-metrics-collector:4317
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319

  - it: replaces own metric exporters independently
    set:
      daemonset.otelcol.config.service.telemetry.metrics.readers:
        - periodic:
            exporter:
              otlp: {protocol: grpc, endpoint: http://metrics.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.metrics.readers
          value:
            - periodic:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://metrics.example:4317}
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317

  - it: replaces own log exporters independently
    set:
      daemonset.otelcol.config.service.telemetry.logs.processors:
        - batch:
            exporter:
              otlp: {protocol: grpc, endpoint: http://logs.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.logs.processors
          value:
            - batch:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://logs.example:4317}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317

  - it: replaces own trace exporters independently
    set:
      daemonset.otelcol.config.service.telemetry.traces.processors:
        - batch:
            exporter:
              otlp: {protocol: grpc, endpoint: http://traces.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.traces.processors
          value:
            - batch:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://traces.example:4317}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317


  - it: pushes allocator metrics without a local scrape pipeline or LGTM
    set:
      otel-lgtm.enabled: false
      daemonset.kubernetes.targetAllocator.replicas: 3
    asserts:
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers
          value:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      - notExists:
          path: spec.config.receivers["prometheus/targetallocator"]
      - notExists:
          path: spec.config.processors["memory_limiter/targetallocator"]
      - notExists:
          path: spec.config.processors["resource/targetallocator"]
      - equal:
          path: spec.config.exporters["otlp_grpc/watchdog"].endpoint
          value: nktp-watchdog-collector:4317
      - notExists:
          path: spec.config.service.pipelines["metrics/targetallocator"]

  - it: retains allocator telemetry when Collector processing and environment are replaced
    set:
      daemonset.kubernetes.env: [{name: CUSTOM, value: literal}]
      daemonset.otelcol.config:
        extensions: null
        receivers:
          journald: null
          file_log: null
          file_log/host-auth: null
          file_log/host-audit: null
          file_log/kube-api-audit: null
          prometheus: null
          otlp:
            protocols:
              http: {endpoint: "0.0.0.0:4318"}
        processors:
          memory_limiter: null
          resource/node: null
        exporters:
          otlp_grpc/logs: null
          otlp_grpc/metrics: null
          otlp_grpc/traces: null
          debug: {}
        service:
          extensions: null
          telemetry: null
          pipelines:
            logs: null
            logs/targetallocator: null
            logs/operator: null
            metrics: null
            traces: null
            traces/custom: {receivers: [otlp], exporters: [debug]}
    asserts:
      - equal:
          path: spec.config.service.pipelines
          value:
            traces/custom: {receivers: [otlp], exporters: [debug]}
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers[0].periodic.exporter.otlpGrpc.endpoint
          value: nktp-watchdog-collector:4320
      - contains:
          path: spec.targetAllocator.env
          content: {name: OTEL_SERVICE_NAME, value: nktp-targetallocator}
      - equal:
          path: spec.config.receivers.otlp.protocols.http.endpoint
          value: "0.0.0.0:4318"
      - equal:
          path: spec.config.exporters.debug
          value: {}
      - contains:
          path: spec.env
          content: {name: CUSTOM, value: literal}
      - contains:
          path: spec.env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef: {fieldPath: spec.nodeName}
      - contains:
          path: spec.env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef: {fieldPath: metadata.namespace}

  - it: replaces allocator exporters independently of Collector self-telemetry
    set:
      daemonset.kubernetes.targetAllocator.telemetry.metrics.readers:
        - periodic:
            interval: 15s
            exporter:
              otlpGrpc: {endpoint: "http://allocator-metrics:4317", tls: {insecure: true}}
    asserts:
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers
          value:
            - periodic:
                interval: 15s
                exporter:
                  otlpGrpc: {endpoint: "http://allocator-metrics:4317", tls: {insecure: true}}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319

  - it: does not collect per-process host metrics by default
    asserts:
      - notExists:
          path: spec.config.receivers.host_metrics
      - notExists:
          path: spec.hostPID

  - it: accepts both OTLP transports and routes all signals with node identity
    asserts:
      - equal:
          path: spec.config.receivers.otlp.protocols
          value:
            grpc: {endpoint: "0.0.0.0:4317"}
            http: {endpoint: "0.0.0.0:4318"}
      - equal:
          path: spec.config.service.pipelines
          value:
            logs: {receivers: [file_log, journald, otlp, file_log/host-auth, file_log/host-audit, file_log/kube-api-audit], processors: [memory_limiter, resource/node, redaction/basic_v1], exporters: [otlp_grpc/logs]}
            logs/targetallocator: {receivers: [file_log/targetallocator], processors: [memory_limiter, resource/node, transform/targetallocator, redaction/basic_v1], exporters: [otlp_grpc/watchdog]}
            logs/operator: {receivers: [file_log/operator], processors: [memory_limiter, resource/node, transform/operator, redaction/basic_v1], exporters: [otlp_grpc/watchdog]}
            metrics: {receivers: [prometheus, prometheus/kubelet, otlp], processors: [memory_limiter, resource/node, redaction/basic_v1], exporters: [otlp_grpc/metrics]}
            traces: {receivers: [otlp], processors: [memory_limiter, resource/node, redaction/basic_v1], exporters: [otlp_grpc/traces]}
      - equal:
          path: spec.config.exporters["otlp_grpc/traces"].endpoint
          value: nktp-gateway-traces-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/traces"].sending_queue
          value:
            block_on_overflow: true
            sizer: bytes
            queue_size: 67108864
            num_consumers: 32
            batch:
              sizer: bytes
              min_size: 1048576
              max_size: 2097152
              flush_timeout: 1s
      - equal:
          path: spec.config.exporters["otlp_grpc/traces"].retry_on_failure.max_elapsed_time
          value: 30m

  - it: permits disabling one OTLP transport and changing the traces backend
    set:
      daemonset.otelcol.config.receivers.otlp.protocols.grpc: null
      daemonset.otelcol.config.receivers.otlp.protocols.http.endpoint: "0.0.0.0:14318"
      daemonset.otelcol.config.exporters.otlp_grpc/traces.endpoint: traces.example:4317
    asserts:
      - equal:
          path: spec.config.receivers.otlp.protocols
          value:
            http: {endpoint: "0.0.0.0:14318"}
      - equal:
          path: spec.config.exporters["otlp_grpc/traces"].endpoint
          value: traces.example:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/logs"].endpoint
          value: nktp-gateway-logs-collector:4317
      - equal:
          path: spec.config.exporters["otlp_grpc/metrics"].endpoint
          value: nktp-gateway-metrics-collector:4317

  - it: reads new host journal entries and retries downstream failures
    asserts:
      - equal:
          path: spec.config.receivers.journald
          value:
            root_path: /hostfs
            journalctl_path: /usr/bin/journalctl
            directory: /var/log/journal
            start_at: end
            priority: info
            retry_on_failure: {enabled: true, max_elapsed_time: 0}
            operators:
              - id: identify-journal-producer
                type: add
                field: resource["service.name"]
                value: journald
              - id: classify-host-auth
                type: add
                if: 'body.SYSLOG_IDENTIFIER == "sshd" || body.SYSLOG_IDENTIFIER == "sudo"'
                field: resource["nvidia.telemetry.class"]
                value: system.auth

  - it: collects Kind runtime journals while retaining host mounts and OTLP forwarding
    values:
      - ../../dev/values.yaml
    asserts:
      - equal:
          path: spec.config.receivers.journald.directory
          value: /run/log/journal
      - contains:
          path: spec.volumes
          content:
            name: journal-persistent
            hostPath: {path: /run/log/journal, type: Directory}
      - contains:
          path: spec.volumeMounts
          content: {name: journal-persistent, mountPath: /hostfs/run/log/journal, readOnly: true}
      - lengthEqual:
          path: spec.volumes
          count: 10
      - lengthEqual:
          path: spec.volumeMounts
          count: 11
      - contains:
          path: spec.volumes
          content:
            name: internal-tls-client
            secret:
              secretName: nktp-daemonset-client-tls
              items:
                - {key: tls.crt, path: tls.crt}
                - {key: tls.key, path: tls.key}
                - {key: ca.crt, path: ca.crt}
      - contains:
          path: spec.volumeMounts
          content: {name: internal-tls-client, mountPath: /etc/nktp/internal-tls/client, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: host-proc, mountPath: /hostfs/proc, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: host-lib64, mountPath: /hostfs/usr/lib64, readOnly: true}
      - contains:
          path: spec.volumes
          content:
            name: host-logs
            hostPath: {path: /var/log, type: Directory}
      - contains:
          path: spec.volumeMounts
          content: {name: host-logs, mountPath: /hostfs/var/log, readOnly: true}
      - equal:
          path: spec.config.service.pipelines.logs
          value:
            receivers: [file_log, journald, otlp, file_log/host-auth, file_log/host-audit, file_log/kube-api-audit]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp_grpc/logs]

  - it: disables cert-manager for the Target Allocator mTLS certificates with certManager.targetAllocators.enabled
    set:
      certManager.targetAllocators.enabled: false
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: false}

  - it: lets the allocator's own mtls.useCertManager override certManager.targetAllocators.enabled
    set:
      certManager.targetAllocators.enabled: false
      daemonset.kubernetes.targetAllocator.mtls.useCertManager: true
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: true}

  - it: supports allocator resource and security overrides independently of Collector settings
    template: templates/daemonset.yaml
    set:
      daemonset.kubernetes.targetAllocator.resources.requests.cpu: 100m
      daemonset.kubernetes.targetAllocator.securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.targetAllocator.resources.requests.cpu
          value: 100m
      - equal:
          path: spec.targetAllocator.securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.securityContext.readOnlyRootFilesystem
          value: true
