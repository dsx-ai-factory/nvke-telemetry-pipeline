suite: node collector examples
release:
  namespace: nktp
templates:
  - templates/daemonset.yaml
tests:
  - it: collects per-process host metrics with the documented opt-in values
    values:
      - ../../docs/examples/host_process_metrics.values.yaml
    asserts:
      - equal:
          path: spec.config.receivers.hostmetrics
          value:
            root_path: /hostfs
            collection_interval: 1m
            scrapers:
              process:
                mute_process_exe_error: true
                mute_process_user_error: true
                resource_attributes:
                  process.command_line: {enabled: false}
      - equal:
          path: spec.config.service.pipelines["metrics/process"]
          value:
            receivers: [hostmetrics]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp/metrics]
      # Adding the process pipeline must preserve the existing scrape pipeline.
      - equal:
          path: spec.config.service.pipelines.metrics
          value:
            receivers: [prometheus, prometheus/kubelet, otlp]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp/metrics]
      - equal:
          path: spec.securityContext
          value:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SYS_CHROOT, SYS_PTRACE, DAC_READ_SEARCH]}
            appArmorProfile: {type: Unconfined}
      - lengthEqual:
          path: spec.volumes
          count: 9
      - lengthEqual:
          path: spec.volumeMounts
          count: 10
      - contains:
          path: spec.volumes
          content:
            name: host-passwd
            hostPath: {path: /etc/passwd, type: File}
      - contains:
          path: spec.volumeMounts
          content: {name: host-passwd, mountPath: /etc/passwd, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: host-proc, mountPath: /hostfs/proc, readOnly: true}
      - notExists:
          path: spec.hostPID

  - it: stores log read positions on the node with the documented opt-in values
    values:
      - ../../docs/examples/daemonset_log_checkpoints.values.yaml
    asserts:
      - equal:
          path: spec.config.extensions["file_storage/log-checkpoints"]
          value:
            directory: /var/lib/otelcol/log-checkpoints
            create_directory: true
            timeout: 1s
      - equal:
          path: spec.config.service.extensions
          value: [health_check, file_storage/log-checkpoints]
      - equal:
          path: spec.config.receivers.journald.storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers.journald.start_at
          value: end
      - equal:
          path: spec.config.receivers.filelog.storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers["filelog/host-auth"].storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers["filelog/host-audit"].storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers["filelog/kube-api-audit"].storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers["filelog/targetallocator"].storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.config.receivers["filelog/operator"].storage
          value: file_storage/log-checkpoints
      - equal:
          path: spec.securityContext.runAsUser
          value: 0
      - lengthEqual:
          path: spec.volumes
          count: 10
      - lengthEqual:
          path: spec.volumeMounts
          count: 11
      - contains:
          path: spec.volumes
          content:
            name: log-checkpoints
            hostPath: {path: /var/lib/nktp/log-checkpoints, type: DirectoryOrCreate}
      - contains:
          path: spec.volumeMounts
          content: {name: log-checkpoints, mountPath: /var/lib/otelcol/log-checkpoints}
      - contains:
          path: spec.volumeMounts
          content: {name: internal-tls-client, mountPath: /etc/nktp/internal-tls/client, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
