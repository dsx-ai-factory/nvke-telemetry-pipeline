suite: node collector examples
release:
  namespace: nktp
templates:
  - templates/daemonset.yaml
tests:
  - it: collects per-process host metrics with the documented opt-in values
    values:
      - ../../docs/examples/host_process_metrics.values.yaml
    asserts:
      - equal:
          path: spec.config.receivers.host_metrics
          value:
            root_path: /hostfs
            collection_interval: 1m
            scrapers:
              process:
                mute_process_exe_error: true
                mute_process_user_error: true
                resource_attributes:
                  process.command_line: {enabled: false}
      - equal:
          path: spec.config.service.pipelines["metrics/process"]
          value:
            receivers: [host_metrics]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp_grpc/metrics]
      # Adding the process pipeline must preserve the existing scrape pipeline.
      - equal:
          path: spec.config.service.pipelines.metrics
          value:
            receivers: [prometheus, prometheus/kubelet, otlp]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp_grpc/metrics]
      - equal:
          path: spec.securityContext
          value:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SYS_CHROOT, SYS_PTRACE, DAC_READ_SEARCH]}
            appArmorProfile: {type: Unconfined}
      - lengthEqual:
          path: spec.volumes
          count: 11
      - lengthEqual:
          path: spec.volumeMounts
          count: 12
      - contains:
          path: spec.volumes
          content:
            name: host-passwd
            hostPath: {path: /etc/passwd, type: File}
      - contains:
          path: spec.volumeMounts
          content: {name: host-passwd, mountPath: /etc/passwd, readOnly: true}
      - contains:
          path: spec.volumeMounts
          content: {name: host-proc, mountPath: /hostfs/proc, readOnly: true}
      - notExists:
          path: spec.hostPID

  - it: keeps log read positions in memory without a writable host mount
    values:
      - ../../docs/examples/memory_log_checkpoints.values.yaml
    asserts:
      - notExists:
          path: spec.config.extensions["file_storage/log-checkpoints"]
      - equal:
          path: spec.config.service.extensions
          value: [health_check]
      - lengthEqual:
          path: spec.volumes
          count: 9
      - lengthEqual:
          path: spec.volumeMounts
          count: 10
      - notExists:
          path: spec.config.receivers["file_log"].storage
      - notExists:
          path: spec.config.receivers["file_log/host-auth"].storage
      - notExists:
          path: spec.config.receivers["file_log/host-audit"].storage
      - notExists:
          path: spec.config.receivers["file_log/kube-api-audit"].storage
      - notExists:
          path: spec.config.receivers["file_log/targetallocator"].storage
      - notExists:
          path: spec.config.receivers["file_log/operator"].storage
      - notExists:
          path: spec.config.receivers["journald"].storage
