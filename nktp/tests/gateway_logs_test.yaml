suite: logs gateway
release:
  namespace: nktp
templates:
  - templates/gateway-logs.yaml
tests:
  - it: forwards only logs and sends its own telemetry through its sidecar
    asserts:
      - equal:
          path: metadata.name
          value: nktp-gateway-logs
      - equal:
          path: spec.mode
          value: statefulset
      - equal:
          path: spec.resources.limits.memory
          value: 4Gi
      - contains:
          path: spec.env
          content: {name: GOMEMLIMIT, value: 1536MiB}
      - notExists:
          path: spec.deploymentUpdateStrategy
      - notExists:
          path: spec.targetAllocator
      - equal:
          path: spec.volumes[0].secret.secretName
          value: nktp-gateway-logs-server-tls
      - equal:
          path: spec.volumes[1]
          value:
            name: internal-tls-client
            secret:
              secretName: nktp-gateway-logs-client-tls
              items:
                - {key: tls.crt, path: tls.crt}
                - {key: tls.key, path: tls.key}
                - {key: ca.crt, path: ca.crt}
      - lengthEqual:
          path: spec.volumes
          count: 2
      - equal:
          path: spec.volumeMounts[0].mountPath
          value: /etc/nktp/internal-tls/server
      - equal:
          path: spec.volumeMounts[1]
          value: {name: queue, mountPath: /var/lib/otelcol/queue}
      - equal:
          path: spec.config.receivers
          value:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                  tls:
                    cert_file: /etc/nktp/internal-tls/server/tls.crt
                    key_file: /etc/nktp/internal-tls/server/tls.key
                    client_ca_file: /etc/nktp/internal-tls/server/ca.crt
                    reload_interval: 1h
                  keepalive:
                    server_parameters:
                      max_connection_age: 1m
                      max_connection_age_grace: 30s
      - equal:
          path: spec.config.service.pipelines
          value:
            logs: {receivers: [otlp], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
      - equal:
          path: spec.config.processors.memory_limiter
          value:
            check_interval: 500ms
            limit_percentage: 80
            spike_limit_percentage: 25
      - exists:
          path: spec.config.processors["redaction/basic_v1"]
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.service.telemetry
          value:
            resource:
              service.name: nktp-gateway-logs
              service.instance.id: ${env:POD_NAME}
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: basic
              processors:
                - batch:
                    schedule_delay: 1000
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319

  - it: uses the global image with an existing Operator in another namespace
    release:
      namespace: telemetry
    set:
      otelcol_image: {registry: example.com, repository: collector, tag: global}
      opentelemetry-kube-stack.opentelemetry-operator.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: telemetry
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: opentelemetry-kube-stack-0.25.1
      - equal:
          path: spec.image
          value: example.com/collector:global

  - it: mirrors the Collector image through global.imageRegistry
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.image
          value: mirror.example.com/otel/opentelemetry-collector-k8s:0.164.0

  - it: rejects a numeric image tag
    set:
      otelcol_image.tag: 1.0
    asserts:
      - failedTemplate:
          errorMessage: image tag 1 for otel/opentelemetry-collector-k8s must be a quoted string

  - it: passes workload overrides through and resolves the Collector image separately
    set:
      otelcol_image: {registry: example.com, repository: collector, tag: global}
      gateway_logs.otelcol.image: {registry: example.com, repository: collector, tag: logs}
      gateway_logs.kubernetes:
        image: example.com/collector:ignored
        config: {ignored: true}
        nodeSelector: {workload: telemetry}
        tolerations: [{key: telemetry, operator: Exists}]
        autoscaler: {maxReplicas: 32}
        resources:
          requests: {cpu: 300m}
        env:
          - name: GOMEMLIMIT
            value: 896MiB
          - name: DESTINATION
            value: telemetry.example:4317
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:logs
      - equal:
          path: spec.nodeSelector
          value: {workload: telemetry}
      - equal:
          path: spec.tolerations
          value: [{key: telemetry, operator: Exists}]
      - equal:
          path: spec.autoscaler
          value:
            minReplicas: 2
            maxReplicas: 32
            targetCPUUtilization: 60
            targetMemoryUtilization: 100
            behavior:
              scaleUp:
                stabilizationWindowSeconds: 0
                selectPolicy: Max
                policies:
                  - type: Percent
                    value: 200
                    periodSeconds: 15
                  - type: Pods
                    value: 8
                    periodSeconds: 15
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 300m, memory: 512Mi}
            limits: {cpu: "4", memory: 4Gi}
      - equal:
          path: spec.env
          value:
            - name: GOMEMLIMIT
              value: 896MiB
            - name: DESTINATION
              value: telemetry.example:4317
      - notExists:
          path: spec.config.ignored

  - it: changes forwarding fields without changing own telemetry or native expressions
    set:
      gateway_logs.otelcol.config.exporters.otlp_grpc.endpoint: ${env:DESTINATION}
      gateway_logs.otelcol.config.exporters.otlp_grpc.tls.insecure: false
      gateway_logs.otelcol.config.exporters.otlp_grpc.headers:
        x-literal: "{{ preserved }} $$TOKEN"
      gateway_logs.otelcol.config.exporters.otlp_grpc.sending_queue.queue_size: 4194304
    asserts:
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: ${env:DESTINATION}
      - equal:
          path: spec.config.exporters.otlp_grpc.tls.insecure
          value: false
      - equal:
          path: spec.config.exporters.otlp_grpc.headers
          value: {x-literal: "{{ preserved }} $$TOKEN"}
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue
          value:
            storage: file_storage/queue
            block_on_overflow: true
            sizer: bytes
            queue_size: 4194304
            num_consumers: 32
            batch: {sizer: bytes, min_size: 1048576, max_size: 2097152, flush_timeout: 1s}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319

  - it: replaces own metric exporters independently
    set:
      gateway_logs.otelcol.config.service.telemetry.metrics.readers:
        - periodic:
            exporter:
              otlp: {protocol: grpc, endpoint: http://metrics.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.metrics.readers
          value:
            - periodic:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://metrics.example:4317}
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317

  - it: replaces own log exporters independently
    set:
      gateway_logs.otelcol.config.service.telemetry.logs.processors:
        - batch:
            exporter:
              otlp: {protocol: grpc, endpoint: http://logs.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.logs.processors
          value:
            - batch:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://logs.example:4317}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317

  - it: replaces own trace exporters independently
    set:
      gateway_logs.otelcol.config.service.telemetry.traces.processors:
        - batch:
            exporter:
              otlp: {protocol: grpc, endpoint: http://traces.example:4317}
    asserts:
      - equal:
          path: spec.config.service.telemetry.traces.processors
          value:
            - batch:
                exporter:
                  otlp: {protocol: grpc, endpoint: http://traces.example:4317}
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317

  - it: changes the gRPC listener while preserving mTLS and connection rotation
    set:
      gateway_logs.otelcol.config.receivers.otlp.protocols.grpc.endpoint: ${env:GRPC_LISTEN_ADDR}
    asserts:
      - equal:
          path: spec.config.receivers.otlp.protocols
          value:
            grpc:
              endpoint: ${env:GRPC_LISTEN_ADDR}
              tls:
                cert_file: /etc/nktp/internal-tls/server/tls.crt
                key_file: /etc/nktp/internal-tls/server/tls.key
                client_ca_file: /etc/nktp/internal-tls/server/ca.crt
                reload_interval: 1h
              keepalive:
                server_parameters:
                  max_connection_age: 1m
                  max_connection_age_grace: 30s

  - it: retains a per-replica persistent queue with the default capacity
    asserts:
      - equal:
          path: spec.volumeClaimTemplates
          value:
            - metadata: {name: queue}
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests: {storage: 1Gi}
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy
          value: {whenDeleted: Retain, whenScaled: Retain}
      - equal:
          path: spec.podSecurityContext.fsGroup
          value: 10001
      - equal:
          path: spec.config.extensions["file_storage/queue"]
          value:
            directory: /var/lib/otelcol/queue/data
            create_directory: true
            fsync: false
      - equal:
          path: spec.config.service.extensions
          value: [health_check, file_storage/queue]
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.storage
          value: file_storage/queue
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.queue_size
          value: 515396076
