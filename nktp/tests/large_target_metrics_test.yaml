suite: large-target metrics
release:
  namespace: nktp
templates:
  - templates/large-target-metrics.yaml
tests:
  - it: reserves memory for large-target scrapes
    asserts:
      - equal:
          path: spec.config.service.telemetry.resource
          value:
            service.name: nktp-large-target-metrics
            service.instance.id: ${env:POD_NAME}
      - equal:
          path: spec.config.service.telemetry.traces.level
          value: basic
      - hasDocuments:
          count: 1
      - equal:
          path: "metadata.name"
          value: "nktp-large-target-metrics"
        documentIndex: 0
      - equal:
          path: "spec.mode"
          value: "statefulset"
        documentIndex: 0
      - equal:
          path: "spec.resources.requests.memory"
          value: "2Gi"
        documentIndex: 0
      - equal:
          path: "spec.resources.limits.memory"
          value: "12Gi"
        documentIndex: 0
      - equal:
          path: spec.autoscaler.behavior
          value:
            scaleUp:
              stabilizationWindowSeconds: 0
              selectPolicy: Max
              policies:
                - type: Percent
                  value: 200
                  periodSeconds: 15
                - type: Pods
                  value: 8
                  periodSeconds: 15
      - equal:
          path: "spec.targetAllocator.allocationStrategy"
          value: "consistent-hashing"
        documentIndex: 0
      - equal:
          path: "spec.targetAllocator.mtls"
          value: {"enabled": true, "useCertManager": true}
        documentIndex: 0
      - equal:
          path: "spec.config.receivers.prometheus.config.global.external_labels.nktp_metrics_pool"
          value: large-target
        documentIndex: 0
      - equal:
          path: "spec.config.receivers.prometheus.config.scrape_configs"
          value: []
        documentIndex: 0
      - equal:
          path: "spec.config.exporters.otlp_grpc.endpoint"
          value: "nktp-gateway-metrics-collector:4317"
        documentIndex: 0
      - equal:
          path: spec.config.exporters.otlp_grpc.tls
          value:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
      - equal:
          path: spec.config.processors.batch
          value: {timeout: 0s, send_batch_size: 8192, send_batch_max_size: 8192}
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.queue_size
          value: 134217728
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.num_consumers
          value: 32
      - contains:
          path: spec.env
          content: {name: GOMEMLIMIT, value: 7168MiB}
      - equal:
          path: spec.config.processors.memory_limiter
          value: {check_interval: 500ms, limit_percentage: 80, spike_limit_percentage: 15}
      - notExists:
          path: spec.config.exporters.otlp_http
      - equal:
          path: "spec.targetAllocator.prometheusCR.denyFSAccessThroughSMs"
          value: false
        documentIndex: 0
      - equal:
          path: "spec.targetAllocator.prometheusCR.serviceMonitorSelector"
          value: {"matchExpressions": [{"key": "nktp.nvidia.io/large-target", "operator": "In", "values": ["true"]}]}
        documentIndex: 0
      - equal:
          path: "spec.targetAllocator.prometheusCR.podMonitorSelector"
          value: {"matchExpressions": [{"key": "nktp.nvidia.io/large-target", "operator": "In", "values": ["true"]}]}
        documentIndex: 0
      - equal:
          path: "spec.targetAllocator.prometheusCR.probeSelector"
          value: {"matchExpressions": [{"key": "nktp.nvidia.io/large-target", "operator": "In", "values": ["true"]}]}
        documentIndex: 0
      - equal:
          path: "spec.targetAllocator.prometheusCR.scrapeConfigSelector"
          value: {"matchExpressions": [{"key": "nktp.nvidia.io/large-target", "operator": "In", "values": ["true"]}]}
        documentIndex: 0
      - equal:
          path: "spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp"
          value: {"protocol": "http/protobuf", "endpoint": "http://127.0.0.1:4319"}
        documentIndex: 0
      - equal:
          path: "spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp"
          value: {"protocol": "http/protobuf", "endpoint": "http://127.0.0.1:4319"}
        documentIndex: 0
      - equal:
          path: "spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp"
          value: {"protocol": "http/protobuf", "endpoint": "http://127.0.0.1:4319"}
        documentIndex: 0
  - it: sets independent allocator security contexts and resource budgets
    asserts:
      - equal:
          path: spec.targetAllocator.resources
          value:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
      - equal:
          path: spec.targetAllocator.podSecurityContext
          value:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      - equal:
          path: spec.targetAllocator.securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
  - it: preserves native config and workload map overrides for large_target_metrics
    set:
      otelcol_image: {registry: "example.com", repository: "collector", tag: "global"}
      large_target_metrics.otelcol.image: {registry: "example.com", repository: "collector", tag: "custom"}
      large_target_metrics.kubernetes.image: "ignored:latest"
      large_target_metrics.kubernetes.config: {"ignored": true}
      large_target_metrics.kubernetes.nodeSelector: {"telemetry": "large"}
      large_target_metrics.kubernetes.resources.requests.cpu: "750m"
      large_target_metrics.otelcol.config.exporters.otlp_grpc.endpoint: "${env:METRICS_ENDPOINT}"
      large_target_metrics.otelcol.config.receivers.prometheus.config.scrape_configs: [{"job_name": "custom", "static_configs": [{"targets": ["${env:SCRAPE_TARGET}"]}], "relabel_configs": [{"source_labels": ["__address__"], "target_label": "instance", "replacement": "$1"}]}]
    asserts:
      - equal:
          path: "spec.image"
          value: "example.com/collector:custom"
        documentIndex: 0
      - equal:
          path: "spec.nodeSelector"
          value: {"telemetry": "large"}
        documentIndex: 0
      - equal:
          path: "spec.resources.requests.cpu"
          value: "750m"
        documentIndex: 0
      - equal:
          path: "spec.resources.requests.memory"
          value: "2Gi"
        documentIndex: 0
      - notExists:
          path: "spec.config.ignored"
        documentIndex: 0
      - equal:
          path: "spec.config.exporters.otlp_grpc.endpoint"
          value: "${env:METRICS_ENDPOINT}"
        documentIndex: 0
      - equal:
          path: "spec.config.receivers.prometheus.config.scrape_configs[0].static_configs[0].targets"
          value: ["${env:SCRAPE_TARGET}"]
        documentIndex: 0
      - equal:
          path: "spec.config.receivers.prometheus.config.scrape_configs[0].relabel_configs[0].replacement"
          value: "$1"
        documentIndex: 0
  - it: uses the global image for large_target_metrics
    set:
      otelcol_image: {registry: "example.com", repository: "collector", tag: "global"}
    asserts:
      - equal:
          path: "spec.image"
          value: "example.com/collector:global"
        documentIndex: 0
  - it: mirrors the Collector image through global.imageRegistry
    set:
      global.imageRegistry: "mirror.example.com"
    asserts:
      - matchRegex:
          path: "spec.image"
          pattern: '^mirror\.example\.com/otel/opentelemetry-collector-k8s:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 0
      - matchRegex:
          path: "spec.targetAllocator.image"
          pattern: '^mirror\.example\.com/open-telemetry/opentelemetry-operator/target-allocator:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 0
  - it: replaces all own telemetry exporter lists with gRPC for large_target_metrics
    set:
      large_target_metrics.otelcol.config.service.telemetry.metrics.readers: [{"periodic": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-metrics:4317"}}}}]
      large_target_metrics.otelcol.config.service.telemetry.logs.processors: [{"batch": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-logs:4317"}}}}]
      large_target_metrics.otelcol.config.service.telemetry.traces.processors: [{"batch": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-traces:4317"}}}}]
    asserts:
      - equal:
          path: "spec.config.service.telemetry.metrics.readers"
          value: [{"periodic": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-metrics:4317"}}}}]
        documentIndex: 0
      - equal:
          path: "spec.config.service.telemetry.logs.processors"
          value: [{"batch": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-logs:4317"}}}}]
        documentIndex: 0
      - equal:
          path: "spec.config.service.telemetry.traces.processors"
          value: [{"batch": {"exporter": {"otlp": {"protocol": "grpc", "endpoint": "http://own-traces:4317"}}}}]
        documentIndex: 0
      - equal:
          path: "spec.config.exporters.otlp_grpc.endpoint"
          value: "nktp-gateway-metrics-collector:4317"
        documentIndex: 0

  - it: pushes allocator metrics directly to watchdog without a Collector scrape pipeline
    asserts:
      - notExists:
          path: spec.config.connectors
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics:
              receivers: [prometheus]
              processors: [memory_limiter, redaction/metrics_v1, batch]
              exporters: [otlp_grpc]
      - notExists:
          path: spec.config.exporters["otlp_grpc/watchdog"]
      - equal:
          path: spec.targetAllocator.observability.metrics.enableMetrics
          value: false
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers
          value:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      - equal:
          path: spec.targetAllocator.env
          value:
            - name: OTEL_SERVICE_NAME
              value: nktp-large-target-metrics-targetallocator
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)

  - it: preserves user processing without inserting a routing connector
    set:
      large_target_metrics.otelcol.config.service.pipelines.metrics.processors: [memory_limiter, resource/custom]
      large_target_metrics.otelcol.config.processors.resource/custom: {attributes: []}
    asserts:
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, resource/custom]
      - equal:
          path: spec.config.service.pipelines.metrics.receivers
          value: [prometheus]

  - it: rejects disabled target allocation
    set:
      large_target_metrics.kubernetes.targetAllocator.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: large_target_metrics.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one Collector replica

  - it: rejects removed target allocation
    set:
      large_target_metrics.kubernetes.targetAllocator: null
    asserts:
      - failedTemplate:
          errorMessage: large_target_metrics.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one Collector replica

  - it: disables cert-manager for the Target Allocator mTLS certificates with certManager.targetAllocators.enabled
    set:
      certManager.targetAllocators.enabled: false
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: false}
        documentIndex: 0

  - it: lets the allocator's own mtls.useCertManager override certManager.targetAllocators.enabled
    set:
      certManager.targetAllocators.enabled: false
      large_target_metrics.kubernetes.targetAllocator.mtls.useCertManager: true
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: true}
        documentIndex: 0
