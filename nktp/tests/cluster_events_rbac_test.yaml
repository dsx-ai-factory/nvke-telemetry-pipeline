suite: cluster events RBAC
release:
  namespace: nktp
templates:
  - templates/cluster-events-rbac.yaml
tests:
  - it: renders nothing when cluster events is disabled
    set:
      cluster_events.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants only Event reads and namespaced Lease election operations
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [events]
              verbs: [get, list, watch]
        documentSelector:
          path: kind
          value: ClusterRole
      - notExists:
          path: metadata.namespace
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              resourceNames: [nktp-cluster-events]
              verbs: [get, update]
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: metadata.namespace
          value: nktp
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: nktp-cluster-events-collector
              namespace: nktp
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: nktp-cluster-events-collector
              namespace: nktp
        documentSelector:
          path: kind
          value: RoleBinding
      - equal:
          path: metadata
          value:
            name: nktp-cluster-events
            namespace: nktp
        documentSelector:
          path: kind
          value: Lease
      - notExists:
          path: spec
        documentSelector:
          path: kind
          value: Lease

  - it: binds a custom account and avoids cross-namespace resource ownership conflicts
    release:
      namespace: telemetry
    set:
      cluster_events.kubernetes.serviceAccount: existing-event-reader
      cluster_events.otelcol.config.extensions.k8s_leader_elector.lease_name: custom-event-reader
    asserts:
      - equal:
          path: metadata.name
          value: nktp-cluster-events-telemetry
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: nktp-cluster-events-telemetry
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: existing-event-reader
              namespace: telemetry
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: metadata.namespace
          value: telemetry
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: nktp-cluster-events
        documentSelector:
          path: kind
          value: RoleBinding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: existing-event-reader
              namespace: telemetry
        documentSelector:
          path: kind
          value: RoleBinding
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              resourceNames: [custom-event-reader]
              verbs: [get, update]
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: metadata
          value:
            name: custom-event-reader
            namespace: telemetry
        documentSelector:
          path: kind
          value: Lease
