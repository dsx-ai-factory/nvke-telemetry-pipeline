suite: watchdog
release:
  name: test
  namespace: nktp
templates:
  - templates/watchdog.yaml
  - charts/opentelemetry-kube-stack/templates/hooks.yaml
tests:
  - it: creates a Collector StatefulSet with the default image
    template: templates/watchdog.yaml
    asserts:
      - equal:
          path: spec.config.service.telemetry.traces.level
          value: basic
      - notExists:
          path: spec.config.receivers["otlp/self"]
      - containsDocument:
          apiVersion: opentelemetry.io/v1beta1
          kind: OpenTelemetryCollector
          name: nktp-watchdog
      - equal:
          path: spec.mode
          value: statefulset
      - equal:
          path: spec.managementState
          value: managed
      - equal:
          path: spec.upgradeStrategy
          value: automatic
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.autoscaler
          value:
            minReplicas: 2
            maxReplicas: 16
            targetCPUUtilization: 75
            targetMemoryUtilization: 75
            behavior:
              scaleUp:
                stabilizationWindowSeconds: 0
                selectPolicy: Max
                policies:
                  - type: Percent
                    value: 200
                    periodSeconds: 15
                  - type: Pods
                    value: 8
                    periodSeconds: 15
      - equal:
          path: spec.podDisruptionBudget
          value:
            maxUnavailable: 25%
      - notExists:
          path: spec.deploymentUpdateStrategy
      - equal:
          path: spec.targetAllocator.enabled
          value: true
      - matchRegex:
          path: spec.targetAllocator.image
          pattern: '^ghcr\.io/open-telemetry/opentelemetry-operator/target-allocator:[0-9]+\.[0-9]+\.[0-9]+$'
      - equal:
          path: spec.targetAllocator.mtls
          value:
            enabled: true
            useCertManager: true
      - equal:
          path: spec.targetAllocator.replicas
          value: 1
      - equal:
          path: spec.targetAllocator.podSecurityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.targetAllocator.securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      - equal:
          path: spec.targetAllocator.allocationStrategy
          value: consistent-hashing
      - equal:
          path: spec.targetAllocator.resources
          value:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
      - equal:
          path: spec.targetAllocator.env
          value:
            - name: OTEL_SERVICE_NAME
              value: nktp-watchdog-targetallocator
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)
      - equal:
          path: spec.targetAllocator.telemetry
          value:
            metrics:
              readers:
                - periodic:
                    interval: 30s
                    exporter:
                      otlpGrpc:
                        endpoint: nktp-watchdog-collector:4320
                        tls:
                          insecure: true
                        temporalityPreference: cumulative
      - equal:
          path: spec.targetAllocator.prometheusCR
          value:
            enabled: false
      - equal:
          path: spec.targetAllocator.observability
          value:
            metrics:
              enableMetrics: false
      - equal:
          path: spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nktp-watchdog-collector
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nktp-watchdog-collector
      - equal:
          path: spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.podSecurityContext
          value:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      - notExists:
          path: spec.lifecycle
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "4", memory: 1Gi}
      - equal:
          path: spec.env
          value:
            - name: GOMEMLIMIT
              value: 192MiB
            - name: GOGC
              value: "50"
      - equal:
          path: spec.config.exporters.otlp_grpc
          value:
            endpoint: lgtm:4317
            tls:
              insecure: true
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              storage: file_storage/queue
              block_on_overflow: true
              sizer: bytes
              queue_size: 85899346
              num_consumers: 32
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
      - matchRegex:
          path: spec.image
          pattern: '^otel/opentelemetry-collector-k8s:[0-9]+\.[0-9]+\.[0-9]+$'
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: '^opentelemetry-kube-stack-[0-9]+\.[0-9]+\.[0-9]+$'
      - matchRegex:
          path: spec.template.spec.containers[0].args[3]
          pattern: '^helm\.sh/chart=opentelemetry-kube-stack-[0-9]+\.[0-9]+\.[0-9]+$'
        template: charts/opentelemetry-kube-stack/templates/hooks.yaml
        documentSelector:
          path: kind
          value: Job

  - it: mounts the server certificate and requires client authentication on OTLP gRPC
    template: templates/watchdog.yaml
    asserts:
      - equal:
          path: spec.volumes
          value:
            - name: internal-tls-server
              secret:
                secretName: nktp-watchdog-server-tls
                items:
                  - {key: tls.crt, path: tls.crt}
                  - {key: tls.key, path: tls.key}
                  - {key: ca.crt, path: ca.crt}
      - equal:
          path: spec.volumeMounts
          value:
            - name: internal-tls-server
              mountPath: /etc/nktp/internal-tls/server
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol/queue
      - equal:
          path: spec.config.receivers["otlp/secure"].protocols
          value: &watchdogProtocols
            grpc:
              endpoint: 0.0.0.0:4317
              tls:
                cert_file: /etc/nktp/internal-tls/server/tls.crt
                key_file: /etc/nktp/internal-tls/server/tls.key
                client_ca_file: /etc/nktp/internal-tls/server/ca.crt
                reload_interval: 1h
              keepalive:
                server_parameters:
                  max_connection_age: 5m
                  max_connection_age_grace: 30s
      - notExists:
          path: spec.initContainers[0].volumeMounts

  - it: isolates plaintext allocator metrics from secure signals and the sidecar port
    template: templates/watchdog.yaml
    asserts:
      - equal:
          path: spec.config.receivers["otlp/insecure"]
          value:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4320
      - notExists:
          path: spec.config.receivers.otlp
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics: {receivers: [otlp/insecure, otlp/secure, prometheus], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            logs: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            traces: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"receivers":\{"otlp":\{"protocols":\{"http":\{"endpoint":"127\.0\.0\.1:4319","keepalive":\{"idle_timeout":"5m"\}\}\}\}\}'
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319

  - it: uses the global Collector image override
    template: templates/watchdog.yaml
    set:
      otelcol_image: {registry: example.com, repository: collector, tag: global}
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:global

  - it: discovers only Operator scrape targets and receives allocator metrics over OTLP
    template: templates/watchdog.yaml
    release:
      namespace: telemetry
    asserts:
      - equal:
          path: metadata.namespace
          value: telemetry
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs
          value:
            - job_name: nktp-operator
              scrape_interval: 30s
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    own_namespace: true
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_service_name
                    - __meta_kubernetes_endpointslice_port_name
                    - __meta_kubernetes_endpointslice_endpoint_conditions_ready
                    - __meta_kubernetes_endpointslice_address_target_kind
                  regex: nktp-operator;metrics;true;Pod
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_endpointslice_address_target_name]
                  target_label: pod
      - equal:
          path: spec.config.service.pipelines.metrics.receivers
          value: [otlp/insecure, otlp/secure, prometheus]
      - equal:
          path: spec.targetAllocator.prometheusCR.enabled
          value: false
      - equal:
          path: spec.targetAllocator.observability.metrics.enableMetrics
          value: false

  - it: pushes its allocator metrics independently of scrape targets and replica counts
    template: templates/watchdog.yaml
    set:
      watchdog.kubernetes.targetAllocator.replicas: 2
      watchdog.otelcol.config.receivers.prometheus.config.scrape_configs:
        - job_name: custom
          static_configs: [{targets: ["custom:9090"]}]
    asserts:
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers
          value:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs
          value:
            - job_name: custom
              static_configs: [{targets: ["custom:9090"]}]
      - equal:
          path: spec.config.receivers["otlp/secure"].protocols.grpc.endpoint
          value: 0.0.0.0:4317
      - equal:
          path: spec.config.service.pipelines.metrics
          value:
            receivers: [otlp/insecure, otlp/secure, prometheus]
            processors: [memory_limiter, redaction/basic_v1, transform/cluster]
            exporters: [otlp_grpc]

  - it: fills in the empty default registry with global.imageRegistry
    template: templates/watchdog.yaml
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - matchRegex:
          path: spec.image
          pattern: '^mirror\.example\.com/otel/opentelemetry-collector-k8s:[0-9]+\.[0-9]+\.[0-9]+$'
      - matchRegex:
          path: spec.targetAllocator.image
          pattern: '^mirror\.example\.com/open-telemetry/opentelemetry-operator/target-allocator:[0-9]+\.[0-9]+\.[0-9]+$'

  - it: uses the Operator's Target Allocator image by default
    template: templates/watchdog.yaml
    asserts:
      - matchRegex:
          path: spec.targetAllocator.image
          pattern: '^ghcr\.io/open-telemetry/opentelemetry-operator/target-allocator:[0-9]+\.[0-9]+\.[0-9]+$'

  - it: keeps a workload Target Allocator image override
    template: templates/watchdog.yaml
    set:
      global.imageRegistry: mirror.example.com
      watchdog.kubernetes.targetAllocator.image: example.com/allocator:custom
    asserts:
      - equal:
          path: spec.targetAllocator.image
          value: example.com/allocator:custom

  - it: replaces an image's own registry with global.imageRegistry
    template: templates/watchdog.yaml
    set:
      otelcol_image: {registry: registry.k8s.io, repository: example/collector, tag: 1.0.0}
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.image
          value: mirror.example.com/example/collector:1.0.0

  - it: prefers the watchdog image override
    template: templates/watchdog.yaml
    set:
      otelcol_image: {registry: example.com, repository: collector, tag: global}
      watchdog.kubernetes.image: example.com/collector:kubernetes
      watchdog.otelcol.image: {registry: example.com, repository: collector, tag: watchdog}
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:watchdog

  - it: passes Kubernetes settings to the Collector spec
    template: templates/watchdog.yaml
    set:
      watchdog.kubernetes:
        replicas: 6
        autoscaler:
          targetCPUUtilization: 60
        podManagementPolicy: OrderedReady
        podSecurityContext:
          fsGroup: 2000
        securityContext:
          readOnlyRootFilesystem: false
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        resources:
          requests:
            memory: 128Mi
        nodeSelector:
          kubernetes.io/os: linux
        env:
          - name: EXAMPLE
            value: watchdog
    asserts:
      - equal:
          path: spec.replicas
          value: 6
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "4", memory: 1Gi}
      - equal:
          path: spec.autoscaler
          value:
            minReplicas: 2
            maxReplicas: 16
            targetCPUUtilization: 60
            targetMemoryUtilization: 75
            behavior:
              scaleUp:
                stabilizationWindowSeconds: 0
                selectPolicy: Max
                policies:
                  - type: Percent
                    value: 200
                    periodSeconds: 15
                  - type: Pods
                    value: 8
                    periodSeconds: 15
      - equal:
          path: spec.nodeSelector
          value:
            kubernetes.io/os: linux
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady
      - equal:
          path: spec.podSecurityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
      - equal:
          path: spec.securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      - equal:
          path: spec.lifecycle.preStop.sleep.seconds
          value: 10
      - equal:
          path: spec.env
          value:
            - name: EXAMPLE
              value: watchdog

  - it: changes its own log level without removing default telemetry or pipelines
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.service.telemetry.logs.level: debug
    asserts:
      - equal:
          path: spec.config.service.telemetry.logs
          value:
            level: debug
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
      - equal:
          path: spec.config.receivers["otlp/secure"].protocols
          value: *watchdogProtocols
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.processors.memory_limiter
          value:
            check_interval: 500ms
            limit_percentage: 80
            spike_limit_percentage: 25
      - exists:
          path: spec.config.processors["redaction/basic_v1"]
        template: templates/watchdog.yaml
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics: {receivers: [otlp/insecure, otlp/secure, prometheus], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            logs: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            traces: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
      - equal:
          path: spec.config.service.telemetry.metrics.readers
          value:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors
          value:
            - batch:
                schedule_delay: 1000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.resource
          value:
            service.name: nktp-watchdog
            service.instance.id: ${env:POD_NAME}

  - it: redirects its own metrics to gRPC without changing other telemetry
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.service.telemetry.metrics.readers:
        - periodic:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://metrics.example:4317
    asserts:
      - equal:
          path: spec.config.service.telemetry
          value:
            resource:
              service.name: nktp-watchdog
              service.instance.id: ${env:POD_NAME}
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: grpc
                        endpoint: http://metrics.example:4317
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: basic
              processors:
                - batch:
                    schedule_delay: 1000
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics: {receivers: [otlp/insecure, otlp/secure, prometheus], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            logs: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            traces: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}

  - it: redirects its own logs to gRPC without changing other telemetry
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.service.telemetry.logs.processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://logs.example:4317
    asserts:
      - equal:
          path: spec.config.service.telemetry
          value:
            resource:
              service.name: nktp-watchdog
              service.instance.id: ${env:POD_NAME}
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: grpc
                        endpoint: http://logs.example:4317
            traces:
              level: basic
              processors:
                - batch:
                    schedule_delay: 1000
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics: {receivers: [otlp/insecure, otlp/secure, prometheus], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            logs: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            traces: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}

  - it: redirects its own traces to gRPC without changing other telemetry
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.service.telemetry.traces.processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://traces.example:4317
    asserts:
      - equal:
          path: spec.config.service.telemetry
          value:
            resource:
              service.name: nktp-watchdog
              service.instance.id: ${env:POD_NAME}
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: basic
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: grpc
                        endpoint: http://traces.example:4317
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics: {receivers: [otlp/insecure, otlp/secure, prometheus], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            logs: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}
            traces: {receivers: [otlp/secure], processors: [memory_limiter, redaction/basic_v1, transform/cluster], exporters: [otlp_grpc]}

  - it: changes forwarding settings independently of its own telemetry
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.exporters.otlp_grpc.endpoint: telemetry.example:4317
      watchdog.otelcol.config.exporters.otlp_grpc.sending_queue.queue_size: 2097152
    asserts:
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: telemetry.example:4317
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue
          value:
            storage: file_storage/queue
            block_on_overflow: true
            sizer: bytes
            queue_size: 2097152
            num_consumers: 32
            batch:
              sizer: bytes
              min_size: 1048576
              max_size: 2097152
              flush_timeout: 1s
      - equal:
          path: spec.config.service.telemetry.logs.processors[0].batch.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.metrics.readers[0].periodic.exporter.otlp.endpoint
          value: http://127.0.0.1:4319
      - equal:
          path: spec.config.service.telemetry.traces.processors
          value:
            - batch:
                schedule_delay: 1000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://127.0.0.1:4319

  - it: preserves native environment references and literal expressions
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.receivers.otlp/secure.protocols.grpc.endpoint: ${env:WATCHDOG_LISTEN_ADDR}
      watchdog.otelcol.config.exporters.otlp_grpc.endpoint: ${env:WATCHDOG_OTLP_ENDPOINT}
      watchdog.otelcol.config.exporters.otlp_grpc.headers:
        x-literal: "{{ preserved }} $$TOKEN"
    asserts:
      - equal:
          path: spec.config.receivers["otlp/secure"].protocols.grpc.endpoint
          value: ${env:WATCHDOG_LISTEN_ADDR}
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: ${env:WATCHDOG_OTLP_ENDPOINT}
      - equal:
          path: spec.config.exporters.otlp_grpc.headers
          value:
            x-literal: "{{ preserved }} $$TOKEN"

  - it: replaces a pipeline exporter list without appending its default
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.exporters.debug: {}
      watchdog.otelcol.config.service.pipelines.metrics.exporters: [debug]
    asserts:
      - equal:
          path: spec.config.service.pipelines.metrics
          value:
            receivers: [otlp/insecure, otlp/secure, prometheus]
            processors: [memory_limiter, redaction/basic_v1, transform/cluster]
            exporters: [debug]
      - equal:
          path: spec.config.exporters.debug
          value: {}
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: lgtm:4317
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: [otlp_grpc]
      - equal:
          path: spec.config.service.pipelines.traces.exporters
          value: [otlp_grpc]

  - it: replaces plaintext gRPC with HTTP without altering the secure receiver
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config.receivers.otlp/insecure.protocols.grpc: null
      watchdog.otelcol.config.receivers.otlp/insecure.protocols.http.endpoint: 0.0.0.0:4320
    asserts:
      - equal:
          path: spec.config.receivers["otlp/insecure"].protocols
          value:
            http:
              endpoint: 0.0.0.0:4320
      - equal:
          path: spec.config.receivers["otlp/secure"].protocols
          value: *watchdogProtocols
      - notExists:
          path: spec.config.receivers["otlp/self"]

  - it: renders for an existing operator and CRDs
    template: templates/watchdog.yaml
    set:
      opentelemetry-kube-stack.opentelemetry-operator.enabled: false
      opentelemetry-kube-stack.crds.installOtel: false
      opentelemetry-kube-stack.crds.installPrometheus: false
    asserts:
      - containsDocument:
          apiVersion: opentelemetry.io/v1beta1
          kind: OpenTelemetryCollector
          name: nktp-watchdog
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: '^opentelemetry-kube-stack-[0-9]+\.[0-9]+\.[0-9]+$'

  - it: rejects string configuration
    template: templates/watchdog.yaml
    set:
      watchdog.otelcol.config: "{}"
    asserts:
      - failedTemplate:
          errorMessage: watchdog.otelcol.config must be a native Collector YAML map

  - it: rejects disabling target allocation
    template: templates/watchdog.yaml
    set:
      watchdog.kubernetes.targetAllocator.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: watchdog.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one watchdog replica

  - it: rejects removing target allocation
    template: templates/watchdog.yaml
    set:
      watchdog.kubernetes.targetAllocator: null
    asserts:
      - failedTemplate:
          errorMessage: watchdog.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one watchdog replica

  - it: disables cert-manager for the Target Allocator mTLS certificates with certManager.targetAllocators.enabled
    template: templates/watchdog.yaml
    set:
      certManager.targetAllocators.enabled: false
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: false}

  - it: lets the allocator's own mtls.useCertManager override certManager.targetAllocators.enabled
    template: templates/watchdog.yaml
    set:
      certManager.targetAllocators.enabled: false
      watchdog.kubernetes.targetAllocator.mtls.useCertManager: true
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: true}

  - it: supports allocator resource and security overrides independently of Collector settings
    template: templates/watchdog.yaml
    set:
      watchdog.kubernetes.targetAllocator.resources.requests.cpu: 100m
      watchdog.kubernetes.targetAllocator.securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.targetAllocator.resources.requests.cpu
          value: 100m
      - equal:
          path: spec.targetAllocator.securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.securityContext.readOnlyRootFilesystem
          value: true

  - it: retains a per-replica persistent queue with the default capacity
    template: templates/watchdog.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates
          value:
            - metadata: {name: queue}
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests: {storage: 1Gi}
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy
          value: {whenDeleted: Retain, whenScaled: Retain}
      - equal:
          path: spec.podSecurityContext.fsGroup
          value: 10001
      - equal:
          path: spec.config.extensions["file_storage/queue"]
          value:
            directory: /var/lib/otelcol/queue/data
            create_directory: true
            fsync: false
      - equal:
          path: spec.config.service.extensions
          value: [health_check, file_storage/queue]
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.storage
          value: file_storage/queue
      - equal:
          path: spec.config.exporters.otlp_grpc.sending_queue.queue_size
          value: 85899346
