suite: internal TLS certificates
release:
  name: nktp
  namespace: nktp
templates:
  - templates/certs.yaml
tests:
  - it: creates the internal CA and collector-to-gateway and watchdog leaf certificates by default
    asserts:
      - hasDocuments:
          count: 13
      - equal:
          path: spec.selfSigned
          value: {}
        documentSelector:
          path: metadata.name
          value: nktp-internal-selfsigned-issuer
      - equal:
          path: spec
          value:
            secretName: nktp-internal-ca
            commonName: nktp-internal-ca
            duration: 43800h
            renewBefore: 8760h
            isCA: true
            usages: [cert sign]
            privateKey:
              rotationPolicy: Never
            issuerRef:
              name: nktp-internal-selfsigned-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-internal-ca
      - equal:
          path: spec.ca.secretName
          value: nktp-internal-ca
        documentSelector:
          path: metadata.name
          value: nktp-internal-ca-issuer
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-daemonset-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-large-target-metrics-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-cluster-events-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-watchdog-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-client, any: true}
      - equal:
          path: spec
          value:
            secretName: nktp-gateway-logs-server-tls
            duration: 2160h
            renewBefore: 360h
            dnsNames:
              - nktp-gateway-logs-collector
              - nktp-gateway-logs-collector.nktp
              - nktp-gateway-logs-collector.nktp.svc
              - nktp-gateway-logs-collector.nktp.svc.cluster.local
            usages: [server auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-gateway-logs-server
      - equal:
          path: spec
          value:
            secretName: nktp-daemonset-client-tls
            commonName: nktp-daemonset
            duration: 2160h
            renewBefore: 360h
            usages: [client auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-daemonset-client

  - it: issues the watchdog server certificate for Service DNS names in the release namespace
    release:
      namespace: telemetry
    documentSelector:
      path: metadata.name
      value: nktp-watchdog-server
    asserts:
      - equal:
          path: metadata.namespace
          value: telemetry
      - equal:
          path: spec
          value:
            secretName: nktp-watchdog-server-tls
            duration: 2160h
            renewBefore: 360h
            dnsNames:
              - nktp-watchdog-collector
              - nktp-watchdog-collector.telemetry
              - nktp-watchdog-collector.telemetry.svc
              - nktp-watchdog-collector.telemetry.svc.cluster.local
            usages: [server auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io

  - it: issues dedicated client certificates for all three gateway sidecars
    asserts:
      - equal:
          path: spec
          value:
            secretName: nktp-gateway-logs-client-tls
            commonName: nktp-gateway-logs
            duration: 2160h
            renewBefore: 360h
            usages: [client auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-gateway-logs-client
      - equal:
          path: spec
          value:
            secretName: nktp-gateway-metrics-client-tls
            commonName: nktp-gateway-metrics
            duration: 2160h
            renewBefore: 360h
            usages: [client auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-gateway-metrics-client
      - equal:
          path: spec
          value:
            secretName: nktp-gateway-traces-client-tls
            commonName: nktp-gateway-traces
            duration: 2160h
            renewBefore: 360h
            usages: [client auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-gateway-traces-client

  - it: uses the configured external issuer for all leaf certificates
    set:
      certManager.internalTLS.issuerRef:
        name: corporate-workload-ca
        kind: ClusterIssuer
        group: cert-manager.io
    asserts:
      - hasDocuments:
          count: 10
      - containsDocument:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          any: true
        not: true
      - equal:
          path: spec.issuerRef
          value:
            name: corporate-workload-ca
            kind: ClusterIssuer
            group: cert-manager.io

  - it: omits the server and client certificates of disabled gateways
    set:
      gateway_logs.enabled: false
      gateway_traces.enabled: false
    asserts:
      - hasDocuments:
          count: 9
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-server}
        not: true
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-client}
        not: true
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-server}
        not: true
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-client}
        not: true
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-watchdog-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-daemonset-client, any: true}

  - it: creates no certificate resources when internal TLS is disabled
    set:
      certManager.internalTLS.enabled: false
    asserts:
      - hasDocuments:
          count: 0
