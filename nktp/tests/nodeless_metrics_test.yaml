suite: nodeless metrics
release:
  namespace: nktp
templates:
  - templates/nodeless-metrics.yaml
tests:
  - it: scrapes targets without a node with consistent hashing
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: nktp-nodeless-metrics
      - equal:
          path: spec.mode
          value: statefulset
      - equal:
          path: spec.replicas
          value: 2
      - notExists:
          path: spec.autoscaler
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      - contains:
          path: spec.env
          content: {name: GOMEMLIMIT, value: 384MiB}
      - equal:
          path: spec.config.processors.memory_limiter
          value: {check_interval: 500ms, limit_percentage: 80, spike_limit_percentage: 25}
      - equal:
          path: spec.targetAllocator.allocationStrategy
          value: consistent-hashing
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: true}
      - equal:
          path: spec.targetAllocator.prometheusCR.denyFSAccessThroughSMs
          value: false
      - equal:
          path: spec.config.receivers.prometheus.config
          value:
            global:
              external_labels: {nktp_metrics_pool: nodeless}
            scrape_configs: []
      - equal:
          path: spec.config.exporters.otlp_grpc.endpoint
          value: nktp-gateway-metrics-collector:4317
      - equal:
          path: spec.config.exporters.otlp_grpc.tls
          value:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
      - equal:
          path: spec.config.service.pipelines
          value:
            metrics:
              receivers: [prometheus]
              processors: [memory_limiter, redaction/basic_v1]
              exporters: [otlp_grpc]
      - equal:
          path: spec.config.service.telemetry.resource
          value:
            service.name: nktp-nodeless-metrics
            service.instance.id: ${env:POD_NAME}

  - it: selects the node collector's monitors and drops every target with a node
    asserts:
      - equal:
          path: spec.targetAllocator.prometheusCR.serviceMonitorSelector
          value:
            matchExpressions:
              - {key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}
              - {key: app, operator: NotIn, values: [kube-prometheus-stack-kubelet, prometheus-operator-kubelet]}
      - equal:
          path: spec.targetAllocator.prometheusCR.podMonitorSelector
          value: &selector
            matchExpressions:
              - {key: nktp.nvidia.io/large-target, operator: NotIn, values: ["true"]}
      - equal:
          path: spec.targetAllocator.prometheusCR.probeSelector
          value: *selector
      - equal:
          path: spec.targetAllocator.prometheusCR.scrapeConfigSelector
          value: *selector
      - equal:
          path: spec.targetAllocator.prometheusCR.scrapeClasses
          value:
            - name: nktp-nodeless-targets
              default: true
              relabelings:
                - sourceLabels:
                    - __meta_kubernetes_pod_node_name
                    - __meta_kubernetes_node_name
                    - __meta_kubernetes_endpoint_node_name
                    - __meta_kubernetes_endpointslice_address_target_kind
                    - __meta_kubernetes_endpointslice_address_target_name
                  separator: ";"
                  regex: "[^;]+;.*|[^;]*;[^;]+;.*|[^;]*;[^;]*;[^;]+;.*|[^;]*;[^;]*;[^;]*;Node;[^;]+"
                  action: drop

  - it: pushes allocator metrics to watchdog and sets its own resource budget
    asserts:
      - equal:
          path: spec.targetAllocator.observability.metrics.enableMetrics
          value: false
      - equal:
          path: spec.targetAllocator.telemetry.metrics.readers
          value:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      - contains:
          path: spec.targetAllocator.env
          content: {name: OTEL_SERVICE_NAME, value: nktp-nodeless-metrics-targetallocator}
      - equal:
          path: spec.targetAllocator.resources
          value:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
      - equal:
          path: spec.targetAllocator.podSecurityContext
          value:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      - equal:
          path: spec.targetAllocator.securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}

  - it: mounts its own client certificate
    asserts:
      - contains:
          path: spec.volumes
          content:
            name: internal-tls-client
            secret:
              secretName: nktp-nodeless-metrics-client-tls
              items:
                - {key: tls.crt, path: tls.crt}
                - {key: tls.key, path: tls.key}
                - {key: ca.crt, path: ca.crt}
      - matchRegex:
          path: spec.initContainers[0].args[0]
          pattern: '"service.name":"nktp-nodeless-metrics-sidecar"'

  - it: preserves native config and workload overrides
    set:
      nodeless_metrics.otelcol.image: {registry: "example.com", repository: "collector", tag: "custom"}
      nodeless_metrics.kubernetes.replicas: 3
      nodeless_metrics.otelcol.config.receivers.prometheus.config.scrape_configs: [{"job_name": "custom", "static_configs": [{"targets": ["${env:SCRAPE_TARGET}"]}]}]
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:custom
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[0].static_configs[0].targets
          value: ["${env:SCRAPE_TARGET}"]

  - it: mirrors the Collector and Target Allocator images through global.imageRegistry
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.image
          value: mirror.example.com/otel/opentelemetry-collector-k8s:0.164.0
      - equal:
          path: spec.targetAllocator.image
          value: mirror.example.com/open-telemetry/opentelemetry-operator/target-allocator:0.161.0

  - it: rejects disabled target allocation
    set:
      nodeless_metrics.kubernetes.targetAllocator.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: nodeless_metrics.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one Collector replica

  - it: disables cert-manager for the Target Allocator mTLS certificates with certManager.targetAllocators.enabled
    set:
      certManager.targetAllocators.enabled: false
    asserts:
      - equal:
          path: spec.targetAllocator.mtls
          value: {enabled: true, useCertManager: false}
