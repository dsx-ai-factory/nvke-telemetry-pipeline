suite: large-target metrics RBAC
release:
  namespace: nktp
templates:
  - templates/large-target-metrics-rbac.yaml
tests:
  - it: renders nothing when large-target metrics is disabled
    set:
      large_target_metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants discovery access to the allocator without Secret access
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: "kind"
          value: "ClusterRole"
        documentIndex: 0
      - equal:
          path: "metadata.name"
          value: "nktp-large-target-metrics-targetallocator-nktp"
        documentIndex: 0
      - equal:
          path: "rules"
          value: [{"apiGroups": [""], "resources": ["pods", "services", "endpoints", "namespaces", "nodes"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["discovery.k8s.io"], "resources": ["endpointslices"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["monitoring.coreos.com"], "resources": ["servicemonitors", "podmonitors", "probes", "scrapeconfigs"], "verbs": ["get", "list", "watch"]}]
        documentIndex: 0
      - equal:
          path: "kind"
          value: "ClusterRoleBinding"
        documentIndex: 1
      - equal:
          path: "subjects"
          value: [{"kind": "ServiceAccount", "name": "nktp-large-target-metrics-targetallocator", "namespace": "nktp"}]
        documentIndex: 1
      - equal:
          path: "metadata.name"
          value: "nktp-large-target-metrics-scrape-nktp"
        documentIndex: 2
      - equal:
          path: "rules"
          value: [{"nonResourceURLs": ["/metrics"], "verbs": ["get"]}]
        documentIndex: 2
      - equal:
          path: "subjects"
          value: [{"kind": "ServiceAccount", "name": "nktp-large-target-metrics-collector", "namespace": "nktp"}]
        documentIndex: 3
  - it: binds custom accounts in the release namespace
    release:
      namespace: "telemetry"
    set:
      large_target_metrics.kubernetes.targetAllocator.serviceAccount: "labeled-discovery"
      large_target_metrics.kubernetes.serviceAccount: "component-scraper"
    asserts:
      - equal:
          path: "subjects"
          value: [{"kind": "ServiceAccount", "name": "labeled-discovery", "namespace": "telemetry"}]
        documentIndex: 1
      - equal:
          path: "roleRef.name"
          value: "nktp-large-target-metrics-targetallocator-telemetry"
        documentIndex: 1
      - equal:
          path: "subjects"
          value: [{"kind": "ServiceAccount", "name": "component-scraper", "namespace": "telemetry"}]
        documentIndex: 3
      - equal:
          path: "roleRef.name"
          value: "nktp-large-target-metrics-scrape-telemetry"
        documentIndex: 3
