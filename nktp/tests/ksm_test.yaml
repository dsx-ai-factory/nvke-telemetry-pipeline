suite: kube-state-metrics workloads
release:
  name: nktp
  namespace: nktp
templates:
  - templates/ksm.yaml
tests:
  - it: runs scheduled Pods locally and six independent central groups
    asserts:
      - hasDocuments:
          count: 7
      - equal:
          path: kind
          value: DaemonSet
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --node=$(NODE_NAME)
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --track-unscheduled-pods
        documentSelector:
          path: metadata.name
          value: nktp-ksm-unscheduled-pods-0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=pods
        documentSelector:
          path: metadata.name
          value: nktp-ksm-unscheduled-pods-0
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0

  - it: assigns the telemetry priority class to every KSM workload
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: nktp-telemetry-critical

  - it: inherits an existing priority class on the DaemonSet and every Deployment shard
    set:
      priorityClass.create: false
      priorityClass.name: platform-observability
      kube-state-metrics.deployments.workloads.shards: 2
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: spec.template.spec.priorityClassName
          value: platform-observability

  - it: omits the priority class when no shared name is configured
    set:
      priorityClass.create: false
      priorityClass.name: ""
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: preserves a shared KSM priority override
    set:
      kube-state-metrics.kubernetes.priorityClassName: ksm-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: ksm-priority

  - it: preserves a shared KSM priority opt-out
    set:
      kube-state-metrics.kubernetes.priorityClassName: ""
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: ""

  - it: preserves workload priority overrides and opt-outs while other groups inherit
    set:
      kube-state-metrics.daemonset.kubernetes.priorityClassName: node-priority
      kube-state-metrics.deployments.workloads.kubernetes.priorityClassName: ""
      kube-state-metrics.deployments.workloads.shards: 2
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: node-priority
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - equal:
          path: spec.template.spec.priorityClassName
          value: ""
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.priorityClassName
          value: ""
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-1
      - equal:
          path: spec.template.spec.priorityClassName
          value: nktp-telemetry-critical
        documentSelector:
          path: metadata.name
          value: nktp-ksm-cluster-0

  - it: gives workload priority settings precedence over shared KSM settings
    set:
      kube-state-metrics.kubernetes.priorityClassName: ksm-priority
      kube-state-metrics.daemonset.kubernetes.priorityClassName: ""
      kube-state-metrics.deployments.workloads.kubernetes.priorityClassName: deployment-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: ""
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - equal:
          path: spec.template.spec.priorityClassName
          value: deployment-priority
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.priorityClassName
          value: ksm-priority
        documentSelector:
          path: metadata.name
          value: nktp-ksm-cluster-0

  - it: exposes configured Kubernetes labels in node-local and central workloads
    set:
      kube-state-metrics.metricLabelsAllowlist:
        - pods=[app.kubernetes.io/name]
        - nodes=[kubernetes.io/hostname]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-labels-allowlist=pods=[app.kubernetes.io/name],nodes=[kubernetes.io/hostname]
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-labels-allowlist=pods=[app.kubernetes.io/name],nodes=[kubernetes.io/hostname]
        documentSelector:
          path: metadata.name
          value: nktp-ksm-cluster-0

  - it: gives every shard a unique identity and one replica
    set:
      kube-state-metrics.deployments.workloads.shards: 2
    asserts:
      - hasDocuments:
          count: 8
      - contains:
          path: spec.template.spec.containers[0].args
          content: --shard=0
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --shard=1
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --total-shards=2
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-1
      - equal:
          path: spec.replicas
          value: 1
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-1
      - equal:
          path: spec.selector.matchLabels["nktp.nvidia.io/ksm-shard"]
          value: "1"
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-1

  - it: supports new groups and workload overrides without losing shared defaults
    set:
      kube-state-metrics.namespaces: [team-a, team-b]
      kube-state-metrics.deployments.configuration.enabled: false
      kube-state-metrics.deployments.settings:
        enabled: true
        resource_types: [configmaps, secrets]
        shards: 1
        kubernetes:
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
          serviceAccount: existing-reader
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution: []
          tolerations:
            - key: dedicated
              operator: Exists
          env:
            - name: GOGC
              value: "50"
    documentSelector:
      path: metadata.name
      value: nktp-ksm-settings-0
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-reader
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=team-a,team-b
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: dedicated, operator: Exists}]
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution: []
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GOGC, value: "50"}
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.resources

  - it: removes all workloads when disabled
    set:
      kube-state-metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: replaces the image's registry.k8s.io host with global.imageRegistry
    set:
      global.imageRegistry: mirror.example.com
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^mirror\.example\.com/kube-state-metrics/kube-state-metrics:v[0-9]+\.[0-9]+\.[0-9]+$'

  - it: uses a kube-state-metrics image tag override
    set:
      kube-state-metrics.image.tag: v9.9.9
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kube-state-metrics/kube-state-metrics:v9.9.9

  - it: collects all Pods centrally with independent hash shards
    set:
      kube-state-metrics.daemonset.enabled: false
      kube-state-metrics.deployments.unscheduled-pods.enabled: false
      kube-state-metrics.deployments.pods:
        enabled: true
        resource_types: [pods]
        shards: 2
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods-1
    asserts:
      - equal:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --shard=1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --total-shards=2
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --track-unscheduled-pods
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --node=$(NODE_NAME)

  - it: generates selection and Go memory flags from chart settings
    set:
      kube-state-metrics.deployments.unscheduled-pods.resource_types: [pods, configmaps]
      kube-state-metrics.deployments.unscheduled-pods.track_unscheduled_pods: false
    documentSelector:
      path: metadata.name
      value: nktp-ksm-unscheduled-pods-0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --resources=pods,configmaps
            - --auto-gomemlimit
            - --auto-gomemlimit-ratio=0.8
            - --shard=0
            - --total-shards=1

  - it: rejects unknown resources that cannot be mapped to RBAC
    set:
      kube-state-metrics.deployments.workloads.resource_types: [unknown]
    asserts:
      - failedTemplate:
          errorMessage: Unsupported KSM resource type unknown for RBAC generation

  - it: requires explicit resource selection for RBAC
    set:
      kube-state-metrics.deployments.workloads.resource_types: []
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads resource_types must not be empty

  - it: rejects zero shards instead of silently dropping coverage
    set:
      kube-state-metrics.deployments.workloads.shards: 0
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads shards must be an integer between 1 and 10000

  - it: rejects unscheduled Pod filtering when other resources are also selected
    set:
      kube-state-metrics.deployments.unscheduled-pods.resource_types: [pods, configmaps, secrets]
    asserts:
      - failedTemplate:
          errorMessage: KSM workload unscheduled-pods track_unscheduled_pods requires resource_types to be exactly [pods]

  - it: rejects unscheduled Pod filtering without Pods
    set:
      kube-state-metrics.deployments.unscheduled-pods.resource_types: [configmaps]
    asserts:
      - failedTemplate:
          errorMessage: KSM workload unscheduled-pods track_unscheduled_pods requires resource_types to be exactly [pods]

  - it: fixes DaemonSet collection to scheduled Pods regardless of unsupported selection values
    set:
      kube-state-metrics.daemonset.resource_types: [configmaps, secrets]
      kube-state-metrics.daemonset.track_unscheduled_pods: true
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ['--resources=pods', '--node=$(NODE_NAME)', '--auto-gomemlimit', '--auto-gomemlimit-ratio=0.8']

  - it: generates normalized workload namespace arguments instead of the shared selection
    set:
      kube-state-metrics.namespaces: [shared-team]
      kube-state-metrics.daemonset.namespaces: ["", " team-a ", "team-a", "team-b"]
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=team-a,team-b
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=shared-team

  - it: generates all-namespace collection when the workload overrides the shared list with an empty list
    set:
      kube-state-metrics.namespaces: [shared-team]
      kube-state-metrics.daemonset.namespaces: []
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ['--resources=pods', '--node=$(NODE_NAME)', '--auto-gomemlimit', '--auto-gomemlimit-ratio=0.8']

  - it: collects ConfigMaps without Secrets by default
    documentSelector:
      path: metadata.name
      value: nktp-ksm-configuration-0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=configmaps

  - it: collects Secret metrics when explicitly selected
    set:
      kube-state-metrics.deployments.configuration.resource_types: [configmaps, secrets]
    documentSelector:
      path: metadata.name
      value: nktp-ksm-configuration-0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=configmaps,secrets

  - it: omits optional blocks when shared Kubernetes overrides remove them
    set:
      kube-state-metrics.kubernetes.podSecurityContext: null
      kube-state-metrics.kubernetes.resources: null
      kube-state-metrics.kubernetes.securityContext: null
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].resources
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: omits optional blocks when workload Kubernetes overrides remove them
    set:
      kube-state-metrics.deployments.workloads.kubernetes.podSecurityContext: null
      kube-state-metrics.deployments.workloads.kubernetes.resources: null
      kube-state-metrics.deployments.workloads.kubernetes.securityContext: null
    documentSelector:
      path: metadata.name
      value: nktp-ksm-workloads-0
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].resources
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: generates daemonset arguments and ports without consuming an args value
    set:
      kube-state-metrics.daemonset.namespaces: [team-a]
      kube-state-metrics.daemonset.args: ['--config=/etc/ksm/options.yaml', '--resources=secrets', '--namespaces=other-team', '--port=9080', '--telemetry-port=9081', '--track-unscheduled-pods', '--shard=7']
    documentSelector:
      path: metadata.name
      value: nktp-ksm-pods
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--resources=pods", "--node=$(NODE_NAME)", "--namespaces=team-a", "--auto-gomemlimit", "--auto-gomemlimit-ratio=0.8"]
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081

  - it: generates deployments.workloads arguments and ports without consuming an args value
    set:
      kube-state-metrics.deployments.workloads.resource_types: [pods]
      kube-state-metrics.deployments.workloads.namespaces: [team-a]
      kube-state-metrics.deployments.workloads.args: ['--config=/etc/ksm/options.yaml', '--resources=secrets', '--namespaces=other-team', '--port=9080', '--telemetry-port=9081', '--track-unscheduled-pods', '--shard=7']
    documentSelector:
      path: metadata.name
      value: nktp-ksm-workloads-0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--resources=pods", "--namespaces=team-a", "--auto-gomemlimit", "--auto-gomemlimit-ratio=0.8", "--shard=0", "--total-shards=1"]
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081

  - it: exposes configured Kubernetes annotations in node-local and central workloads
    set:
      kube-state-metrics.metricAnnotationsAllowlist:
        - secrets=[example.com/cert-serial]
        - nodes=[example.com/state-*]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-annotations-allowlist=secrets=[example.com/cert-serial],nodes=[example.com/state-*]
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-annotations-allowlist=secrets=[example.com/cert-serial],nodes=[example.com/state-*]
        documentSelector:
          path: metadata.name
          value: nktp-ksm-cluster-0

  - it: exposes no Kubernetes annotations by default
    documentSelector:
      path: metadata.name
      value: nktp-ksm-cluster-0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --resources=nodes,namespaces,storageclasses,resourcequotas,limitranges,leases,certificatesigningrequests,mutatingwebhookconfigurations,validatingadmissionpolicies,validatingadmissionpolicybindings,validatingwebhookconfigurations
            - --auto-gomemlimit
            - --auto-gomemlimit-ratio=0.8
            - --shard=0
            - --total-shards=1

  - it: mounts a workload's custom-resource-state configuration from a ConfigMap
    set:
      kube-state-metrics.deployments.workloads.customResourceState:
        config:
          spec:
            resources:
              - groupVersionKind: {group: argoproj.io, version: v1alpha1, kind: Application}
        rules:
          - apiGroups: [argoproj.io]
            resources: [applications]
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: data["custom-resource-state.yaml"]
          value: |
            spec:
              resources:
              - groupVersionKind:
                  group: argoproj.io
                  kind: Application
                  version: v1alpha1
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-custom-resource-state
      - equal:
          path: metadata.namespace
          value: nktp
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-custom-resource-state
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: custom-resource-state
              configMap:
                name: nktp-ksm-workloads-custom-resource-state
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: custom-resource-state
              mountPath: /etc/kube-state-metrics
              readOnly: true
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --resources=deployments,statefulsets,daemonsets,replicasets,replicationcontrollers,jobs,cronjobs,horizontalpodautoscalers,poddisruptionbudgets
            - --custom-resource-state-config-file=/etc/kube-state-metrics/custom-resource-state.yaml
            - --auto-gomemlimit
            - --auto-gomemlimit-ratio=0.8
            - --shard=0
            - --total-shards=1
        documentSelector:
          path: metadata.name
          value: nktp-ksm-workloads-0
      - notExists:
          path: spec.template.spec.volumes
        documentSelector:
          path: metadata.name
          value: nktp-ksm-networking-0

  - it: collects only custom resources without an empty resources argument
    set:
      kube-state-metrics.deployments.custom-resources:
        enabled: true
        resource_types: []
        shards: 2
        customResourceState:
          config:
            spec:
              resources: []
    documentSelector:
      path: metadata.name
      value: nktp-ksm-custom-resources-1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --custom-resource-state-only
            - --custom-resource-state-config-file=/etc/kube-state-metrics/custom-resource-state.yaml
            - --auto-gomemlimit
            - --auto-gomemlimit-ratio=0.8
            - --shard=1
            - --total-shards=2
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: nktp-ksm-custom-resources-custom-resource-state

  - it: keeps workload volumes alongside the custom-resource-state volume
    set:
      kube-state-metrics.deployments.workloads.kubernetes.volumes:
        - name: extra
          emptyDir: {}
      kube-state-metrics.deployments.workloads.customResourceState:
        config:
          spec:
            resources: []
    documentSelector:
      path: metadata.name
      value: nktp-ksm-workloads-0
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: extra
              emptyDir: {}
            - name: custom-resource-state
              configMap:
                name: nktp-ksm-workloads-custom-resource-state

  - it: rejects a workload volume that uses the reserved custom-resource-state name
    set:
      kube-state-metrics.deployments.workloads.kubernetes.volumes:
        - name: custom-resource-state
          emptyDir: {}
      kube-state-metrics.deployments.workloads.customResourceState:
        config:
          spec:
            resources: []
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads kubernetes.volumes must not use the reserved name custom-resource-state

  - it: fixes DaemonSet collection to core Pods regardless of custom-resource settings
    set:
      kube-state-metrics.daemonset.customResourceState:
        config:
          spec:
            resources: []
    asserts:
      - hasDocuments:
          count: 7
      - equal:
          path: spec.template.spec.containers[0].args
          value: ['--resources=pods', '--node=$(NODE_NAME)', '--auto-gomemlimit', '--auto-gomemlimit-ratio=0.8']
        documentSelector:
          path: metadata.name
          value: nktp-ksm-pods

  - it: requires custom-resource-state configuration when custom-resource settings are present
    set:
      kube-state-metrics.deployments.workloads.customResourceState:
        rules:
          - apiGroups: [argoproj.io]
            resources: [applications]
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads customResourceState.config must be set

  - it: rejects custom-resource rules without apiGroups or resources
    set:
      kube-state-metrics.deployments.workloads.customResourceState:
        config:
          spec:
            resources: []
        rules:
          - resources: [applications]
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads customResourceState.rules entries need non-empty apiGroups and resources lists

  - it: rejects empty custom-resource rule verbs
    set:
      kube-state-metrics.deployments.workloads.customResourceState:
        config:
          spec:
            resources: []
        rules:
          - apiGroups: [argoproj.io]
            resources: [applications]
            verbs: []
    asserts:
      - failedTemplate:
          errorMessage: KSM workload workloads customResourceState.rules verbs must be a non-empty list
