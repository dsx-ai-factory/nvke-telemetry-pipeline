apiVersion: v2
name: nktp
description: A scalable, OpenTelemetry pipeline for collecting, processing, and exporting Kubernetes metrics, logs, and traces.
type: application
version: 0.3.0

dependencies:
  - name: opentelemetry-kube-stack
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.27.0
  - name: prometheus-node-exporter
    alias: node-exporter
    repository: https://prometheus-community.github.io/helm-charts
    version: 4.60.1
    condition: node-exporter.enabled
  - name: metrics-server
    repository: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.14.0
    condition: metrics-server.enabled
  - name: prometheus-blackbox-exporter
    alias: blackbox-exporter
    repository: https://prometheus-community.github.io/helm-charts
    version: 11.20.2
    condition: blackbox-exporter.enabled
  - name: nvcb
    repository: file://../nvcb/chart
    version: 0.1.0
