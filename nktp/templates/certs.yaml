{{- if .Values.certManager.internalTLS.enabled }}
{{- $issuerRef := .Values.certManager.internalTLS.issuerRef -}}
{{- if empty $issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nktp-internal-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nktp-internal-ca
  namespace: {{ .Release.Namespace }}
spec:
  secretName: nktp-internal-ca
  commonName: nktp-internal-ca
  duration: 43800h # Five years. CA rotation requires a coordinated trust migration.
  renewBefore: 8760h # One year.
  isCA: true
  usages:
    - cert sign
  privateKey:
    rotationPolicy: Never # Preserve the trust key during routine certificate renewal.
  issuerRef:
    name: nktp-internal-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nktp-internal-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: nktp-internal-ca
{{- end }}
{{- $servers := include "nktp.tlsServers" . | fromJsonArray -}}
{{- range $server := $servers }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $server.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $server.secretName }}
  duration: 2160h # 90 days.
  renewBefore: 360h # 15 days.
  dnsNames:
    - {{ $server.serviceName }}
    - {{ $server.serviceName }}.{{ $.Release.Namespace }}
    - {{ $server.serviceName }}.{{ $.Release.Namespace }}.svc
    - {{ $server.serviceName }}.{{ $.Release.Namespace }}.svc.cluster.local
    {{- if $server.headless }}
    # Headless Service names allow DNS round-robin clients to verify gateway TLS.
    - {{ $server.serviceName }}-headless
    - {{ $server.serviceName }}-headless.{{ $.Release.Namespace }}
    - {{ $server.serviceName }}-headless.{{ $.Release.Namespace }}.svc
    - {{ $server.serviceName }}-headless.{{ $.Release.Namespace }}.svc.cluster.local
    {{- end }}
  usages:
    - server auth
  privateKey:
    rotationPolicy: Always
  issuerRef:
    {{- if empty $issuerRef }}
    name: nktp-internal-ca-issuer
    kind: Issuer
    group: cert-manager.io
    {{- else }}
    {{- $issuerRef | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
{{- $clients := include "nktp.tlsClients" . | fromJsonArray -}}
{{- range $client := $clients }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $client.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $client.name }}-tls
  commonName: {{ $client.commonName }}
  duration: 2160h # 90 days.
  renewBefore: 360h # 15 days.
  usages:
    - client auth
  privateKey:
    rotationPolicy: Always
  issuerRef:
    {{- if empty $issuerRef }}
    name: nktp-internal-ca-issuer
    kind: Issuer
    group: cert-manager.io
    {{- else }}
    {{- $issuerRef | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
