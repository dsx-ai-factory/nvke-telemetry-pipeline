{{- $allocator := .Values.daemonset.kubernetes.targetAllocator | default dict -}}
{{- if not (and (kindIs "map" $allocator) (deepEqual $allocator.enabled true)) -}}
{{- fail "daemonset.kubernetes.targetAllocator.enabled must be true to assign scrape targets to Collectors on the same node" -}}
{{- end -}}
{{- if not (kindIs "map" .Values.daemonset.otelcol.config) -}}
{{- fail "daemonset.otelcol.config must be a native Collector YAML map" -}}
{{- end -}}
{{- $workload := deepCopy .Values.daemonset -}}
{{- $spec := omit $workload.kubernetes "config" -}}
{{- $sidecar := $workload.sidecar | default dict -}}
{{- $_ := set $sidecar "kubernetes" ($sidecar.kubernetes | default dict) -}}

{{- include "nktp.builder.withPriorityClass" (dict "target" $spec "root" $) -}}
{{- include "nktp.builder.withTargetAllocator" (dict "target" $spec "root" $) -}}
{{- with $spec.targetAllocator.prometheusCR -}}
  {{- $_ := set . "scrapeClasses" (include "nktp.nodeScrapeClasses" (dict "classes" .scrapeClasses "action" "keep" "name" "nktp-node-targets") | fromYaml).scrapeClasses -}}
{{- end -}}
{{- range $name, $field := dict "NODE_NAME" "spec.nodeName" "OTEL_K8S_NODE_IP" "status.hostIP" "POD_NAMESPACE" "metadata.namespace" -}}
  {{- include "nktp.builder.withEnv" (dict "target" $spec "item" (dict "name" $name "valueFrom" (dict "fieldRef" (dict "fieldPath" $field)))) -}}
{{- end -}}
{{- include "nktp.builder.withEnv" (dict "target" $sidecar.kubernetes "item" (dict "name" "NODE_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "spec.nodeName")))) -}}
{{- $image := include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" ($workload.otelcol.image | default .Values.otelcol_image)) -}}
{{- $_ := set $spec "image" $image -}}
{{- include "nktp.builder.withSidecar" (dict "target" $spec "sidecar" $sidecar "root" $ "name" "daemonset") -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: nktp-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* The upstream pre-delete Job selects this label to delete the Collector before the Operator. */}}
    helm.sh/chart: {{ include "opentelemetry-kube-stack.chart" (index .Subcharts "opentelemetry-kube-stack") }}
spec:
  {{- toYaml $spec | nindent 2 }}
  config:
    {{- include "nktp.collectorConfig" (dict "config" .Values.daemonset.otelcol.config "blueprints" .Values.blueprints) | nindent 4 }}
