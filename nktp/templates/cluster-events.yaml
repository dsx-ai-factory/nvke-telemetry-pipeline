{{- $workload := deepCopy .Values.cluster_events -}}
{{- $spec := omit $workload.kubernetes "config" -}}
{{- $sidecar := $workload.sidecar | default dict -}}

{{- include "nktp.builder.withPriorityClass" (dict "target" $spec "root" $) -}}
{{- include "nktp.builder.withImagePullSecrets" (dict "target" $spec "root" $) -}}
{{- $image := include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" ($workload.otelcol.image | default .Values.otelcol_image)) -}}
{{- $_ := set $spec "image" $image -}}
{{- include "nktp.builder.withSidecar" (dict "target" $spec "sidecar" $sidecar "root" $ "name" "cluster_events") -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: nktp-cluster-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* The upstream pre-delete Job selects this label to delete the Collector before the Operator. */}}
    helm.sh/chart: {{ include "opentelemetry-kube-stack.chart" (index .Subcharts "opentelemetry-kube-stack") }}
spec:
  {{- toYaml $spec | nindent 2 }}
  config:
    {{- include "nktp.collectorConfig" (dict "config" .Values.cluster_events.otelcol.config "blueprints" .Values.blueprints) | nindent 4 }}
