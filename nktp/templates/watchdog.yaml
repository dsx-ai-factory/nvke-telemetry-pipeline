{{- $allocator := .Values.watchdog.kubernetes.targetAllocator | default dict -}}
{{- if not (and (kindIs "map" $allocator) (deepEqual $allocator.enabled true)) -}}
{{- fail "watchdog.kubernetes.targetAllocator.enabled must be true to assign each scrape target to one watchdog replica" -}}
{{- end -}}
{{- if not (kindIs "map" .Values.watchdog.otelcol.config) -}}
{{- fail "watchdog.otelcol.config must be a native Collector YAML map" -}}
{{- end -}}
{{- $workload := deepCopy .Values.watchdog -}}
{{- $spec := omit $workload.kubernetes "config" -}}
{{- $sidecar := $workload.sidecar | default dict -}}
{{- $_ := set $sidecar "kubernetes" ($sidecar.kubernetes | default dict) -}}

{{- include "nktp.builder.withPriorityClass" (dict "target" $spec "root" $) -}}
{{- include "nktp.builder.withTargetAllocator" (dict "target" $spec "root" $) -}}
{{- range $item := (include "nktp.clusterNameEnv" $ | fromYaml).env -}}
  {{- include "nktp.builder.withEnv" (dict "target" $spec "item" $item) -}}
  {{- include "nktp.builder.withEnv" (dict "target" $sidecar.kubernetes "item" $item) -}}
{{- end -}}
{{- $image := include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" ($workload.otelcol.image | default .Values.otelcol_image)) -}}
{{- $_ := set $spec "image" $image -}}
{{- include "nktp.builder.withSidecar" (dict "target" $spec "sidecar" $sidecar "root" $ "name" "watchdog") -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: nktp-watchdog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* The upstream pre-delete Job selects this label to delete the Collector before the Operator. */}}
    helm.sh/chart: {{ include "opentelemetry-kube-stack.chart" (index .Subcharts "opentelemetry-kube-stack") }}
spec:
  {{- toYaml $spec | nindent 2 }}
  config:
    {{- include "nktp.collectorConfig" (dict "config" .Values.watchdog.otelcol.config "blueprints" .Values.blueprints) | nindent 4 }}
