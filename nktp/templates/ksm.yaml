{{- $root := . -}}
{{- $ksm := index .Values "kube-state-metrics" -}}
{{- range $name, $group := (include "nktp.ksm.groups" . | fromYaml) -}}
{{- $k := $group.kubernetes -}}
{{- $daemon := $group.daemonset -}}
{{- $crs := $group.customResourceState -}}
{{- $volumes := $k.volumes | default list -}}
{{- if $crs -}}
{{- range $volumes -}}
{{- if eq .name "custom-resource-state" -}}
{{- fail (printf "KSM workload %s kubernetes.volumes must not use the reserved name custom-resource-state" $name) -}}
{{- end -}}
{{- end -}}
{{- $volumes = append $volumes (dict "name" "custom-resource-state" "configMap" (dict "name" $crs.configMap)) -}}
{{- end }}
{{- with $crs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .configMap }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "nktp.ksm.labels" (dict "root" $root "group" $group) | nindent 4 }}
data:
  {{ include "nktp.ksm.customResourceStateFile" $root }}: |
    {{- toYaml .config | nindent 4 }}
{{- end }}
{{- range $shard := until (int $group.shards) }}
---
apiVersion: apps/v1
kind: {{ ternary "DaemonSet" "Deployment" $daemon }}
metadata:
  name: {{ $group.name }}{{ if not $daemon }}-{{ $shard }}{{ end }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "nktp.ksm.labels" (dict "root" $root "group" $group) | nindent 4 }}
spec:
  {{- if not $daemon }}
  replicas: 1
  # Each Deployment owns one hash shard. Avoid two active copies during updates.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nktp.ksm.labels" (dict "root" $root "group" $group) | nindent 6 }}
      nktp.nvidia.io/ksm-shard: {{ $shard | quote }}
  template:
    metadata:
      labels:
        {{- include "nktp.ksm.labels" (dict "root" $root "group" $group) | nindent 8 }}
        nktp.nvidia.io/ksm-shard: {{ $shard | quote }}
    spec:
      {{- /* Container settings are separated from the remaining PodSpec fields. */}}
      {{- omit $k "resources" "env" "securityContext" "podSecurityContext" "serviceAccount" "containers" "serviceAccountName" "volumes" | toYaml | nindent 6 }}
      serviceAccountName: {{ $group.serviceAccount }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-state-metrics
          image: {{ include "nktp.image" (dict "imageRegistry" $root.Values.global.imageRegistry "image" $ksm.image) | quote }}
          args:
            {{- $group.args | toYaml | nindent 12 }}
            {{- if not $daemon }}
            - --shard={{ $shard }}
            - --total-shards={{ int $group.shards }}
            {{- end }}
          {{- if or $daemon $k.env }}
          env:
            {{- if $daemon }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- with $k.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $k.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $k.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $crs }}
          volumeMounts:
            - name: custom-resource-state
              mountPath: {{ include "nktp.ksm.customResourceStateDir" $root }}
              readOnly: true
          {{- end }}
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
{{- end }}
{{- end }}
