{{- if not (kindIs "bool" .Values.targetAllocatorClusterSecretAccess) }}
  {{- fail "targetAllocatorClusterSecretAccess must be a boolean" }}
{{- end }}
{{- if .Values.targetAllocatorClusterSecretAccess }}
{{- $subjects := list }}
{{- range $key := list "daemonset" "large_target_metrics" "nodeless_metrics" }}
  {{- $allocator := (index $.Values $key).kubernetes.targetAllocator | default dict }}
  {{- $prometheusCR := $allocator.prometheusCR | default dict }}
  {{- if and $allocator.enabled $prometheusCR.enabled }}
    {{- $name := printf "nktp-%s-targetallocator" ($key | replace "_" "-") }}
    {{- $subjects = append $subjects (dict "kind" "ServiceAccount" "name" ($allocator.serviceAccount | default $name) "namespace" $.Release.Namespace) }}
  {{- end }}
{{- end }}
{{- if $subjects }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nktp-targetallocator-secrets-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nktp-targetallocator-secrets-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nktp-targetallocator-secrets-{{ .Release.Namespace }}
subjects:
  {{- $subjects | uniq | toYaml | nindent 2 }}
{{- end }}
{{- end }}
