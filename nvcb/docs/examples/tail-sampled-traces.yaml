# Retains traces with ERROR spans or high latency plus a baseline sample, then
# batches and exports over OTLP/HTTP.
# Set the backend URL and sampling parameters, then render this NVCB input with
# nvcb.run for Collector Contrib.
# Route all spans of each trace to the same Collector and blueprint instance,
# without upstream sampling.
# Tune decision_wait, num_traces, and Collector memory for your traffic; late
# spans, capacity exhaustion, and restarts can cause incomplete or lost traces.
blueprints:
  exporters:
    tail_sampled_traces:
      template: |
        processors:
          tail_sampling:
            decision_wait: {{ .values.decision_wait | default "30s" | quote }}
            num_traces: {{ .values.num_traces | default 50000 }}
            policies:
              - name: errors
                type: status_code
                status_code:
                  status_codes: [ERROR]
              - name: slow-traces
                type: latency
                latency:
                  threshold_ms: {{ .values.slow_trace_ms | default 1000 }}
              - name: baseline
                type: probabilistic
                probabilistic:
                  # dig preserves an explicit 0; default would replace it with 1.
                  sampling_percentage: {{ dig "baseline_percentage" 1 .values }}
          batch:
            send_batch_size: 1024
            timeout: 5s

        exporters:
          otlphttp:
            endpoint: {{ .values.endpoint | required "tail_sampled_traces: endpoint is required" | quote }}

        pipelines:
          traces:
            receivers: [{{ .forward }}]
            processors: [tail_sampling, batch]
            exporters: [otlphttp]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

exporters:
  blueprint/tail_sampled_traces/primary:
    endpoint: https://telemetry.example.com:4318
    slow_trace_ms: 1000
    baseline_percentage: 1
    decision_wait: 30s
    num_traces: 50000

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [blueprint/tail_sampled_traces/primary]
