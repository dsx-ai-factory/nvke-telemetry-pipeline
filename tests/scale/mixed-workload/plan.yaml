                )
                and on() (
                  max(resets(otelcol_exporter_sent_log_records_total{job="nktp-gateway-logs",exporter=~"otlp_grpc(/logs)?"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_exporter_sent_log_records_total{job="nktp-gateway-logs",exporter=~"otlp_grpc(/logs)?"}[5m])
                  unless otelcol_exporter_sent_log_records_total{job="nktp-gateway-logs",exporter=~"otlp_grpc(/logs)?"}
                )
                unless on() (
                  otelcol_exporter_sent_log_records_total{job="nktp-gateway-logs",exporter=~"otlp_grpc(/logs)?"}
                  unless present_over_time(otelcol_exporter_sent_log_records_total{job="nktp-gateway-logs",exporter=~"otlp_grpc(/logs)?"}[1m] offset 4m)
                )
          - name: traces_to_gateway
            check:
              action: complete
              for: 30m
              expr: |-
                vector(1)
                # Trace exports must match gateway acceptance.
                and on() (
                  sum(rate(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter="otlp_grpc/traces"}[5m])) > 0
                )
                and on() (
                  abs(
                    sum(rate(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter="otlp_grpc/traces"}[5m]))
                    - sum(rate(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}[5m]))
                  ) <= 0.01 * (
                    sum(rate(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter="otlp_grpc/traces"}[5m]))
                  )
                )
                # Each worker must export traces even if totals balance.
                unless on() (
                  label_replace(
                    group by (scale_node) (
                      k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}
                    ),
                    "k8s_node_name", "$1", "scale_node", "(.+)"
                  )
                  unless on(k8s_node_name) (
                    sum by (k8s_node_name) (
                      rate(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter="otlp_grpc/traces"}[5m])
                    ) > 0
                  )
                )
                # Traces acceptance counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"})) < 90
                )
                and on() (max(resets(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}[5m])) == 0)
                unless on() (
                  present_over_time(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}[5m])
                  unless otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}
                )
                unless on() (
                  otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}
                  unless present_over_time(otelcol_receiver_accepted_spans_total{job="nktp-gateway-traces",receiver="otlp"}[1m] offset 4m)
                )
                # Traces export counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"})) < 90
                )
                and on() (max(resets(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}[5m])) == 0)
                unless on() (
                  present_over_time(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}[5m])
                  unless otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}
                )
                unless on() (
                  otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}
                  unless present_over_time(otelcol_exporter_sent_spans_total{job="nktp-daemonset",exporter=~"otlp_grpc(/traces)?"}[1m] offset 4m)
                )
          - name: traces_to_blackhole
            check:
              action: complete
              for: 30m
              expr: |-
                vector(1)
                # Gateway exports must match blackhole acceptance.
                and on() (sum(rate(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter="otlp_grpc"}[5m])) > 0)
                and on() (
                  abs(
                    sum(rate(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter="otlp_grpc"}[5m]))
                    - sum(rate(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}[5m]))
                  ) <= 0.01 * (
                    sum(rate(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter="otlp_grpc"}[5m]))
                  )
                )
                # Traces acceptance counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"})) < 90
                )
                and on() (
                  max(resets(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}[5m])
                  unless otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}
                )
                unless on() (
                  otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}
                  unless present_over_time(otelcol_receiver_accepted_spans_total{job="nktp-mixed-workload-blackhole",receiver="otlp"}[1m] offset 4m)
                )
                # Traces export counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"})) < 90
                )
                and on() (
                  max(resets(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}[5m])
                  unless otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}
                )
                unless on() (
                  otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}
                  unless present_over_time(otelcol_exporter_sent_spans_total{job="nktp-gateway-traces",exporter=~"otlp_grpc(/traces)?"}[1m] offset 4m)
                )
          - name: event_producers
            check:
              action: complete
              for: 30m
              expr: |-
                vector(1)
                # Successful PATCH counters identify 100 producers on distinct workers
                # and supply the shared worker inventory for the signal checks.
                and on() (
                  count(group by (scale_node,producer_id) (k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"})) == 100
                )
                and on() (
                  count(group by (scale_node) (k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"})) == 100
                )
                unless on() (
                  k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}
                  unless on(scale_node,producer_id) (
                    rate(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m]) > 0
                  )
                )
                unless on() (
                  sum(last_over_time(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status!="200"}[115m])) > 0
                )
                unless on() (sum(last_over_time(k6_dropped_iterations_total{test_run_id="{{ .Args.runId }}"}[115m])) > 0)
                # Successful PATCH counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"})) < 90
                )
                and on() (
                  max(resets(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m])) == 0
                )
                unless on() (
                  present_over_time(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m])
                  unless k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}
                )
                unless on() (
                  k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}
                  unless present_over_time(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[1m] offset 4m)
                )
          - name: event_delivery
            check:
              action: complete
              for: 30m
              expr: |-
                vector(1)
                # Event receipt allows bounded measurement skew and background traffic.
                and on() (
                  sum(rate(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m]))
                  >= 0.99 * sum(rate(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m]))
                )
                and on() (
                  sum(rate(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m]))
                  <= 1.01 * sum(rate(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m])) + 10
                )
                # Event acceptance counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"})) < 90
                )
                and on() (
                  max(resets(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m])
                  unless otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}
                )
                unless on() (
                  otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}
                  unless present_over_time(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[1m] offset 4m)
                )
          # The fixed nodeless target has no run ID. Preserve its actual scraper pool.
          - name: fresh_targets
            units: targets
            query: >-
              count by (scale_node,scale_workload,scale_group,metric_bucket,nktp_metrics_pool) (
                up{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"} == 1 and (time() - timestamp(up{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
                or (up{scale_workload="mixed-workload-nodeless"} == 1 and (time() - timestamp(up{scale_workload="mixed-workload-nodeless"}) < 120))
              )
          - name: target_series
            units: series
            query: >-
              sum by (scale_node,scale_workload,scale_group,metric_bucket,nktp_metrics_pool) (
                scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
                or (scrape_samples_scraped{scale_workload="mixed-workload-nodeless"} and (time() - timestamp(scrape_samples_scraped{scale_workload="mixed-workload-nodeless"}) < 120))
              )
          - name: scrape_duration
            units: seconds
            query: >-
              scrape_duration_seconds{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
              or (scrape_duration_seconds{scale_workload="mixed-workload-nodeless"} and (time() - timestamp(scrape_duration_seconds{scale_workload="mixed-workload-nodeless"}) < 120))
          - name: producer_placement
            units: pods
            query: >-
              count by (node,label_scale_nktp_io_group,label_scale_nktp_io_bucket) (
                max by (namespace,pod,node) (kube_pod_info{namespace="nktp",node!=""})
                * on (namespace,pod) group_left(label_scale_nktp_io_group,label_scale_nktp_io_bucket)
                  max by (namespace,pod,label_scale_nktp_io_group,label_scale_nktp_io_bucket) (kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"})
              )
          - name: producer_ready
            units: bool
            query: >-
              kube_pod_container_status_ready{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_restarts
            units: restarts
            query: >-
              kube_pod_container_status_restarts_total{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_last_termination
            units: info
            query: >-
              kube_pod_container_status_last_terminated_reason{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_cpu
            units: cores
            query: >-
              rate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m])
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_memory
            units: bytes
            query: >-
              container_memory_working_set_bytes{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_throttling
            units: ratio
            query: >-
              (rate(container_cpu_cfs_throttled_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m])
               / rate(container_cpu_cfs_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m]))
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: stdout_records
            units: records/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
          # Subtract one newline per console record to count body bytes.
          - name: stdout_body_bytes
            units: bytes/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(vector_component_sent_bytes_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
              - sum by (scale_node,scale_bucket) (rate(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
          - name: stdout_emitters
            units: pods
            query: >-
              count by (scale_node,scale_bucket) (
                vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}) < 90)
              )
          - name: otlp_source_series
            units: series
            query: >-
              sum by (scale_node) (
                nktp_scale_otlp_source_series{test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(nktp_scale_otlp_source_series{test_run_id="{{ .Args.runId }}"}) < 90)
              )
          - name: otlp_sources_ready
            units: sources
            query: >-
              sum by (scale_node) (
                nktp_scale_otlp_source_up{test_run_id="{{ .Args.runId }}"} == 1
                and (time() - timestamp(nktp_scale_otlp_source_up{test_run_id="{{ .Args.runId }}"}) < 90)
              )
          # Cluster-wide diagnostic with background Events and no run ID.
          # Matching the PATCH rate does not prove receipt of this run's Events.
          - name: event_records_accepted
            units: records/s
            query: >-
              sum (
                rate(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m])
                and (time() - timestamp(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}) < 90)
              )
          - name: event_patches_succeeded
            units: requests/s
            query: >-
              sum by (scale_node) (
                rate(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}[5m])
                and (time() - timestamp(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}) < 90)
              )
          - name: event_producers_reporting
            units: producers
            query: >-
              count by (scale_node) (
                max by (scale_node,producer_id) (
                  k6_iterations_total{test_run_id="{{ .Args.runId }}"}
                  and (time() - timestamp(k6_iterations_total{test_run_id="{{ .Args.runId }}"}) < 90)
                )
              )
          # Keep sparse counts for the 115m plan ceiling even after a producer stops.
          # Only fresh producers without a recorded count get a zero fallback.
          - name: event_patches_failed
            units: requests
            query: >-
              sum by (scale_node) (
                sum by (scale_node,producer_id) (
                  last_over_time(k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status!="200"}[115m])
                )
                or
                0 * max by (scale_node,producer_id) (
                  k6_iterations_total{test_run_id="{{ .Args.runId }}"}
                  and (time() - timestamp(k6_iterations_total{test_run_id="{{ .Args.runId }}"}) < 90)
                )
              )
          - name: event_iterations_dropped
            units: iterations
            query: >-
              sum by (scale_node) (
                sum by (scale_node,producer_id) (
                  last_over_time(k6_dropped_iterations_total{test_run_id="{{ .Args.runId }}"}[115m])
                )
                or
                0 * max by (scale_node,producer_id) (
                  k6_iterations_total{test_run_id="{{ .Args.runId }}"}
                  and (time() - timestamp(k6_iterations_total{test_run_id="{{ .Args.runId }}"}) < 90)
                )
              )
          # Shared selectors preserve each component, Pod and container in result labels.
          - name: component_cpu
            units: cores
            query: >-
              rate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+|nktp-(nodeless-metrics-targetallocator|mixed-workload-nodeless)-.+",container=~"otc-container|otc-sidecar|ta-container|avalanche"}[5m])
          - name: component_cpu_short
            units: cores
            query: >-
              irate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+|nktp-(nodeless-metrics-targetallocator|mixed-workload-nodeless)-.+",container=~"otc-container|otc-sidecar|ta-container|avalanche"}[2m])
          - name: component_working_set
            units: bytes
            query: >-
              container_memory_working_set_bytes{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+|nktp-(nodeless-metrics-targetallocator|mixed-workload-nodeless)-.+",container=~"otc-container|otc-sidecar|ta-container|avalanche"}
          - name: component_throttling
            units: ratio
            query: >-
              rate(container_cpu_cfs_throttled_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+|nktp-(nodeless-metrics-targetallocator|mixed-workload-nodeless)-.+",container=~"otc-container|otc-sidecar|ta-container|avalanche"}[5m])
              / rate(container_cpu_cfs_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+|nktp-(nodeless-metrics-targetallocator|mixed-workload-nodeless)-.+",container=~"otc-container|otc-sidecar|ta-container|avalanche"}[5m])
          - name: component_heap
            units: bytes
            query: >-
              otelcol_process_runtime_heap_alloc_bytes{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: self_metric_age
            units: seconds
            query: >-
              time() - timestamp(otelcol_process_memory_rss_bytes{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"})
          - name: queue_size
            units: bytes
            query: >-
              otelcol_exporter_queue_size{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|nodeless-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: queue_capacity
