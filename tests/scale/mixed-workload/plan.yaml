    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 110m
        interval: 60s
        query_timeout: 60s
        measurements:
          # All delivery groups must qualify together while load is active.
          - name: metrics_to_gateway
            check:
              action: complete
              for: 30m
              expr: |-
                vector(1)
                # Both scrape pools must carry traffic.
                and on() (
                  sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_grpc"}[5m])) > 0
                )
                and on() (
                  sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-nodeless-metrics",exporter="otlp_grpc"}[5m])) > 0
                )
                # Metrics exports must match gateway acceptance.
                and on() (
                  (
                    sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-daemonset",exporter="otlp_grpc/metrics"}[5m]))
                    + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_grpc"}[5m]))
                    + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-nodeless-metrics",exporter="otlp_grpc"}[5m]))
                  ) > 0
                )
                and on() (
                  abs(
                    (
                      sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-daemonset",exporter="otlp_grpc/metrics"}[5m]))
                      + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_grpc"}[5m]))
                      + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-nodeless-metrics",exporter="otlp_grpc"}[5m]))
                    )
                    - sum(rate(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}[5m]))
                  ) <= 0.01 * (
                    sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-daemonset",exporter="otlp_grpc/metrics"}[5m]))
                    + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_grpc"}[5m]))
                    + sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-nodeless-metrics",exporter="otlp_grpc"}[5m]))
                  )
                )
                # Each worker must export metrics even if totals balance.
                unless on() (
                  label_replace(
                    group by (scale_node) (
                      k6_http_reqs_total{test_run_id="{{ .Args.runId }}",name="event-patch",method="PATCH",status="200"}
                    ),
                    "k8s_node_name", "$1", "scale_node", "(.+)"
                  )
                  unless on(k8s_node_name) (
                    sum by (k8s_node_name) (
                      rate(otelcol_exporter_sent_metric_points_total{job="nktp-daemonset",exporter="otlp_grpc/metrics"}[5m])
                    ) > 0
                  )
                )
                # Metrics acceptance counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"})) < 90
                )
                and on() (
                  max(resets(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}[5m])
                  unless otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}
                )
                unless on() (
                  otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}
                  unless present_over_time(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp"}[1m] offset 4m)
                )
                # Metrics export counters need a fresh, populated window without resets.
                and on() (
                  min(count_over_time(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}[5m])) >= 4
                )
                and on() (
                  max(time() - timestamp(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"})) < 90
                )
                and on() (
                  max(resets(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}[5m])) == 0
                )
                unless on() (
                  present_over_time(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}[5m])
                  unless otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}
                )
                unless on() (
                  otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}
                  unless present_over_time(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|large-target-metrics|nodeless-metrics)",exporter=~"otlp_grpc(/metrics)?"}[1m] offset 4m)
                )
          - name: metrics_to_blackhole
