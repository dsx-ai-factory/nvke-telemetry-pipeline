    - name: events
      type: pod
      spec:
        count: 100
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: mixed-workload-events
              scale.nktp.io/run-id: '{{ .Args.runId }}'
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 6600
            terminationGracePeriodSeconds: 150
            automountServiceAccountToken: false
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        scale.nktp.io/workload: mixed-workload-events
            initContainers:
              - name: ramp-up
                image: ghcr.io/vectordotdev/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
                command: [/bin/sh, -ec]
                args:
                  - |
                    ordinal=${POD_NAME##*-}
                    case "$((ordinal % 4))" in
                      0) delay=0 ;;
                      1) delay=300 ;;
                      *) delay=600 ;;
                    esac
                    exec sleep "$delay"
                env:
                  - name: POD_NAME
                    valueFrom: {fieldRef: {fieldPath: metadata.name}}
                resources:
                  requests: {cpu: 1m, memory: 4Mi}
                  limits: {cpu: 100m, memory: 16Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
            containers:
              - name: k6-events
                image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
                args: [run, --out, experimental-prometheus-rw, /etc/k6/events.js]
                env:
                  - {name: GOMEMLIMIT, value: 512MiB}
                  - {name: K6_NO_USAGE_REPORT, value: 'true'}
                  - {name: K6_PROMETHEUS_RW_SERVER_URL, value: 'http://lgtm:9090/api/v1/write'}
                  - {name: K6_PROMETHEUS_RW_TREND_STATS, value: 'p(95)'}
                  - {name: SSL_CERT_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
                  - name: POD_NAMESPACE
                    valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                  - name: POD_NAME
                    valueFrom: {fieldRef: {fieldPath: metadata.name}}
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                  - name: NODE_NAME
                    valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
                  - name: EVENT_RUN_ID
                    value: '{{ .Args.runId }}'
                resources:
                  requests: {cpu: 250m, memory: 512Mi}
                  limits: {cpu: '1', memory: 1Gi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65532
                  capabilities: {drop: [ALL]}
                volumeMounts:
                  - {name: events-config, mountPath: /etc/k6, readOnly: true}
                  - {name: api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            serviceAccountName: nktp-mixed-workload-events
            volumes:
              - name: events-config
                configMap: {name: nktp-mixed-workload-events}
              - name: api-access
                projected:
