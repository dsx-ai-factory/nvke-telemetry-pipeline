# Mixed workload on 100 real workers. See README.md.
# Install values.yaml first. Only runId is a plan argument.
name: mixed-workload
timeout: 115m
stages:
  - name: load
    generators:
    - name: small-scraped
      type: statefulset
      spec:
        count: 10
        replicas: 500
        duration: 90m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: mixed-workload
              scale.nktp.io/group: small-scraped
              scale.nktp.io/run-id: '{{ .Args.runId }}'
              scale.nktp.io/bucket: small
              scale.nktp.io/metric-source: scraped
              scale.nktp.io/stdout: 'true'
          spec:
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 100
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeAffinityPolicy: Honor
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    scale.nktp.io/workload: mixed-workload
                    scale.nktp.io/group: small-scraped
                    scale.nktp.io/run-id: '{{ .Args.runId }}'
            # Keep Parallel rollout. Reach 25%, 50% and 100% load at 0, 5 and 10 minutes.
            initContainers:
              - name: ramp-up
                image: ghcr.io/vectordotdev/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
                command: [/bin/sh, -ec]
                args:
                  - |
                    ordinal=${POD_NAME##*-}
                    case "$((ordinal % 4))" in
                      0) delay=0 ;;
                      1) delay=300 ;;
                      *) delay=600 ;;
                    esac
                    exec sleep "$delay"
                env:
                  - name: POD_NAME
                    valueFrom: {fieldRef: {fieldPath: metadata.name}}
                resources:
                  requests: {cpu: 1m, memory: 4Mi}
                  limits: {cpu: 100m, memory: 16Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
            containers:
              - name: avalanche
                image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
                command: [/bin/avalanche]
                args:
                  - --port=9001
                  - --gauge-metric-count=0
                  - --label-count=4
                  - --series-interval=0
                  - --metric-interval=0
                  - --value-interval=30
                  - --series-operation-mode=disabled
                  - --counter-metric-count=1
                  - --series-count=200
                  - --const-label=generator_instance=$(POD_UID)
                ports:
                  - {name: metrics, containerPort: 9001}
                readinessProbe:
                  tcpSocket: {port: metrics}
                  periodSeconds: 5
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
                env:
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: "metadata.uid"}}
              - name: vector-stdout-small
                image: ghcr.io/vectordotdev/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
                args: [--threads, '1', --config, /etc/vector/vector.yaml]
                ports:
                  - {name: vector-metrics, containerPort: 9598}
                readinessProbe:
                  tcpSocket: {port: vector-metrics}
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 128Mi}
                volumeMounts:
                  - {name: vector-config, mountPath: /etc/vector, readOnly: true}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
            volumes:
              - name: vector-config
                configMap: {name: nktp-mixed-workload-stdout-small}

    - name: small-instrumented
      type: statefulset
      spec:
        count: 10
        replicas: 400
        duration: 90m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: mixed-workload
              scale.nktp.io/group: small-instrumented
              scale.nktp.io/run-id: '{{ .Args.runId }}'
              scale.nktp.io/bucket: small
              scale.nktp.io/metric-source: otlp
              scale.nktp.io/stdout: 'true'
          spec:
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 100
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
