                unless on() (
                  present_over_time(otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics",exporter=~"otlp_grpc(/metrics)?"}[5m])
                  unless otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics",exporter=~"otlp_grpc(/metrics)?"}
                )
                unless on() (
                  otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics",exporter=~"otlp_grpc(/metrics)?"}
                  unless present_over_time(otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics",exporter=~"otlp_grpc(/metrics)?"}[1m] offset 4m)
                )
          - name: logs_to_gateway
            check:
