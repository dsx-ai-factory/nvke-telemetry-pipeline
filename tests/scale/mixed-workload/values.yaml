# Mixed metrics, logs, spans, Events and large-target workload.
# NKTP uses default resources and autoscaling, including self-telemetry sidecars.
# Adapt placement and API access settings to the cluster. Install this profile alone.

watchdog:
  kubernetes:
    nodeSelector: &systemSelector {nodeGroup: system-cpu}
    tolerations: &systemTolerations
      - {key: dedicated, operator: Equal, value: system-workload}
    targetAllocator: &allocatorPlacement
      nodeSelector: *systemSelector
      tolerations: *systemTolerations

# Node collectors use native pipelines and detailed self-telemetry.
daemonset:
  kubernetes:
    targetAllocator: *allocatorPlacement
  otelcol:
    config:
      service:
        telemetry: &loadTelemetry
          metrics:
            level: detailed

# Gateways discard load through blackhole while observations continue to LGTM.
gateway_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      service:
        telemetry: *loadTelemetry
      exporters:
        otlp_grpc:
          endpoint: nktp-mixed-workload-blackhole-collector:4317

gateway_logs:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      service:
        telemetry: *loadTelemetry
      exporters:
        otlp_grpc:
          endpoint: nktp-mixed-workload-blackhole-collector:4317

gateway_traces:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      service:
        telemetry: *loadTelemetry
      exporters:
        otlp_grpc:
          endpoint: nktp-mixed-workload-blackhole-collector:4317

large_target_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
    targetAllocator: *allocatorPlacement
  otelcol:
    config:
      service:
        telemetry: *loadTelemetry

cluster_events:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      service:
        telemetry: *loadTelemetry

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[scale.nktp.io/run-id,scale.nktp.io/group,scale.nktp.io/bucket]
  deployments:
    unscheduled-pods:
      kubernetes: &systemPlacement
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
    workloads:
      kubernetes: *systemPlacement
    networking:
      kubernetes: *systemPlacement
    storage:
      kubernetes: *systemPlacement
    configuration:
      kubernetes: *systemPlacement
    cluster:
      kubernetes: *systemPlacement

# Bundled backend retains the experiment budget, delta counters and NKTP dashboards.
otel-lgtm:
  enabled: true
  resources:
    requests: {cpu: '8', memory: 16Gi}
    limits: {cpu: '16', memory: 64Gi}
  nodeSelector: *systemSelector
  tolerations: *systemTolerations

opentelemetry-kube-stack:
  opentelemetry-operator:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  extraObjects:
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: nktp-mixed-workload-load
        namespace: '{{ .Release.Namespace }}'
      spec:
        selector:
          matchLabels:
            scale.nktp.io/workload: mixed-workload
            scale.nktp.io/metric-source: scraped
        podMetricsEndpoints:
          - port: metrics
            scrapeTimeout: 10s
            relabelings:
              - targetLabel: scale_workload
                replacement: mixed-workload
              - targetLabel: scale_scraper_pool
                replacement: node
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_run_id]
                targetLabel: test_run_id
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: scale_node
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_group]
                targetLabel: scale_group
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: instance
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-mixed-workload-payloads
        namespace: '{{ .Release.Namespace }}'
      data:
        spans-small: '{{ repeat 1024 "x" }}'
        # 655,360 B/s/node / (40 emitters × 1,024 B/span) = 16 spans/s per emitter.
        spans-small-rate: '16'
        spans-large: '{{ repeat 65536 "x" }}'
        # 524,288 B/s/node / (2 emitters × 65,536 B/span) = 4 spans/s per emitter.
        spans-large-rate: '4'
    - apiVersion: v1
      kind: Service
      metadata:
        name: nktp-mixed-workload-local
        namespace: '{{ .Release.Namespace }}'
      spec:
        internalTrafficPolicy: Local
        selector:
          app.kubernetes.io/name: nktp-daemonset-collector
        ports:
          - {name: otlp-grpc, port: 4317, targetPort: 4317}
    # Keep performance observations while discarding generated telemetry.
    - apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: nktp-mixed-workload-blackhole
        namespace: '{{ .Release.Namespace }}'
        labels:
          helm.sh/chart: '{{ include "opentelemetry-kube-stack.chart" . }}'
      spec:
        image: otel/opentelemetry-collector-k8s:0.159.0
        mode: deployment
        replicas: 8
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: '{{ .Release.Namespace }}.nktp-mixed-workload-blackhole'
        resources:
          requests: {cpu: '8', memory: 8Gi}
          limits: {cpu: '16', memory: 16Gi}
        env:
          - name: GOMEMLIMIT
            value: 13107MiB
          - name: GOGC
            value: '50'
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: "metadata.name"}}
        config:
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
          processors:
            memory_limiter:
              check_interval: 500ms
              limit_percentage: 80
              spike_limit_percentage: 25
          exporters:
            nop: {}
            otlp_grpc/observations:
              endpoint: lgtm:4317
              tls:
                insecure: true
              retry_on_failure:
                max_elapsed_time: 30m
              sending_queue:
                sizer: bytes
                queue_size: 67108864
                num_consumers: 8
                block_on_overflow: true
                batch:
                  sizer: bytes
                  min_size: 1048576
                  max_size: 2097152
                  flush_timeout: 1s
          connectors:
            routing/observations:
              error_mode: propagate
              default_pipelines:
                - metrics/blackhole
              table:
                - context: metric
                  condition: >-
                    IsMatch(metric.name, "^(nktp_scale_.+|vector_component_sent_(events|bytes)_total|up)$") or
                    IsMatch(metric.name, "^scrape_(duration_seconds|samples_scraped|samples_post_metric_relabeling)$") or
                    IsMatch(metric.name, "^container_(cpu_usage_seconds_total|cpu_cfs_(periods|throttled_periods)_total|memory_(working_set|usage)_bytes)$") or
                    IsMatch(metric.name, "^kube_pod_(info|labels|status_(phase|ready)|container_(status_(ready|running|restarts_total|last_terminated_reason)|resource_(requests|limits))|init_container_status_.+)$") or
                    IsMatch(metric.name, "^(kube_node_(info|status_condition|status_allocatable)|kube_horizontalpodautoscaler_.+|node_memory_MemAvailable_bytes)$")
                  action: move
                  pipelines:
                    - metrics/observations
          service:
            extensions: [health_check]
            telemetry:
              resource:
                service.name: nktp-mixed-workload-blackhole
                service.instance.id: ${env:POD_NAME}
              metrics:
                readers:
                  - periodic:
                      exporter:
                        otlp:
                          protocol: grpc
                          endpoint: http://lgtm:4317
            pipelines:
              metrics:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [routing/observations]
              metrics/blackhole:
                receivers: [routing/observations]
                exporters: [nop]
              metrics/observations:
                receivers: [routing/observations]
                exporters: [otlp_grpc/observations]
              logs:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [nop]
              traces:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [nop]
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: nktp-mixed-workload-large
        namespace: '{{ .Release.Namespace }}'
        labels:
          nktp.nvidia.io/large-target: 'true'
      spec:
        selector:
          matchLabels:
            scale.nktp.io/workload: mixed-workload-large
        podMetricsEndpoints:
          - port: large-metrics
            interval: 60s
            scrapeTimeout: 55s
            relabelings:
              - targetLabel: scale_workload
                replacement: mixed-workload-large
              - targetLabel: scale_scraper_pool
                replacement: large
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_run_id]
                targetLabel: test_run_id
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: scale_node
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_metric_bucket]
                targetLabel: metric_bucket
              - sourceLabels: [__meta_kubernetes_pod_name, __meta_kubernetes_pod_container_port_number]
                separator: ':'
                targetLabel: instance
    # Bounded Kubernetes Events generated by k6.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: nktp-mixed-workload-events
        namespace: '{{ .Release.Namespace }}'
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: nktp-mixed-workload-events
        namespace: '{{ .Release.Namespace }}'
      rules:
        - apiGroups:
            - ''
          resources:
            - events
          verbs: [create, patch, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: nktp-mixed-workload-events
        namespace: '{{ .Release.Namespace }}'
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: nktp-mixed-workload-events
      subjects:
        - kind: ServiceAccount
          name: nktp-mixed-workload-events
          namespace: '{{ .Release.Namespace }}'
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-mixed-workload-events
        namespace: '{{ .Release.Namespace }}'
      data:
        events.js: |
          import http from 'k6/http';
          import exec from 'k6/execution';
          import { sleep } from 'k6';

          const count = 100; // 100 Events × 100 producers = 10,000 retained objects.
          const api = 'https://kubernetes.default.svc/api/v1/namespaces/' + __ENV.POD_NAMESPACE + '/events';
          const token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').trim();
          const owner = { apiVersion: 'v1', kind: 'Pod', name: __ENV.POD_NAME, uid: __ENV.POD_UID };

          export const options = {
            scenarios: {
              events: {
                executor: 'constant-arrival-rate',
                rate: 10, timeUnit: '1s', // 1,000 updates/s / 100 producers = 10 PATCHes/s.
                duration: '90m', // Leaves time to select a shared 30-minute full-load window.
                preAllocatedVUs: 64, maxVUs: 64, // 10/s × 5s timeout needs at most 50 active requests.
                gracefulStop: '10s',
              },
            },
            setupTimeout: '2m', teardownTimeout: '2m',
            batch: 10, batchPerHost: 10,
            systemTags: ['method', 'status', 'name'],
            tags: { test_run_id: __ENV.EVENT_RUN_ID, scale_node: __ENV.NODE_NAME, producer_id: __ENV.POD_UID },
            thresholds: {
              http_req_failed: ['rate==0'],
              dropped_iterations: ['count==0'],
            },
          };

          function name(i) { return 'nktp-event-' + __ENV.POD_UID + '-' + i; }
          function params(operation, statuses) {
            return {
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': operation === 'patch' ? 'application/merge-patch+json' : 'application/json' },
              timeout: '5s', tags: { name: 'event-' + operation },
              responseType: operation === 'create' ? 'text' : 'none',
              responseCallback: http.expectedStatuses(...statuses),
            };
          }

          const patchParams = params('patch', [200]);

          export function setup() {
            const created = [];
            try {
              for (let i = 0; i < count; i++) {
                const timestamp = new Date().toISOString();
                const event = {
                  apiVersion: 'v1', kind: 'Event',
                  metadata: {
                    name: name(i), namespace: __ENV.POD_NAMESPACE, ownerReferences: [owner],
                    labels: { 'scale.nktp.io/workload': 'mixed-workload-events', 'scale.nktp.io/run-id': __ENV.EVENT_RUN_ID, 'scale.nktp.io/producer-id': __ENV.POD_UID },
                  },
                  involvedObject: { ...owner, namespace: __ENV.POD_NAMESPACE },
                  reason: 'NKTPScaleTest', type: 'Normal', action: 'Scale',
                  reportingComponent: 'nktp.nvidia.io/scale-test', reportingInstance: __ENV.EVENT_RUN_ID,
                  message: 'x'.repeat(1024), source: { component: 'k6', host: __ENV.NODE_NAME },
                  firstTimestamp: timestamp, lastTimestamp: timestamp, count: 1,
                };
                const response = http.post(api, JSON.stringify(event), params('create', [201]));
                if (response.status !== 201) throw new Error('Event seed failed: HTTP ' + response.status);
                created.push({ name: name(i), uid: response.json('metadata.uid') });
                sleep(0.1); // Seed at no more than 10 creates/s per producer.
              }
            } catch (error) {
              teardown(created); // k6 does not invoke teardown after a failed setup.
              throw error;
            }
            return created;
          }

          export default function () {
            const iteration = exec.scenario.iterationInTest;
            // Cycle through 100 names, touching each once per 10s and advancing its count.
            const patch = { count: Math.floor(iteration / count) + 2, lastTimestamp: new Date().toISOString() };
            http.patch(api + '/' + name(iteration % count), JSON.stringify(patch), patchParams)
          }

          export function teardown(created) {
            const requests = created.map(event => {
              const body = JSON.stringify({ apiVersion: 'v1', kind: 'DeleteOptions', preconditions: { uid: event.uid } });
              return ['DELETE', api + '/' + event.name, body, params('delete', [200, 202, 404])];
            });
            const failed = http.batch(requests).filter(r => ![200, 202, 404].includes(r.status)).length;
            if (failed) throw new Error(failed + ' Event deletes failed, Pod ownership provides GC fallback');
          }
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-mixed-workload-stdout-small
        namespace: '{{ .Release.Namespace }}'
      data:
        vector.yaml: |
          sources:
            load:
              type: demo_logs
              format: shuffle
              sequence: false
              # 144,000 B/s/node / (90 emitters × 100 B/record) = 16 records/s, interval = 1/16 s.
              interval: 0.0625
              lines: ['{{ repeat 100 "x" }}']
            self:
              type: internal_metrics
              scrape_interval_secs: 15
          transforms:
            measured:
              type: filter
              inputs: [self]
              condition: >-
                .tags.component_id == "stdout_load" &&
                includes(["component_sent_events_total", "component_sent_bytes_total"], .name)
          sinks:
            stdout_load:
              type: console
              inputs: [load]
              target: stdout
              encoding: {codec: text}
            metrics:
              type: prometheus_exporter
              inputs: [measured]
              address: 0.0.0.0:9598
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-mixed-workload-stdout-large
        namespace: '{{ .Release.Namespace }}'
      data:
        vector.yaml: |
          sources:
            load:
              type: demo_logs
              format: shuffle
              sequence: false
              # 1,048,576 B/s/node / (4 emitters × 65,536 B/record) = 4 records/s, interval = 1/4 s.
              interval: 0.25
              lines: ['{{ repeat 65536 "x" }}']
            self:
              type: internal_metrics
              scrape_interval_secs: 15
          transforms:
            measured:
              type: filter
              inputs: [self]
              condition: >-
                .tags.component_id == "stdout_load" &&
                includes(["component_sent_events_total", "component_sent_bytes_total"], .name)
          sinks:
            stdout_load:
              type: console
              inputs: [load]
              target: stdout
              encoding: {codec: text}
            metrics:
              type: prometheus_exporter
              inputs: [measured]
              address: 0.0.0.0:9598
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: nktp-mixed-workload-stdout
        namespace: '{{ .Release.Namespace }}'
      spec:
        selector:
          matchLabels:
            scale.nktp.io/workload: mixed-workload
            scale.nktp.io/stdout: 'true'
        podMetricsEndpoints:
          - port: vector-metrics
            interval: 30s
            scrapeTimeout: 10s
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: instance
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: scale_node
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_run_id]
                targetLabel: test_run_id
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_bucket]
                targetLabel: scale_bucket
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-mixed-workload-otlp-metrics
        namespace: '{{ .Release.Namespace }}'
      data:
        collector.yaml: |
          # OTLP export cadence is independent of the node Target Allocator scrape interval.
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          receivers:
            prometheus:
              config:
                scrape_configs:
                  - job_name: mixed-workload-instrumented
                    scrape_interval: 30s
                    scrape_timeout: 10s
                    static_configs:
                      - targets:
                          - 127.0.0.1:9001
                        labels:
                          test_run_id: ${env:RUN_ID}
                          scale_node: ${env:NODE_NAME}
                          source_pod: ${env:POD_NAME}
          processors:
            filter/load:
              error_mode: propagate
              metrics:
                metric:
                  - name == "up" or IsMatch(name, "^scrape_")
            filter/observations:
              error_mode: propagate
              metrics:
                metric:
                  - name != "up" and name != "scrape_samples_scraped"
            transform/observations:
              error_mode: propagate
              metric_statements:
                - context: metric
                  statements:
                    - set(name, "nktp_scale_otlp_source_up") where name == "up"
                    - set(name, "nktp_scale_otlp_source_series") where name == "scrape_samples_scraped"
            resource/source:
              attributes:
                - key: service.instance.id
                  value: ${env:POD_UID}
                  action: upsert
          exporters:
            otlp_grpc:
              endpoint: nktp-mixed-workload-local.nktp.svc:4317
              tls:
                insecure: true
              retry_on_failure:
                max_elapsed_time: 30s
              sending_queue:
                enabled: false
            otlp_grpc/observations:
              endpoint: lgtm:4317
              tls:
                insecure: true
              sending_queue:
                enabled: false
          service:
            extensions: [health_check]
            telemetry:
              resource:
                service.name: nktp-mixed-workload-metrics-adapter
                service.instance.id: ${env:POD_NAME}
              metrics:
                level: basic
                readers:
                  - periodic:
                      exporter:
                        otlp:
                          protocol: grpc
                          endpoint: http://lgtm:4317
              traces: {level: none}
            pipelines:
              metrics/load:
                receivers: [prometheus]
                processors: [filter/load, resource/source]
                exporters: [otlp_grpc]
              metrics/observations:
                receivers: [prometheus]
                processors: [filter/observations, transform/observations, resource/source]
                exporters: [otlp_grpc/observations]
