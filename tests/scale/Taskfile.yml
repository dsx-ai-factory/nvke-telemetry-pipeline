version: '3'

tasks:
  test:
    desc: Run a scale test plan against the selected environment
    dir: '{{.ROOT_DIR}}/tests'
    vars: &environment
      KUBECONFIG_PATH: &kubeconfig_path '{{if .KUBECONFIG}}{{if isAbs .KUBECONFIG}}{{clean .KUBECONFIG}}{{else}}{{joinPath .ROOT_DIR .KUBECONFIG}}{{end}}{{end}}'
      CONTEXT: &context
        sh: |
          if test -f {{.KUBECONFIG_PATH | shellQuote}} && test -r {{.KUBECONFIG_PATH | shellQuote}}; then
            kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} config current-context
          fi
      TEST_TIMEOUT: '{{.TEST_TIMEOUT | default "12m"}}'
    requires: &kubeconfig_required
      vars: [KUBECONFIG]
    preconditions: &selected_cluster
      - &kubeconfig_file
        sh: test -f {{.KUBECONFIG_PATH | shellQuote}} && test -r {{.KUBECONFIG_PATH | shellQuote}}
        msg: 'KUBECONFIG must name one readable kubeconfig file.'
      - &current_context
        sh: test -n {{.CONTEXT | shellQuote}}
        msg: 'The kubeconfig must select a current context.'
    cmds:
      - go test -tags scale -count=1 -v -timeout={{.TEST_TIMEOUT | shellQuote}} -run '^TestRun$' ./scale -args -kubeconfig {{.KUBECONFIG_PATH | shellQuote}} {{.CLI_ARGS}}

  outage:
    desc: Simulate a backend outage to tune the gateway sending queue
    dir: '{{.ROOT_DIR}}/tests'
    vars: *environment
    requires: *kubeconfig_required
    preconditions: *selected_cluster
    cmds:
      - go test -tags scale -count=1 -v -timeout={{.TEST_TIMEOUT | shellQuote}} -run '^TestBackendOutage$' ./scale/backend-outage -args -kubeconfig {{.KUBECONFIG_PATH | shellQuote}} {{.CLI_ARGS}}

  install:
    dir: '{{.ROOT_DIR}}'
    desc: Install NKTP and the load-test environment in the selected cluster
    silent: true
    vars: *environment
    requires: *kubeconfig_required
    preconditions:
      - *kubeconfig_file
      - *current_context
      - sh: test {{.INSTALL_KWOK | default "false" | shellQuote}} = true || test {{.INSTALL_KWOK | default "false" | shellQuote}} = false
        msg: 'INSTALL_KWOK must be true or false.'
      - sh: '{{if .HELM_VALUES_FILE}}test -f {{.HELM_VALUES_FILE | shellQuote}}{{else}}true{{end}}'
        msg: 'HELM_VALUES_FILE must name an existing values file.'
    cmds:
      - task: environment:check
        vars: &target
          KUBECONFIG_PATH: '{{.KUBECONFIG_PATH}}'
          CONTEXT: '{{.CONTEXT}}'
      - task: chart:deps
      - task: cert-manager:install
        vars: *target
      - task: kwok:install
        vars: *target
      - task: :install
        vars:
          KUBECONFIG_FILE: '{{.KUBECONFIG_PATH}}'
          KUBE_CONTEXT: '{{.CONTEXT}}'
          HELM_VALUES_DIR: '{{.ROOT_DIR}}'
      - task: environment:wait
        vars: *target
      - task: forward:up
        vars: *target

  uninstall:
    dir: '{{.ROOT_DIR}}'
    desc: Uninstall NKTP and optionally KWOK from the selected cluster
    silent: true
    vars: *environment
    requires: *kubeconfig_required
    preconditions:
      - *kubeconfig_file
      - *current_context
      - sh: test {{.INSTALL_KWOK | default "false" | shellQuote}} = true || test {{.INSTALL_KWOK | default "false" | shellQuote}} = false
        msg: 'INSTALL_KWOK must be true or false.'
    cmds:
      - task: forward:down
        vars: *target
      - |
        for entry in nktp/nktp {{if ne (.INSTALL_KWOK | default "false") "false"}}kube-system/kwok-stage-fast kube-system/kwok{{end}}; do
          namespace=${entry%/*}
          release=${entry#*/}
          if test "$release" = kwok-stage-fast; then
            stage_crd=$(kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} get crd stages.kwok.x-k8s.io --ignore-not-found -o name) || exit $?
            if test -n "$stage_crd"; then
              kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} delete stages.kwok.x-k8s.io nktp-pod-complete-30s --ignore-not-found || exit $?
            fi
          fi
          helm uninstall "$release" --namespace "$namespace" --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --kube-context {{.CONTEXT | shellQuote}} --ignore-not-found --wait --timeout 5m || exit $?
        done

  environment:check:
    internal: true
    silent: true
    cmds:
      - |
        for tool in kubectl helm; do
          command -v "$tool" >/dev/null || { echo "missing: $tool" >&2; exit 1; }
        done
        printf 'Installing in context %s\n' {{.CONTEXT | shellQuote}}
        kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} --request-timeout=10s get nodes || exit $?

  cert-manager:install:
    internal: true
    silent: true
    preconditions:
      - sh: '{{if .CERT_MANAGER_VALUES_FILE}}test -f {{.CERT_MANAGER_VALUES_FILE | shellQuote}}{{else}}true{{end}}'
        msg: 'CERT_MANAGER_VALUES_FILE must name an existing values file.'
    cmds:
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - >-
        helm upgrade --install cert-manager jetstack/cert-manager
        --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --kube-context {{.CONTEXT | shellQuote}}
        --namespace cert-manager --create-namespace --version {{.CERT_MANAGER_VERSION | shellQuote}}
        --set crds.enabled=true
        {{if .CERT_MANAGER_VALUES_FILE}}--values {{.CERT_MANAGER_VALUES_FILE | shellQuote}}{{end}}
        --wait --timeout 5m

  kwok:install:
    internal: true
    silent: true
    status:
      - test {{.INSTALL_KWOK | default "false" | shellQuote}} = false
    vars:
      HELM_STAGE_APPLY_FLAGS:
        sh: |
          case "$(helm version --short)" in
            v4.*) echo --server-side=false ;;
          esac
    cmds:
      - >-
        helm upgrade --install kwok https://github.com/kubernetes-sigs/kwok/releases/download/v0.8.0/kwok-chart-0.3.0.tgz --reset-values
        --namespace kube-system --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --kube-context {{.CONTEXT | shellQuote}}
        --wait --timeout 5m
      - >-
        helm upgrade --install kwok-stage-fast https://github.com/kubernetes-sigs/kwok/releases/download/v0.8.0/kwok-stage-fast-chart-0.3.0.tgz {{.HELM_STAGE_APPLY_FLAGS}} --reset-values
        --namespace kube-system --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --kube-context {{.CONTEXT | shellQuote}}
        --wait --timeout 5m
      - kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} patch stage pod-complete --type=merge --patch-file {{.ROOT_DIR | shellQuote}}/tests/scale/environment/kwok/stages/pod-complete-selector-patch.yaml
      - kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} apply -f {{.ROOT_DIR | shellQuote}}/tests/scale/environment/kwok/stages/pod-complete-30s.yaml

  environment:wait:
    internal: true
    silent: true
    cmds:
      - |
        set -o pipefail
        kubectl_environment() {
          kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} --namespace nktp "$@"
        }
        # Helm waits for its workloads. Also wait for workloads created by the Operator.
        # Read the release manifests locally; they contain resources in multiple namespaces.
        collectors=$(helm get manifest nktp --namespace nktp --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --kube-context {{.CONTEXT | shellQuote}} |
          kubectl --kubeconfig {{.KUBECONFIG_PATH | shellQuote}} --context {{.CONTEXT | shellQuote}} create --dry-run=client --validate=false -f - -o go-template='{{`{{if eq .kind "OpenTelemetryCollector"}}{{.metadata.name}} {{.spec.mode}} {{if .spec.targetAllocator}}{{.spec.targetAllocator.enabled}}{{end}}{{"\n"}}{{end}}`}}') || exit $?
        test -n "$collectors" || { echo "No NKTP collectors found in the release." >&2; exit 1; }
        while read -r name mode allocator; do
          case "$mode" in
            deployment|statefulset|daemonset)
              kubectl_environment wait --for=create "$mode/$name-collector" --timeout=20m || exit $?
              kubectl_environment rollout status "$mode/$name-collector" --timeout=20m || exit $?
              ;;
            sidecar) ;;
            *) echo "Unsupported collector mode: $mode" >&2; exit 1 ;;
          esac
          if test "$allocator" = true; then
            kubectl_environment wait --for=create "deployment/$name-targetallocator" --timeout=20m || exit $?
            kubectl_environment rollout status "deployment/$name-targetallocator" --timeout=20m || exit $?
          fi
        done <<EOF_COLLECTORS
        $collectors
        EOF_COLLECTORS

  forward:up:
    desc: Forward Prometheus and Grafana from the selected cluster
    silent: true
    requires: *kubeconfig_required
    preconditions: *selected_cluster
    vars: &forward_state
      KUBECONFIG_PATH: *kubeconfig_path
      CONTEXT: *context
      FORWARD_STATE: '{{env "TMPDIR" | default "/tmp"}}/nktp-scale-{{printf "%s\n%s\n%s" .ROOT_DIR .KUBECONFIG_PATH .CONTEXT | sha256sum}}'
    cmds:
      - task: forward:down
        vars: *target
      - |
        sh -c 'umask 077
        nohup kubectl --kubeconfig "$1" --context "$2" --namespace nktp port-forward --address 127.0.0.1 service/lgtm 9090:9090 3000:3000 > "$3.log" 2>&1 < /dev/null & echo $! > "$3.pid"' sh {{.KUBECONFIG_PATH | shellQuote}} {{.CONTEXT | shellQuote}} {{.FORWARD_STATE | shellQuote}}
        pid=$(cat {{.FORWARD_STATE | shellQuote}}.pid)
        for attempt in $(seq 1 100); do
          if ! /bin/kill -0 "$pid" 2>/dev/null; then
            break
          fi
          if grep -q 'Forwarding from 127.0.0.1:9090' {{.FORWARD_STATE | shellQuote}}.log && grep -q 'Forwarding from 127.0.0.1:3000' {{.FORWARD_STATE | shellQuote}}.log; then
            echo "Prometheus: http://127.0.0.1:9090"
            echo "Grafana: http://127.0.0.1:3000"
            exit 0
          fi
          sleep 0.1
        done
        /bin/kill "$pid" 2>/dev/null || true
        rm -f {{.FORWARD_STATE | shellQuote}}.pid
        cat {{.FORWARD_STATE | shellQuote}}.log >&2
        echo "Port-forward failed. Keep ports 9090 and 3000 free and retry task scale:forward:up." >&2
        exit 1

  forward:down:
    desc: Stop Prometheus and Grafana forwarding for the selected cluster
    silent: true
    requires: *kubeconfig_required
    preconditions: *selected_cluster
    vars: *forward_state
    cmds:
      - |
        if test -f {{.FORWARD_STATE | shellQuote}}.pid; then
          pid=$(cat {{.FORWARD_STATE | shellQuote}}.pid)
          case "$pid" in
            ''|*[!0-9]*) echo "Invalid port-forward PID." >&2; exit 1 ;;
          esac
          command=$(ps -ww -p "$pid" -o command= 2>/dev/null || true)
          case "$command" in
            *"kubectl --kubeconfig "{{.KUBECONFIG_PATH | shellQuote}}" --context "{{.CONTEXT | shellQuote}}" --namespace nktp port-forward --address 127.0.0.1 service/lgtm 9090:9090 3000:3000")
              /bin/kill "$pid" 2>/dev/null || true
              for attempt in $(seq 1 50); do
                if ! /bin/kill -0 "$pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if /bin/kill -0 "$pid" 2>/dev/null; then
                echo "Port-forward did not stop. Retry cleanup." >&2
                exit 1
              fi
              ;;
            '') ;;
            *) echo "Port-forward PID belongs to another process. Refusing to stop it." >&2; exit 1 ;;
          esac
        fi
        rm -f {{.FORWARD_STATE | shellQuote}}.pid {{.FORWARD_STATE | shellQuote}}.log

  chart:deps:
    internal: true
    silent: true
    cmds:
      - |
        dependencies_ready() {
          dependencies=$(helm dependency list {{.ROOT_DIR | shellQuote}}/nktp --max-col-width 0) || exit $?
          # Helm can report missing or wrong versions with exit code zero.
          printf '%s\n' "$dependencies" | awk -F '\t' '
            /^[[:space:]]*$/ { next }
            { for (i = 1; i <= NF; i++) gsub(/^[[:space:]]+|[[:space:]]+$/, "", $i) }
            NR == 1 && NF == 4 && $1 == "NAME" && $2 == "VERSION" && $3 == "REPOSITORY" && $4 == "STATUS" { header = 1; next }
            !header || NF != 4 || $1 == "" || $2 == "" || $4 == "" { malformed = 1; next }
            { rows++; if ($4 != "ok" && $4 != "unpacked") unhealthy = 1 }
            END { if (malformed || !rows) exit 2; exit unhealthy }
          '
        }
        dependency_status=0
        dependencies_ready || dependency_status=$?
        case "$dependency_status" in
          0) exit 0 ;;
          1) ;;
          *) echo "Unexpected Helm dependency list output." >&2; exit "$dependency_status" ;;
        esac
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update || exit $?
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update || exit $?
        helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update || exit $?
        helm dependency build {{.ROOT_DIR | shellQuote}}/nktp --skip-refresh || exit $?
        dependencies_ready || { echo "Chart dependencies are not ready after building." >&2; exit 1; }
