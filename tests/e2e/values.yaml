# Kind host paths and sizing, applied to every run before any
# -values file given on the command line.
#
# Lower replica counts, autoscaler floors and resource requests keep the small
# e2e workload schedulable on a hosted Kind runner. Collection behavior and
# resource limits retain the chart defaults.
#
# Two workloads keep their replica counts, because there the count is behavior:
# cluster_events runs an elected reader and a standby, and large_target_metrics
# is a shard pool the Target Allocator distributes targets across. Only their
# requests come down.

# The image suppresses backend process logs by default. Keep Loki and its
# internal collector's errors available in pod logs to diagnose failed ingest.
otel-lgtm:
  env:
    - name: ENABLE_LOGS_LOKI
      value: "true"
    - name: ENABLE_LOGS_OTELCOL
      value: "true"
    # The hosted runner's shared filesystem exceeds Loki's default 90% usage
    # threshold even with little WAL data. Disable that guard for this
    # disposable backend so it can ingest logs while disk space remains.
    - name: LOKI_EXTRA_ARGS
      value: "-ingester.wal-disk-full-threshold=0"

watchdog:
  kubernetes:
    targetAllocator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_logs:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_metrics:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_traces:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

daemonset:
  kubernetes:
    targetAllocator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
    # Kind stores its journal in /run. Helm replaces volume lists in full.
    volumes:
      - name: pod-logs
        hostPath: {path: /var/log/pods, type: Directory}
      - name: host-proc
        hostPath: {path: /proc, type: Directory}
      - name: journalctl
        hostPath: {path: /usr/bin/journalctl, type: File}
      - name: host-lib
        hostPath: {path: /lib, type: Directory}
      - name: host-lib64
        hostPath: {path: /lib64, type: DirectoryOrCreate}
      - name: host-usr-lib
        hostPath: {path: /usr/lib, type: Directory}
      - name: host-machine-id
        hostPath: {path: /etc/machine-id, type: File}
      - name: journal-persistent
        hostPath: {path: /run/log/journal, type: Directory}
      - name: host-logs
        hostPath: {path: /var/log, type: Directory}
      - name: internal-tls-client
        secret:
          secretName: nktp-daemonset-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
    volumeMounts:
      - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      - {name: host-proc, mountPath: /hostfs/proc, readOnly: true}
      - {name: journalctl, mountPath: /hostfs/usr/bin/journalctl, readOnly: true}
      - {name: host-lib, mountPath: /hostfs/lib, readOnly: true}
      - {name: host-lib64, mountPath: /hostfs/lib64, readOnly: true}
      - {name: host-lib64, mountPath: /hostfs/usr/lib64, readOnly: true}
      - {name: host-usr-lib, mountPath: /hostfs/usr/lib, readOnly: true}
      - {name: host-machine-id, mountPath: /hostfs/etc/machine-id, readOnly: true}
      - {name: journal-persistent, mountPath: /hostfs/run/log/journal, readOnly: true}
      - {name: host-logs, mountPath: /hostfs/var/log, readOnly: true}
      - {name: internal-tls-client, mountPath: /etc/nktp/internal-tls/client, readOnly: true}
  otelcol:
    config:
      receivers:
        journald:
          directory: /run/log/journal

cluster_events:
  kubernetes:
    resources:
      requests:
        cpu: 50m

# Keep two scrapers to exercise target distribution within the pool.
large_target_metrics:
  kubernetes:
    targetAllocator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi

# Large target metrics covers distribution across a pool. One scraper is
# enough to show that a labeled Probe reaches this pool and no other.
nodeless_metrics:
  kubernetes:
    replicas: 1
    targetAllocator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
    resources:
      requests:
        cpu: 10m
        memory: 128Mi

# The nodeless metrics test probes through it.
blackbox-exporter:
  enabled: true
  replicas: 1

# Seven partitions share this default, so at 100m each they ask for more CPU
# than the rest of the chart put together. Each one watches a handful of
# resource types on a cluster that holds almost nothing.
kube-state-metrics:
  kubernetes:
    resources:
      requests:
        cpu: 25m
