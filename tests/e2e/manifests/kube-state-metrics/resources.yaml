apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture
data:
  fixture: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: fixture
spec:
  selector:
    app.kubernetes.io/name: fixture
  ports:
    - name: fixture
      port: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture
spec:
  volumeName: replaced-by-test
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory
          image: ghcr.io/nvidia/topograph:v0.4.0@sha256:f227bf161464da4a23273a535914c98b33d26e5bf24bdf7f50159ab4b875b717
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep", "3600"]
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-fixture
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-fixture
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory
          image: ghcr.io/nvidia/topograph:v0.4.0@sha256:f227bf161464da4a23273a535914c98b33d26e5bf24bdf7f50159ab4b875b717
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep", "3600"]
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unscheduled
  labels:
    app.kubernetes.io/name: fixture
spec:
  schedulingGates:
    - name: nktp.nvidia.io/e2e
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  tolerations:
    - operator: Exists
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: memory
      image: ghcr.io/nvidia/topograph:v0.4.0@sha256:f227bf161464da4a23273a535914c98b33d26e5bf24bdf7f50159ab4b875b717
      imagePullPolicy: IfNotPresent
      command: ["/bin/sleep", "3600"]
      securityContext:
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
