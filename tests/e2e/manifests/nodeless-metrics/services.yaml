# Two Services in front of the blackbox exporter's metrics. The first is backed
# by its Pods, which have a node. The second has no selector; the test gives it
# an EndpointSlice with the exporter's ClusterIP and no node or Pod.
apiVersion: v1
kind: Service
metadata:
  name: nktp-e2e-ownership-pods
  labels:
    nktp.nvidia.io/e2e-ownership: "true"
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nktp-e2e-ownership-external
  labels:
    nktp.nvidia.io/e2e-ownership: "true"
spec:
  ports:
    - name: http
      port: 9115
