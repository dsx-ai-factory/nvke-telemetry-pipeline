apiVersion: v1
kind: Pod
metadata:
  generateName: nktp-e2e-dcgm-
  labels:
    app.kubernetes.io/name: nktp-e2e-dcgm
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  tolerations:
    - operator: Exists
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cuda
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04@sha256:7c7540bdf1f942d4fb6db97069fd6c289471b54ac29e3c7fcdf914cf77af7d41
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - while true; do /cuda-samples/vectorAdd; sleep 1; done
      resources:
        limits:
          nvidia.com/gpu: "1"
      securityContext:
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
